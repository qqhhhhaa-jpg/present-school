<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Cover</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--surface-100)}
.c{position:relative;width:960px;height:288px;overflow:hidden}
.nm{position:absolute;left:40px;bottom:36px;width:400px;direction:rtl;text-align:left}
.nm h1{margin:0;font-family:var(--font-ar);font-weight:700;font-size:120px;line-height:1.15;color:var(--ink)}
.nm p{margin:10px 0 0;font-family:var(--font-ar);font-size:14px;color:var(--muted)}
.b{fill:var(--brand)}.t{fill:var(--teal)}.a{fill:var(--amber)}.r{fill:var(--red)}.s{fill:var(--surface-300)}
.tl{rx:var(--radius-xl)}
</style></head>
<body><div class="c">
<svg width="960" height="288" viewBox="0 0 960 288" style="position:absolute;inset:0">
<!-- blocks: brand (3 tiles, one two-wide), teal (3, one two-wide), amber disc + pill, red small disc, surface-300 relief; 72px tiles = space-10+space-8
     arrangement: flush modular grid of app tiles right of x=480, like the AppTile sections and devices screens
     pattern: geometric, modular, dense UI -> tiles cut by radius-xl, some merged two-wide like the components ("الأقسام تُعرض كمربعات تطبيقات")
     scales: pitch 88 = 72 + space-4, gap space-4 (16), corners radius-xl (20), disc r = half of 72 -->
<rect class="b tl" x="496" y="24" width="160" height="72"/>
<rect class="t tl" x="672" y="24" width="72" height="72"/>
<rect class="s tl" x="760" y="24" width="72" height="72"/>
<circle class="a" cx="884" cy="60" r="36"/>
<rect class="s tl" x="496" y="112" width="72" height="72"/>
<rect class="b tl" x="584" y="112" width="72" height="72"/>
<rect class="t tl" x="672" y="112" width="160" height="72"/>
<rect class="b tl" x="848" y="112" width="72" height="160"/>
<rect class="t tl" x="496" y="200" width="72" height="72"/>
<rect class="a" x="584" y="218" width="160" height="36" rx="18"/>
<circle class="r" cx="796" cy="236" r="18"/>
</svg>
<div class="nm"><h1>حاضر</h1><p>مدرستك في جيبك: الحضور والدرجات والإشعارات في مكان واحد.</p></div>
</div></body></html>
