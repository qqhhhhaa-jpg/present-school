<style>
/* حاضر · Hader — design tokens from the Hader design system */
:root {
  --brand: #1E2B5C;
  --on-brand: #FFFFFF;
  --teal: #0B7F70;
  --on-teal: #FFFFFF;
  --teal-ink: #08695C;
  --teal-soft: #E8F4F1;
  --amber: #F2A93B;
  --on-amber: #1E2B5C;
  --amber-ink: #8A5A0B;
  --amber-soft: #FDF1DA;
  --red: #C8453F;
  --on-red: #FFFFFF;
  --red-ink: #A9372F;
  --red-soft: #FBEAE9;
  --surface-100: #F5F7FA;
  --surface-200: #FFFFFF;
  --surface-300: #EEF1F6;
  --line: #E3E8EF;
  --line-strong: #77829A;
  --ink: #1E2B5C;
  --muted: #5B6478;
  --focus: #0B7F70;
  --side: #1E2B5C;
  --side-ink: #DDE3F5;
  --shadow-pop: 0 18px 40px rgba(30, 43, 92, .18);
  --shadow-toast: 0 14px 30px rgba(30, 43, 92, .35);
  --font-ar: Cairo, "Plus Jakarta Sans", system-ui, sans-serif;
  --font-latin: "Plus Jakarta Sans", Cairo, system-ui, sans-serif;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  color-scheme: light;
}

/* Day mode only, as requested: no dark theme. */
:root[data-theme="dark"] {
  color-scheme: light
}

* {
  box-sizing: border-box
}

html,
body {
  margin: 0;
  height: 100%
}

body {
  background: var(--surface-100);
  color: var(--ink);
  font-family: var(--font-ar);
  font-size: 15px;
  line-height: 1.7
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px
}

h1,
h2,
h3 {
  margin: 0;
  line-height: 1.4;
  text-wrap: balance
}

h1 {
  font-size: 26px
}

h2 {
  font-size: 18px
}

h3 {
  font-size: 16px
}

.num {
  font-family: var(--font-latin);
  font-variant-numeric: tabular-nums;
  direction: ltr;
  unicode-bidi: isolate
}

.muted {
  color: var(--muted)
}

.small {
  font-size: 13px
}

[hidden] {
  display: none !important
}

/* layout */
.app {
  display: flex;
  min-height: 100%
}

.side {
  width: 200px;
  flex: none;
  background: linear-gradient(180deg, #22306A 0%, #1E2B5C 45%, #172250 100%);
  color: var(--side-ink);
  padding: 18px 6px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  transition: width .2s ease-out;
  overflow: hidden
}

.brand {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-start;
  padding: 2px 10px 16px;
  margin-bottom: 8px;
  border-bottom: 1px solid rgba(255, 255, 255, .1);
  color: #fff
}

.brand b {
  font-size: 22px
}

.brand small {
  display: block;
  font-size: 12px;
  color: var(--side-ink);
  line-height: 1.2
}

.nav a {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 5px 8px;
  min-height: 44px;
  white-space: nowrap;
  border-radius: 12px;
  color: var(--side-ink);
  text-decoration: none;
  font-size: 14.5px;
  font-weight: 600;
  transition: background .15s ease-out, color .15s ease-out
}

.nav a .ni {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  background: rgba(255, 255, 255, .06);
  color: #C9D2EE;
  transition: background .15s ease-out
}

.nav a:hover {
  background: rgba(255, 255, 255, .07);
  color: #fff
}

.nav a:hover .ni {
  background: rgba(255, 255, 255, .12);
  color: #fff
}

.nav a.on {
  background: rgba(255, 255, 255, .13);
  color: #fff;
  font-weight: 700
}

.nav a.on .ni {
  background: var(--teal);
  color: #fff
}

.nav a.on::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  top: 12px;
  bottom: 12px;
  width: 3px;
  border-radius: 3px;
  background: #F2A93B
}

.nav a:focus-visible {
  outline: 2px solid #34C3AE;
  outline-offset: 2px
}

.nsec {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .2px;
  color: rgba(221, 227, 245, .55);
  padding: 14px 12px 4px
}

.nav a .cnt {
  margin-inline-start: auto
}

/* sidebar: brand and account stay fixed, only the sections list scrolls */
.side .nav {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: 0 -4px;
  padding: 0 4px;
  scrollbar-width: thin
}

.me {
  flex: none;
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px;
  border-radius: 16px;
  background: rgba(10, 16, 40, .35);
  border: 1px solid rgba(255, 255, 255, .08);
  color: #fff;
  font-size: 13px;
  line-height: 1.5
}

.me .who {
  display: flex;
  gap: 10px;
  align-items: center
}

.me .who .ell+.ell,
.me .who span.ell {
  display: block;
  opacity: .75;
  font-size: 12px
}

.mebtn {
  width: 34px;
  height: 34px;
  flex: none;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, .2);
  background: none;
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer
}

.mebtn:hover {
  background: rgba(255, 255, 255, .1)
}

.ell {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}

.sidebtn {
  min-height: 36px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, .2);
  background: none;
  color: #fff;
  font-weight: 700;
  font-size: 12.5px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px
}

.sidebtn:hover {
  background: rgba(255, 255, 255, .08)
}

.logout {
  min-height: 42px;
  border-radius: 10px;
  border: 0;
  background: #C8453F;
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px
}

.logout:hover {
  filter: brightness(1.08)
}

.iconbtn.mob,
.mob {
  display: none
}

.logoutm {
  color: var(--red-ink);
  border-color: var(--red-ink)
}

.main {
  flex: 1;
  min-width: 0;
  padding: 22px 28px 90px;
  display: flex;
  flex-direction: column;
  gap: 18px
}

.top {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap
}

.top .t {
  flex: 1;
  min-width: 200px
}

.bnav {
  display: none
}

/* controls */
.btn {
  min-height: 44px;
  padding: 0 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--line-strong);
  background: var(--surface-200);
  color: var(--ink);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap
}

.btn:hover {
  filter: brightness(.97)
}

.btn.pr {
  background: var(--teal);
  border-color: var(--teal);
  color: var(--on-teal)
}

.btn.nv {
  background: var(--brand);
  border-color: var(--brand);
  color: var(--on-brand)
}

.btn.dg {
  border-color: var(--red-ink);
  color: var(--red-ink)
}

.btn.sm {
  min-height: 34px;
  padding: 0 12px;
  font-size: 13px
}

.btn[disabled] {
  opacity: .5;
  cursor: not-allowed
}

.input,
select.input {
  min-height: 44px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  padding: 0 12px;
  background: var(--surface-200);
  width: 100%
}

.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 13px;
  font-weight: 700
}

.field .help {
  font-weight: 400;
  color: var(--muted);
  font-size: 12px
}

.field.err .input {
  border-color: var(--red-ink)
}

.field.err .help {
  color: var(--red-ink);
  font-weight: 700
}

.search {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  background: var(--surface-200);
  width: min(380px, 100%);
  position: relative
}

.search input {
  border: 0;
  background: none;
  outline: none;
  flex: 1;
  min-width: 0
}

.sbadge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--surface-300);
  color: var(--ink);
  white-space: nowrap;
  flex: none;
  line-height: 1.4;
  margin-inline-end: 2px;
  letter-spacing: -.2px;
  transition: all .15s ease
}

.sbadge.sbadge-global {
  background: var(--amber-soft);
  color: var(--amber-ink);
  border: 1px solid rgba(242, 169, 59, .45)
}

.kbd {
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding: 0 7px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  font-family: var(--font-latin)
}

.seg {
  display: inline-flex;
  background: var(--surface-300);
  border-radius: var(--r-md);
  padding: 4px;
  gap: 4px;
  flex-wrap: wrap
}

.seg button {
  border: 0;
  background: none;
  padding: 7px 14px;
  border-radius: 9px;
  font-weight: 700;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer
}

.seg button[aria-pressed="true"] {
  background: var(--surface-200);
  color: var(--ink)
}

.toggle {
  width: 44px;
  height: 26px;
  border-radius: 999px;
  background: var(--line-strong);
  position: relative;
  border: 0;
  cursor: pointer;
  flex: none
}

.toggle::after {
  content: "";
  position: absolute;
  top: 3px;
  right: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--surface-200);
  transition: right .2s
}

.toggle[aria-checked="true"] {
  background: var(--teal)
}

.toggle[aria-checked="true"]::after {
  right: 21px
}

/* surfaces */
.card {
  background: var(--surface-200);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px
}

.grid {
  display: grid;
  gap: 16px
}

.g4 {
  grid-template-columns: repeat(4, minmax(0, 1fr))
}

.g3 {
  grid-template-columns: repeat(3, minmax(0, 1fr))
}

.g2 {
  grid-template-columns: repeat(2, minmax(0, 1fr))
}

.split {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 16px
}

.stat .n {
  font: 700 36px/1.2 var(--font-latin);
  font-variant-numeric: tabular-nums;
  margin-top: 6px
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line)
}

.row:last-child {
  border-bottom: 0
}

.bar {
  height: 10px;
  border-radius: 6px;
  background: var(--surface-300);
  overflow: hidden;
  flex: 1
}

.bar i {
  display: block;
  height: 100%;
  border-radius: 6px;
  background: var(--teal);
  transition: width .4s
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  line-height: 20px
}

.p-present {
  background: var(--teal);
  color: var(--on-teal)
}

.p-late {
  background: var(--amber);
  color: var(--on-amber)
}

.p-absent {
  background: var(--red);
  color: var(--on-red)
}

.p-excused {
  background: var(--amber-soft);
  color: var(--amber-ink)
}

.p-left {
  background: var(--brand);
  color: var(--on-brand)
}

.p-pending,
.p-quiet,
.p-none,
.p-holiday {
  background: var(--surface-300);
  color: var(--ink)
}

.cnt {
  min-width: 22px;
  height: 22px;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--red);
  color: var(--on-red);
  font: 700 12px/22px var(--font-latin);
  text-align: center;
  display: inline-block
}

.av {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  flex: none;
  background: var(--brand);
  color: var(--on-brand)
}

.av.present {
  background: var(--teal);
  color: var(--on-teal)
}

.av.late,
.av.excused {
  background: var(--amber);
  color: var(--on-amber)
}

.av.absent {
  background: var(--red);
  color: var(--on-red)
}

.av.pending {
  background: var(--surface-300);
  color: var(--muted)
}

.av.left {
  background: var(--brand);
  color: var(--on-brand)
}

.iconbtn {
  position: relative;
  width: 44px;
  height: 44px;
  border-radius: var(--r-md);
  border: 1px solid var(--line-strong);
  background: var(--surface-200);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ink)
}

.iconbtn .cnt {
  position: absolute;
  top: -8px;
  left: -8px;
  border: 2px solid var(--surface-100)
}

.clock {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--surface-300);
  font-size: 13px;
  font-weight: 700
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--teal);
  display: inline-block
}

.dot.live {
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--teal) 25%, transparent);
  animation: pulse 1.6s infinite
}

@keyframes pulse {
  50% {
    box-shadow: 0 0 0 7px transparent
  }
}

table {
  width: 100%;
  border-collapse: collapse
}

th,
td {
  text-align: right;
  padding: 10px 8px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  vertical-align: middle
}

th {
  color: var(--muted);
  font-weight: 700;
  font-size: 13px
}

.tablewrap {
  overflow-x: auto
}

.empty {
  padding: 30px;
  text-align: center;
  color: var(--muted)
}

/* tiles */
.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 14px
}

.tile {
  border-radius: var(--r-xl);
  border: 1px solid var(--line);
  background: var(--surface-200);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px
}

.tile.ok {
  background: var(--teal-soft);
  border-color: var(--teal)
}

.tile.bad {
  background: var(--red-soft);
  border-color: var(--red)
}

.ti {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--brand);
  color: var(--on-brand);
  font: 700 18px var(--font-latin);
  flex: none
}

.tile.ok .ti {
  background: var(--teal);
  color: var(--on-teal)
}

.tile.bad .ti {
  background: var(--red);
  color: var(--on-red)
}

.secs {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  gap: 8px
}

.sec {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 10px;
  background: var(--surface-100);
  cursor: pointer;
  text-align: right
}

.sec b {
  display: block;
  font-size: 16px
}

.sec span {
  font-size: 12px;
  color: var(--muted)
}

.sec.ok {
  background: var(--teal-soft);
  border-color: var(--teal)
}

.sec.warn {
  background: var(--amber-soft);
  border-color: var(--amber)
}

.sgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 8px
}

.st {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 4px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  border: 1px solid transparent;
  background: var(--surface-100)
}

.st.present {
  background: var(--teal-soft)
}

.st.late {
  background: var(--amber-soft)
}

.st.absent {
  background: var(--red-soft)
}

.st.excused {
  border-color: var(--amber)
}

.st .av {
  width: 46px;
  height: 46px
}

/* feed */
.feed .row {
  animation: none
}

.feed .row.new {
  animation: flash 1.2s ease-out
}

@keyframes flash {
  from {
    background: var(--teal-soft)
  }

  to {
    background: transparent
  }
}

/* overlays */
.toasts {
  position: fixed;
  top: calc(14px + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(420px, calc(100% - 32px))
}

.toast {
  display: flex;
  gap: 12px;
  align-items: center;
  background: var(--brand);
  color: var(--on-brand);
  border-radius: var(--r-lg);
  padding: 12px 16px;
  box-shadow: var(--shadow-toast);
  animation: drop .3s ease-out
}

.toast small {
  display: block;
  opacity: .85;
  font-size: 12px
}

@keyframes drop {
  from {
    opacity: 0;
    transform: translateY(-14px)
  }
}

.scrim {
  position: fixed;
  inset: 0;
  background: rgba(15, 20, 36, .45);
  z-index: 40;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 60px 16px;
  overflow: auto
}

.modal {
  background: var(--surface-200);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-pop);
  width: min(560px, 100%);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 14px
}

.modal header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px
}

.pop {
  position: absolute;
  top: 52px;
  left: 0;
  width: min(420px, 92vw);
  background: var(--surface-200);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-pop);
  z-index: 30;
  max-height: 70vh;
  overflow: auto
}

.pop .row {
  padding: 10px 14px;
  cursor: pointer
}

.pop .row:hover,
.pop .row.on {
  background: var(--surface-300)
}

mark {
  background: var(--amber-soft);
  color: inherit;
  border-radius: 3px
}

/* login */
.login {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  grid-template-columns: 1fr minmax(320px, 42%)
}

.login .form {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px
}

.login .form>div {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 16px
}

.login aside {
  background: var(--brand);
  color: var(--on-brand);
  padding: 48px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 24px
}

.otp {
  display: flex;
  gap: 8px;
  justify-content: center;
  direction: ltr
}

.otp input {
  width: 48px;
  height: 56px;
  text-align: center;
  font: 700 22px var(--font-latin);
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: var(--surface-200)
}

.demo {
  background: var(--amber-soft);
  border: 1px solid var(--amber);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.8
}

.demo button {
  background: none;
  border: 0;
  padding: 0;
  color: var(--teal-ink);
  font-weight: 700;
  cursor: pointer;
  text-decoration: underline
}

/* responsive */
@media (max-width:1100px) {
  .g4 {
    grid-template-columns: repeat(2, minmax(0, 1fr))
  }

  .split {
    grid-template-columns: 1fr
  }

  .g3 {
    grid-template-columns: 1fr 1fr
  }
}

@media (max-width:760px) {
  .side {
    display: none
  }

  .iconbtn.mob,
  .mob {
    display: inline-flex
  }

  .main {
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px))
  }

  .g3,
  .g2 {
    grid-template-columns: 1fr
  }

  h1 {
    font-size: 22px
  }

  .bnav {
    display: flex;
    position: fixed;
    bottom: 0;
    inset-inline: 0;
    background: var(--surface-200);
    border-top: 1px solid var(--line);
    padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 20
  }

  .bnav a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-decoration: none;
    position: relative;
    padding-top: 4px
  }

  .bnav a.on {
    color: var(--ink)
  }

  .bnav a .cnt {
    position: absolute;
    top: -4px;
    left: calc(50% - 26px);
    min-width: 18px;
    height: 18px;
    line-height: 18px;
    font-size: 10px
  }

  .login {
    grid-template-columns: 1fr
  }

  .login aside {
    display: none
  }

  .stat .n {
    font-size: 28px
  }

  .search {
    width: 100%
  }
}

@media (prefers-reduced-motion:reduce) {
  * {
    animation: none !important;
    transition: none !important
  }
}

/* print: the monthly report prints cleanly on A4 */
@media print {
  @page {
    size: A4 landscape;
    margin: 10mm
  }

  .side,
  .bnav,
  .search,
  .clock,
  .iconbtn,
  .btn,
  .seg,
  .toasts {
    display: none !important
  }

  body {
    background: #fff;
    color: #000
  }

  .main {
    padding: 0
  }

  .card {
    border-color: #ccc;
    break-inside: avoid
  }

  .mtab th,
  .mtab td {
    padding: 3px 2px;
    font-size: 10px
  }
}

/* Notification bell panel */
.bellwrap {
  position: relative;
  display: inline-flex
}

.npop {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  width: min(380px, calc(100vw - 32px));
  max-height: min(70vh, 520px);
  overflow: auto;
  background: var(--surface-200);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-pop);
  z-index: 40;
  text-align: right
}

.npop .row {
  align-items: flex-start
}

[data-bell][aria-expanded="true"] {
  background: var(--brand);
  color: var(--on-brand);
  border-color: var(--brand)
}

/* bottom nav keeps plain icons */
.bnav a .ni {
  width: auto;
  height: auto;
  background: none;
  border-radius: 0;
  color: inherit
}

.bnav a.on::before {
  display: none
}

/* Sidebar: floating rounded card, collapsible to icons only */
.brand {
  flex-direction: row;
  align-items: flex-start;
  justify-content: space-between
}

.brand .bmain {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0
}

.collapse {
  width: 30px;
  height: 30px;
  flex: none;
  border-radius: 9px;
  border: 1px solid rgba(255, 255, 255, .18);
  background: none;
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform .2s ease-out
}

.collapse:hover {
  background: rgba(255, 255, 255, .1)
}

.nav a {
  min-height: 42px
}

.app.mini .side {
  width: 72px;
  padding: 18px 8px 12px
}

.app.mini .brand {
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 0 0 12px
}

.app.mini .brand .bmain small,
.app.mini .nsec,
.app.mini .nav a>span:not(.cnt),
.app.mini .me .who>div,
.app.mini .sidebtn,
.app.mini .mebtn {
  display: none
}

.app.mini .brand .bmain svg {
  width: 52px;
  height: auto
}

.app.mini .collapse {
  transform: scaleX(-1)
}

.app.mini .nav a {
  justify-content: center;
  padding: 6px 0
}

.app.mini .nav a .cnt {
  position: absolute;
  top: 2px;
  left: 6px;
  min-width: 18px;
  height: 18px;
  line-height: 18px;
  font-size: 10px;
  padding: 0 5px
}

.app.mini .nav a.on::before {
  inset-inline-start: -2px
}

.app.mini .nsec+a,
.app.mini .nav a+.nsec {
  margin-top: 6px
}

.app.mini .me {
  padding: 8px;
  align-items: center
}

.app.mini .me .who {
  justify-content: center
}

.app.mini .logout {
  width: 44px;
  height: 42px;
  padding: 0;
  font-size: 0;
  gap: 0
}

.app.mini .logout svg {
  width: 20px;
  height: 20px
}

@media (prefers-reduced-motion:reduce) {

  .side,
  .collapse {
    transition: none
  }
}

/* Sidebar sections still scroll, but without a visible scrollbar */
.side .nav {
  scrollbar-width: none;
  -ms-overflow-style: none
}

.side .nav::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0
}

.nav a>span:not(.cnt) {
  overflow: hidden;
  text-overflow: ellipsis
}

.sec.add {
  border-style: dashed;
  background: var(--surface-200);
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px
}

.sec.add:hover {
  color: var(--ink);
  border-color: var(--line-strong)
}

.backbtn {
  flex: none
}

/* student face photo */
.av.ph {
  padding: 0;
  overflow: hidden;
  background: var(--surface-300)
}

.av.ph img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block
}

.facebox {
  margin: 0;
  width: 120px;
  flex: none;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid var(--teal);
  background: var(--surface-300);
  position: relative
}

.facebox img {
  display: block;
  width: 100%;
  height: 150px;
  object-fit: cover
}

.facebox figcaption {
  position: absolute;
  bottom: 0;
  inset-inline: 0;
  background: rgba(17, 25, 54, .75);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  text-align: center;
  padding: 3px
}

.facebox.empty {
  height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  border: 2px dashed var(--line-strong)
}

/* ---------- assistant chat ---------- */
.chatcard {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 820px
}

.chat {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 320px;
  max-height: 58vh;
  overflow: auto;
  padding: 6px 2px;
  scroll-behavior: smooth
}

.msg {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 82%
}

.msg .bub {
  padding: 11px 14px;
  border-radius: 16px;
  line-height: 1.75;
  font-size: 15px
}

.msg.user {
  align-self: flex-start;
  align-items: flex-start
}

.msg.user .bub {
  background: var(--ink);
  color: #fff;
  border-end-start-radius: 4px;
  border-start-start-radius: 16px;
  border-top-right-radius: 4px
}

.msg.bot,
.msg.staff {
  align-self: flex-end;
  align-items: flex-end
}

.msg.bot .bub {
  background: var(--surface-100);
  border: 1px solid var(--line);
  border-top-left-radius: 4px
}

.msg.staff .bub {
  background: #E6F4F1;
  border: 1px solid #9FD6CC;
  border-top-left-radius: 4px
}

.msg .who {
  font-size: 12px;
  font-weight: 700;
  color: var(--teal)
}

.msg .t {
  font-size: 11px;
  color: var(--muted)
}

.msg .acts {
  display: flex;
  gap: 6px;
  flex-wrap: wrap
}

.typing {
  display: flex;
  gap: 5px;
  align-items: center;
  min-height: 22px
}

.typing i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--muted);
  animation: blink 1.2s infinite
}

.typing i:nth-child(2) {
  animation-delay: .2s
}

.typing i:nth-child(3) {
  animation-delay: .4s
}

@keyframes blink {

  0%,
  80%,
  100% {
    opacity: .25
  }

  40% {
    opacity: 1
  }
}

.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap
}

.chip {
  border: 1px solid var(--line-strong);
  background: var(--surface-200);
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  color: var(--ink);
  min-height: 36px
}

.chip:hover {
  border-color: var(--teal);
  color: var(--teal)
}

.chatin {
  display: flex;
  gap: 8px
}

.chatin .input {
  flex: 1;
  min-height: 48px
}

.chatin .btn {
  min-height: 48px;
  width: 52px;
  padding: 0
}

.ticket {
  display: flex;
  flex-direction: column;
  gap: 10px
}

.ticket.open {
  border-inline-start: 4px solid var(--amber)
}

.ticket .q {
  background: var(--surface-100);
  border-radius: 12px;
  padding: 10px 14px;
  line-height: 1.8
}

.ticket .rep {
  border-inline-start: 3px solid var(--teal);
  padding: 4px 12px
}

/* ---------- import ---------- */
.drop {
  border: 2px dashed var(--line-strong);
  border-radius: 16px;
  padding: 30px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  cursor: pointer;
  color: var(--ink);
  background: var(--surface-100)
}

.drop:hover,
.drop.over {
  border-color: var(--teal);
  background: #EEF8F6
}

.imptbl th {
  position: sticky;
  top: 0;
  background: var(--surface-200);
  z-index: 1;
  min-width: 130px;
  vertical-align: top
}

.imptbl th:first-child {
  min-width: 34px
}

.imptbl .input.sm {
  min-height: 34px;
  font-size: 13px;
  padding: 0 6px
}

.imptbl tr.bad td {
  background: #FFF7F6
}

.imptbl td.cellbad {
  color: var(--red-ink);
  font-weight: 700;
  text-decoration: underline wavy
}

.btn[disabled] {
  opacity: .5;
  cursor: not-allowed
}

/* ---------- dashboard ---------- */
.dash {
  display: flex;
  flex-direction: column;
  gap: 16px
}

.kpi {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 16px 18px
}

.kpi .kh {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 14px;
  color: var(--muted)
}

.ki {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none
}

.ki.t {
  background: var(--teal-soft);
  color: var(--teal)
}

.ki.a {
  background: var(--amber-soft);
  color: var(--amber-ink)
}

.ki.r {
  background: var(--red-soft);
  color: var(--red-ink)
}

.kpi .kn {
  font: 700 34px/1.15 var(--font-latin);
  color: var(--ink)
}

.kpi .kf {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 30px
}

.spark {
  width: 96px;
  height: 30px;
  flex: none
}

.dl {
  font: 700 12px var(--font-latin);
  padding: 3px 8px;
  border-radius: 999px
}

.dl.up {
  background: var(--teal-soft);
  color: var(--teal-ink)
}

.dl.down {
  background: var(--red-soft);
  color: var(--red-ink)
}

.dgrid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr);
  gap: 16px
}

.dgrid:nth-of-type(3) {
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr)
}

.dgrid.three {
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr)
}

.ch {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap
}

.ch h2 {
  font-size: 16px
}

.dnwrap {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  justify-content: center
}

.donut {
  width: 170px;
  height: 170px;
  flex: none
}

.donut .dn {
  font: 700 28px var(--font-latin);
  fill: var(--ink)
}

.donut .ds {
  font: 600 12px var(--font-ar);
  fill: var(--muted)
}

.legend {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 140px;
  flex: 1
}

.legend div {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px
}

.legend i {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  flex: none
}

.legend span {
  flex: 1
}

.legend b {
  font-family: var(--font-latin)
}

.chart {
  width: 100%;
  height: auto;
  display: block
}

.chart .ax {
  font: 600 10.5px var(--font-latin);
  fill: var(--muted)
}

.lg {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  margin-inline-end: 6px;
  vertical-align: middle
}

.secrank {
  display: flex;
  flex-direction: column;
  gap: 9px
}

.sr {
  display: grid;
  grid-template-columns: 92px 1fr 44px;
  gap: 10px;
  align-items: center;
  color: inherit;
  text-decoration: none;
  font-size: 14px
}

.sr:hover span {
  color: var(--teal)
}

.stack {
  display: flex;
  height: 12px;
  border-radius: 6px;
  overflow: hidden;
  background: var(--surface-300)
}

.stack i {
  display: block;
  height: 100%
}

.sr b {
  text-align: left;
  font-family: var(--font-latin)
}

.rk {
  color: inherit;
  text-decoration: none;
  padding: 8px 0
}

.rn {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--surface-300);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex: none
}

.al {
  color: inherit;
  text-decoration: none;
  font-size: 14px
}

.al svg:last-child {
  color: var(--muted);
  transform: scaleX(-1)
}

.qa {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px
}

.qa .btn {
  justify-content: flex-start
}

@media (max-width:1100px) {

  .dgrid,
  .dgrid:nth-of-type(3),
  .dgrid.three {
    grid-template-columns: 1fr
  }
}

@media (max-width:760px) {
  .kpis {
    grid-template-columns: 1fr 1fr
  }

  .kpi .kn {
    font-size: 28px
  }

  .spark {
    width: 70px
  }
}

@media print {

  .side,
  .bnav,
  .topbar .actions,
  .search,
  [data-print],
  .iconbtn,
  .backbtn,
  .qa {
    display: none !important
  }

  .app {
    display: block !important
  }

  .main {
    padding: 0 !important
  }

  .card {
    break-inside: avoid;
    box-shadow: none
  }

  body {
    background: #fff
  }
}

.modal.wide {
  width: min(940px, 100%);
  max-height: 92vh;
  overflow: auto
}

.holnote {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 16px;
  background: var(--amber-soft);
  border-color: #F2D29A
}

/* ---------- timetable ---------- */
.ttwrap {
  overflow-x: auto;
  margin: 0 -4px;
  padding: 0 4px
}

.tt {
  border-collapse: separate;
  border-spacing: 6px;
  width: 100%;
  min-width: 720px;
  table-layout: fixed
}

.tt th,
.tt td {
  border: 0;
  padding: 0;
  text-align: center;
  vertical-align: stretch
}

.tt thead th {
  font-size: 13px;
  padding-bottom: 2px
}

.tt thead th b {
  display: block
}

.tt thead th span {
  display: block;
  font-size: 11px;

/* Core glossy 3D squircle styling applied uniformly across every section, grade, division, KPI, tile & nav icon */
.tip,
.ti,
.ap-ico,
.stg-h .stg-i,
.sec.sc .sl,
.ki,
.side .nav a .ni,
.mti {
  position: relative;
  overflow: hidden;
  color: #fff !important;
  background: linear-gradient(145deg, color-mix(in srgb, var(--ic, #1E2B5C) 84%, #fff) 0%, var(--ic, #1E2B5C) 56%, color-mix(in srgb, var(--ic, #1E2B5C) 82%, #0A1026) 100%) !important;
  box-shadow: 0 6px 14px -4px color-mix(in srgb, var(--ic, #1E2B5C) 52%, transparent), inset 0 1px 0 rgba(255, 255, 255, .30), inset 0 -2px 0 rgba(0, 0, 0, .14) !important;
}

.tip::before,
.ti::before,
.ap-ico::before,
.stg-h .stg-i::before,
.sec.sc .sl::before,
.ki::before,
.side .nav a .ni::before,
.mti::before {
  content: "" !important;
  display: block !important;
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(120% 70% at 30% 0%, rgba(255, 255, 255, .30), transparent 60%);
  pointer-events: none;
}

.tip>*,
.ti>*,
.ap-ico>*,
.stg-h .stg-i>*,
.sec.sc .sl>*,
.ki>*,
.side .nav a .ni>*,
.mti>* {
  position: relative;
  z-index: 1
}

/* Specific sizing & color tokens per icon family */
.ti {

}

.tile.ok .ti {
  --ic: #0B7F70
}

.tile.bad .ti {
  --ic: #C8453F
}

.ap-ico {
  --ic: #1E2B5C;
  border-radius: 14px
}

.ap-ico.lg {
  border-radius: 15px
}

.sec.sc .sl {
  --ic: var(--c);
  width: 30px;
  height: 30px;
  border-radius: 10px;
  box-shadow: 0 4px 10px -3px color-mix(in srgb, var(--c) 55%, transparent), inset 0 1px 0 rgba(255, 255, 255, .30), inset 0 -1.5px 0 rgba(0, 0, 0, .14) !important
}

.ki {
  --ic: #1E2B5C;
  width: 34px;
  height: 34px;
  border-radius: 11px
}

.ki.t {
  --ic: #0B7F70
}

.ki.a {
  --ic: #C47F17
}

.ki.r {
  --ic: #C8453F
}

.side .nav a .ni {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  box-shadow: 0 4px 10px -2px rgba(7, 12, 32, .48), inset 0 1px 0 rgba(255, 255, 255, .32), inset 0 -2px 0 rgba(0, 0, 0, .18) !important;
  transition: transform .15s ease, box-shadow .15s ease
}

.side .nav a:hover .ni {
  transform: translateY(-1px);

}

.side .nav a.on .ni {
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .32), 0 6px 14px -2px rgba(7, 12, 32, .55), inset 0 1px 0 rgba(255, 255, 255, .40), inset 0 -2px 0 rgba(0, 0, 0, .16) !important
}

.mti {

  height: 44px;

}

a.sec.sc {
  color: inherit;
  text-decoration: none
}

/* ===== Fixed misty blue glow behind every app card/tile (icons untouched) ===== */
:root {
  --app-glow: 0 0 0 1px rgba(59, 130, 246, .16), 0 6px 22px 0 rgba(37, 99, 235, .22), 0 0 34px 4px rgba(96, 165, 250, .20);
  --app-glow-sm: 0 0 0 1px rgba(59, 130, 246, .16), 0 2px 12px 0 rgba(59, 130, 246, .18);
}

.tiles,
.ap-grid {
  gap: 18px
}

.tile,
.ap-tile,
.mtile,
.card.kpi,
.card.pcard,
button.card[data-sheet] {
  box-shadow: var(--app-glow) !important;
  border-color: rgba(59, 130, 246, .22) !important;
}

.tile:hover,
.ap-tile:hover,
.mtile:hover {
  box-shadow: var(--app-glow) !important;
  transform: none !important;
}

.ap-tile::before {
  content: none !important;
  display: none !important
}

.sec.sc {
  box-shadow: var(--app-glow-sm) !important;
  border-color: rgba(59, 130, 246, .20) !important;
}

.sec.sc:hover {
  box-shadow: var(--app-glow-sm) !important;
  background: var(--surface-200) !important;
  border-color: rgba(59, 130, 246, .38) !important;
}

/* ===== Section edit/delete mini action bar in Classes ===== */
.secs:has(.sec-box) {
  grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
  gap: 8px
}

.sec-box {
  display: flex;
  flex-direction: column;
  gap: 4px
}

.sec-acts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px
}

.sec-act {
  border: 1px solid var(--line);
  background: var(--surface-100);
  color: var(--ink);
  border-radius: 8px;
  padding: 4px 4px;
  font: 700 11px var(--font-ar);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  white-space: nowrap;
  transition: background .12s, border-color .12s, color .12s
}

.sec-act:hover {
  background: var(--surface-300);
  border-color: var(--line-strong)
}

.sec-act.del {
  color: var(--red-ink);
  background: var(--red-soft);
  border-color: rgba(200, 69, 63, .25)
}

.sec-act.del:hover {
  background: var(--red);
  color: #fff;
  border-color: var(--red)
}

.btn.danger-solid:disabled {
  opacity: .45;
  cursor: not-allowed
}

/* ===== Arrival proof upload & 30-day auto-purge UI ===== */
.ev-ttl {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--teal-soft);
  border: 1px solid rgba(11, 127, 112, .25);
  color: var(--teal-ink);
  font-size: 12.5px;
  line-height: 1.5
}

.ev-ttl.exp {
  background: var(--amber-soft);
  border-color: rgba(196, 127, 23, .35);
  color: var(--amber-ink)
}

.ev-ttl svg {
  flex: none;
  margin-top: 2px
}

.ev-expired {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
  padding: 22px 16px;
  border-radius: 14px;
  border: 1.5px dashed var(--line-strong);
  background: var(--surface-100);
  color: var(--ink)
}

.ev-upbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--surface-100);
  border: 1px solid var(--line)
}

.ev-thumb {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface-200);
  cursor: pointer;
  text-align: right;
  font: inherit;
  color: var(--ink)
}

.ev-thumb img {
  width: 46px;
  height: 46px;
  border-radius: 9px;
  object-fit: cover;
  flex: none;
  border: 1px solid var(--line)
}

.ev-thumb span {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px
}

.ev-thumb small {
  font-size: 11.5px;
  color: var(--muted)
}

/* ===== Compact side-by-side proof modal (RTL: info right, photo left, zero scroll) ===== */
.modal.ev-compact {
  width: min(660px, 96vw);
  padding: 16px 18px;
  gap: 10px;
  overflow: visible
}

.modal.ev-compact header {
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line)
}

.modal.ev-compact header h2 {
  font-size: 15.5px;
  margin: 0
}

.ev-split {
  display: grid;
  grid-template-columns: 1fr 205px;
  gap: 14px;
  align-items: stretch
}

.ev-info-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0
}

.modal.ev-compact .ev-ttl {
  padding: 7px 10px;
  border-radius: 10px;
  font-size: 12px;
  align-items: center
}

.modal.ev-compact .ev-ttl svg {
  margin-top: 0
}

.modal.ev-compact .evfacts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px
}

.modal.ev-compact .evfacts div {
  padding: 7px 10px;
  border-radius: 9px
}

.modal.ev-compact .evfacts span {
  font-size: 11px
}

.modal.ev-compact .evfacts b {
  font-size: 12.5px;
  line-height: 1.35;
  word-break: break-word
}

.ev-photo-col {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
  justify-content: center
}

.ev-photo-col img {
  width: 100%;
  height: 245px;
  object-fit: cover;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #1B2235;
  display: block
}

.ev-photo-col img.fp {
  object-fit: contain;
  background: #F7F9FC
}

.ev-tabs {
  display: flex;
  gap: 4px;
  width: 100%;
  justify-content: center;
  flex-wrap: wrap
}

.ev-tab {
  flex: 1;
  border: 1px solid var(--line);
  background: var(--surface-100);
  color: var(--muted);
  border-radius: 8px;
  padding: 4px 6px;
  font: 700 11px var(--font-ar);
  cursor: pointer;
  white-space: nowrap
}

.ev-tab.on {
  background: var(--brand);
  color: #fff;
  border-color: var(--brand)
}

.ev-side-box {
  padding: 14px 10px;
  min-height: 190px;
  justify-content: center;
  max-width: none
}

@media (max-width:580px) {
  .modal.ev-compact {
    padding: 12px 14px
  }

  .ev-split {
    grid-template-columns: 1fr 125px;
    gap: 10px
  }

  .ev-photo-col img {
    height: 165px
  }

  .modal.ev-compact .evfacts {
    grid-template-columns: 1fr 1fr;
    gap: 5px
  }

  .modal.ev-compact .evfacts div {
    padding: 5px 7px
  }

  .modal.ev-compact .evfacts b {
    font-size: 11.5px
  }
}

/* ===== Fixed misty blue glow across ALL accounts (Owner, Admin, Teacher, Parent, Student & Login) ===== */
.main .card,
.login .card {
  box-shadow: var(--app-glow) !important;
  border-color: rgba(59, 130, 246, .22) !important;
}

.main .card .card,
.modal .card {
  box-shadow: none !important;
  border-color: var(--line) !important;
}

.st {
  box-shadow: var(--app-glow-sm) !important;
  border-color: rgba(59, 130, 246, .20) !important;
}

/* ===== Color-coded Grade Subject App Cards (Pass=Green, 50-65=Yellow+Note, Fail=Red) ===== */
.main .card.mk-card {
  cursor: pointer;
  text-align: right;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 15px 16px;
  font: inherit;
  color: var(--ink);
  transition: transform .14s ease;
}

.main .card.mk-card:hover {
  transform: translateY(-2px);
}

.mk-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.mk-top b {
  font-size: 15px;
  font-weight: 800;
  color: var(--ink);
}

.mk-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 999px;
  white-space: nowrap;
}

.mk-pct {
  font-size: 28px;
  font-weight: 800;
  line-height: 1.1;
}

.mk-bar {
  height: 6px;
  border-radius: 999px;
  background: rgba(30, 43, 92, .08);

}

.mk-bar i {
  display: block;
  height: 100%;
  border-radius: 999px;
}

/* Pass (> 65%): Green */
.main .card.mk-card.mk-pass {
  background: linear-gradient(155deg, #FFFFFF 0%, #E7F7F2 100%) !important;
  border-color: rgba(11, 127, 112, .38) !important;
  box-shadow: 0 0 0 1px rgba(11, 127, 112, .16), 0 6px 20px 0 rgba(11, 127, 112, .20), 0 0 28px 2px rgba(16, 185, 129, .16) !important;
}

.mk-pass .mk-pct {
  color: var(--teal-ink);
}

.mk-pass .mk-badge {
  background: var(--teal);
  color: #fff;
}

.mk-pass .mk-bar i {
  background: var(--teal);
}

/* Caution (50% - 65%): Yellow + gentle note */
.main .card.mk-card.mk-warn {
  background: linear-gradient(155deg, #FFFFFF 0%, #FEF5DE 100%) !important;
  border-color: rgba(217, 146, 20, .48) !important;
  box-shadow: 0 0 0 1px rgba(217, 146, 20, .18), 0 6px 20px 0 rgba(242, 169, 59, .26), 0 0 28px 2px rgba(245, 158, 11, .18) !important;
}

.mk-warn .mk-pct {
  color: var(--amber-ink);
}

.mk-warn .mk-badge {
  background: var(--amber);
  color: var(--on-amber);
}

.mk-warn .mk-bar i {
  background: var(--amber);
}

/* Fail (< 50%): Red */
.main .card.mk-card.mk-fail {
  background: linear-gradient(155deg, #FFFFFF 0%, #FDECEC 100%) !important;
  border-color: rgba(200, 69, 63, .44) !important;
  box-shadow: 0 0 0 1px rgba(200, 69, 63, .18), 0 6px 20px 0 rgba(200, 69, 63, .24), 0 0 28px 2px rgba(239, 68, 68, .18) !important;
}

.mk-fail .mk-pct {
  color: var(--red-ink);
}

.mk-fail .mk-badge {
  background: var(--red);
  color: #fff;
}

.mk-fail .mk-bar i {
  background: var(--red);
}

.main .card.mk-card.mk-sel {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}

.mk-note {
  margin-top: 2px;
  padding: 6px 9px;
  border-radius: 8px;
  background: rgba(242, 169, 59, .20);
  border: 1px solid rgba(196, 127, 23, .30);
  color: var(--amber-ink);
  font-size: 11.5px;
  font-weight: 700;
  line-height: 1.45;
}

.mk-note-inline {
  margin-top: 4px;

  padding: 2px 8px;
  border-radius: 7px;
  background: var(--amber-soft);
  border: 1px solid rgba(196, 127, 23, .30);
  color: var(--amber-ink);

}

/* ===== Focused Section Mode (shows only the opened section interface across all accounts) ===== */
.side-scrim {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 48, .36);
  backdrop-filter: blur(2px);
  z-index: 38;
}

.app.sec-focus {
  display: block;
}

.app.sec-focus .main {
  width: 100%;
  max-width: 100%;
  min-height: 100vh;
}

.app.sec-focus .side {
  position: fixed;
  top: 0;
  inset-inline-start: 0;
  bottom: 0;
  z-index: 40;
  width: 240px !important;
  transform: translateX(105%);
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 20px 50px rgba(15, 23, 48, .35);
  transition: transform .22s cubic-bezier(.22, 1, .36, 1), opacity .18s ease;
}

.app.sec-focus.side-open .side {
  transform: translateX(0);
  opacity: 1;
  pointer-events: auto;
}

.app.sec-focus.side-open .side-scrim {
  display: block;
}

.nav-toggle-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--brand);
  color: #fff;
  border-color: var(--brand);
  font-weight: 800;
  padding: 0 12px;
  min-height: 36px;
  border-radius: 10px;
}

.nav-toggle-btn:hover {
  background: #283A7A;
  color: #fff;
  border-color: #283A7A;
}

  .nav-toggle-btn,
  .side-scrim {
    display: none !important;
  }

   Default: the real time of the device (Baghdad time for users in Iraq).
   Optional demo mode: a school-day clock that starts at 7:50 and runs faster,
   so arrivals, lateness and the 8:30 absence alert can be watched in minutes. */
function now() {
  const c = S.clock;
  if (c.mode === 'real') return Date.now();
  const v = c.virtual + (c.paused ? 0 : (Date.now() - c.real) * c.speed);
  return Math.min(v, atTime(c.virtual, '14:30').getTime());
}
function rebase() { S.clock.virtual = now(); S.clock.real = Date.now(); }
const clock = () => ({ ...S.clock, now: now() });
function setSpeed(x) { rebase(); S.clock.speed = x; emit('clock'); }
function setPaused(p) { rebase(); S.clock.paused = p; emit('clock'); }
function resetDemo() { const m = S?.clock?.mode || 'real'; storage.del(KEY); const keepCreds = S?.creds; S = seed(m); S.marks = seedMarks(); S.markReads = {}; S.chats = {}; S.tickets = []; S.creds = keepCreds || seedCreds(); IDX = null; emit('reset'); }
function setMode(m) { storage.del(KEY); const keepCreds = S?.creds; S = seed(m); S.marks = seedMarks(); S.markReads = {}; S.chats = {}; S.tickets = []; S.creds = keepCreds || seedCreds(); IDX = null; emit('reset'); }
// Off days: Friday and Saturday (real clock), plus official holidays announced by the administration.

const holidays = () => (S.holidays || []).slice().sort((a, b) => a.day.localeCompare(b.day));
const holidayOn = ts => (S.holidays || []).find(h => h.day === (typeof ts === 'string' ? ts : dayKey(new Date(ts))));

function offDay(ts) {

  return S.clock?.mode === 'real' && !isSchoolDay(new Date(ts));

const isHoliday = () => !!S.holiday || !!(holidayOn(S.today) && holidayOn(S.today).status !== 'draft');

function broadcastHolidayNotification(hol) {
  const title = `📢 عطلة رسمية: ${hol.name}`;
  const body = `تعطيل الدوام الرسمي لكافة الطلاب والمدرسين ليوم (${hol.day}). لا يُحسب غياب أو تأخير.`;
  const sent = new Set();
  (S.guardians || []).forEach(g => {
    if (g.phone && !sent.has(g.phone)) {
      sent.add(g.phone);
      notify(g.phone, { kind: 'post', title, body, ts: now() });
    }
  });
  (S.students || []).forEach(s => {
    if (s.phone && !sent.has(s.phone)) {
      sent.add(s.phone);
      notify(s.phone, { kind: 'post', title, body, ts: now(), studentId: s.id });

  });
  (S.teachers || []).forEach(t => {
    if (t.phone && !sent.has(t.phone)) {
      sent.add(t.phone);
      notify(t.phone, { kind: 'post', title, body, ts: now() });
    }
  });
}

function publishHolidayAnnouncement(hol, by) {
  const allSecs = (S.sections || []).map(s => s.id);
  const pTitle = `📢 إعلان عطلة رسمية: ${hol.name}`;
  const pBody = `تعلن إدارة المدرسة عن تعطيل الدوام الرسمي لكافة الطلبة والملاك التدريسي ليوم (${hol.day}) بمناسبة (${hol.name}).\n` +

  if (hol.postId) {
    const p = (S.posts || []).find(x => x.id === hol.postId);
    if (p) {
      p.title = pTitle;
      p.body = pBody;
      emit('post');
      return;
    }
  }

  const res = addPost({
    type: 'ann',
    title: pTitle,
    body: pBody,
    sections: allSecs.length ? allSecs : ['g1-أ'],
    audience: 'all'

  if (res.ok && res.post) {
    hol.postId = res.post.id;
  }
}

function publishHoliday(day, by) {
  const hol = (S.holidays || []).find(h => h.day === day);
  if (!hol) return { ok: false, error: 'العطلة غير موجودة.' };
  hol.status = 'published';
  hol.publishedAt = now();
  broadcastHolidayNotification(hol);
  publishHolidayAnnouncement(hol, by);
  log('نشر عطلة رسمية للجميع', `${day} · ${hol.name}`);
  IDX = null;
  emit('holidays');
  return { ok: true, holiday: hol };
}

function addHoliday(day, name, by, extra = {}) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day || '')) return { ok: false, error: 'اختر تاريخ العطلة.' };
  const existing = (S.holidays || []).find(h => h.day === day);
  S.holidays = (S.holidays || []).filter(h => h.day !== day);
  const status = extra.status || 'published';
  const hol = {
    day,
    name: String(name || '').trim() || 'عطلة رسمية',
    category: extra.category || 'عطلة رسمية',
    orderNo: extra.orderNo || '',
    notes: extra.notes || '',
    badge: extra.badge || '🏛️',
    status, // 'draft' (مسودة / مستودع) or 'published' (منشور للجميع)
    by: by || '',
    ts: now(),
    publishedAt: status === 'published' ? (existing?.publishedAt || now()) : null,
    postId: existing?.postId || null
  };
  S.holidays.push(hol);

  if (status === 'published' && extra.broadcast !== false) {
    broadcastHolidayNotification(hol);
    publishHolidayAnnouncement(hol, by);
  }

  log(status === 'published' ? 'إعلان ونشر عطلة رسمية' : 'حفظ عطلة كمسودة في المستودع', `${day} · ${hol.name} (${hol.category})`);
  IDX = null;
  emit('holidays');
  return { ok: true, holiday: hol };
}

function editHoliday(day, data, by) {
  const existing = (S.holidays || []).find(h => h.day === day);
  if (!existing) return { ok: false, error: 'العطلة غير موجودة.' };
  const targetDay = data.day || data.startDate || day;
  if (targetDay !== day) {
    removeHoliday(day, by);
  }
  return addHoliday(targetDay, data.name || existing.name, by, {
    category: data.category !== undefined ? data.category : existing.category,
    orderNo: data.orderNo !== undefined ? data.orderNo : existing.orderNo,
    notes: data.notes !== undefined ? data.notes : existing.notes,
    badge: data.badge !== undefined ? data.badge : (existing.badge || '🏛️'),
    status: data.status !== undefined ? data.status : existing.status,
    postId: existing.postId
  });
}

function addHolidayRange({ startDate, endDate, name, category, orderNo, notes, status = 'published', badge = '🏛️' }, by) {
  if (!startDate) return { ok: false, error: 'يرجى تحديد تاريخ البدء.' };
  const parseLocal = s => {
    const p = (s || '').split('-').map(Number);
    return (p.length === 3 && p.every(n => !isNaN(n))) ? new Date(p[0], p[1] - 1, p[2]) : new Date(NaN);
  };
  const d1 = parseLocal(startDate);
  const d2 = endDate ? parseLocal(endDate) : parseLocal(startDate);
  if (isNaN(d1.getTime()) || isNaN(d2.getTime())) return { ok: false, error: 'التاريخ غير صحيح.' };
  if (d2 < d1) return { ok: false, error: 'تاريخ الانتهاء يجب أن يكون بعد تاريخ البدء.' };

  const added = [];
  const cur = new Date(d1);
  let isFirst = true;
  while (cur <= d2) {
    const k = dayKey(cur);
    addHoliday(k, name, by, { category, orderNo, notes, status, badge, broadcast: isFirst && status === 'published' });
    isFirst = false;
    added.push(k);
    cur.setDate(cur.getDate() + 1);
  }
  return { ok: true, count: added.length };
}

function removeHoliday(day, by) {
  const h = (S.holidays || []).find(x => x.day === day);
  S.holidays = (S.holidays || []).filter(x => x.day !== day);
  if (h) {
    if (h.postId) {
      deletePost(h.postId, by || 'إدارة المدرسة');
    }
    log('إلغاء عطلة رسمية', `${day} · ${h.name}${by ? ' · ألغاها: ' + by : ''}`);
  }
  IDX = null;
  emit('holidays');
  return { ok: true };
}

/* ---------------- teacher attendance & biometrics ---------------- */
const teacherEvents = () => S.teacherEvents || [];

function teacherStatusOf(teacherId, day = S.today) {
  if ((S.holiday && day === S.today) || offDay(day)) return { status: 'holiday', holiday: holidayOn(day) || { name: holidayName() } };
  const k = dayKey(new Date(day));
  const evs = (S.teacherEvents || []).filter(e => e.teacherId === teacherId && dayKey(new Date(e.ts)) === k).sort((a, b) => a.ts - b.ts);
  const inEv = evs.find(e => e.type === 'in');
  const outEv = [...evs].reverse().find(e => e.type === 'out');
  const excuse = (S.teacherExcuses || []).find(x => x.teacherId === teacherId && x.day === k);
  const ex = getExemption('teacher', teacherId, day);
  if (inEv) {
    const lateMin = minutesOf(S.settings.late || '07:55');
    const d = new Date(inEv.ts);
    const late = d.getHours() * 60 + d.getMinutes() > lateMin;
    if (outEv && outEv.ts > inEv.ts) return { status: 'left', inEv, outEv, late, exempt: ex };
    return { status: late ? 'late' : 'present', inEv, late, exempt: ex };
  }
  if (ex) {
    return { status: ex.attPolicy === 'auto_present' ? 'present' : 'exempt', exempt: ex, isExempt: true };
  }
  if (!inEv) {
    if (excuse) return { status: 'excused', excuse };
    const isToday = day === S.today;
    if (isToday && now() < atTime(day, S.settings.late || '07:55').getTime()) return { status: 'pending' };
    return { status: 'absent' };
  }
  const lateMin = minutesOf(S.settings.late || '07:55');
  const d = new Date(inEv.ts);
  const late = d.getHours() * 60 + d.getMinutes() > lateMin;
  if (outEv && outEv.ts > inEv.ts) return { status: 'left', inEv, outEv, late };
  return { status: late ? 'late' : 'present', inEv, late };
}

function teacherSummary(day = S.today) {

  const c = { present: 0, late: 0, absent: 0, excused: 0, left: 0, pending: 0, exempt: 0, total: list.length, came: 0, rate: 0 };
  list.forEach(t => {
    const st = teacherStatusOf(t.id, day).status;
    if (c[st] !== undefined) c[st]++;

}

  const g = gradeByName(parts.join(' ')) || gradeFuzzy(parts.join(' ')); if (!g) return null;

/* ============ DAILY REPORT (PDF) ============
   Built as a real PDF so it works everywhere: the preview, the desktop file and phones (window.print is blocked inside the preview). */
async function dailyReportPdf() {
  const st = db.settings(); const all = db.students(); const hol = db.isHoliday();
  const day = hol ? db.days()[1] : db.days()[0]; const dt = new Date(day);
  const c = db.summary(all, day);
  const rows = db.sections().map(s => ({ s, y: db.summary(db.students(s.id), day) })).filter(r => r.y.total);
  const absent = all.filter(s => db.statusOf(s.id, day).status === 'absent');
  const excused = all.filter(s => db.statusOf(s.id, day).status === 'excused');
  const late = all.map(s => ({ s, x: db.statusOf(s.id, day) })).filter(o => o.x.inEv && (o.x.late || o.x.status === 'late')).sort((a, b) => b.x.inEv.ts - a.x.inEv.ts);

  const W = 1240, M = 80; const NAVY = '#1E2B5C', TEAL = '#0B7F70', AMBER = '#F2A93B', RED = '#C8453F', MUTED = '#5B6478', LINE = '#E3E8EF';
  const pages = []; let pageNo = 0;
  const header = (g, sub) => { pageNo++; g.fillStyle = NAVY; g.fillRect(0, 0, W, 170); g.fillStyle = '#fff'; g.font = F(700, 46); g.fillText('تقرير الحضور اليومي', W - M, 90); g.font = F(400, 26); g.fillStyle = '#C9D6F0'; g.fillText(`${st.schoolName} · ${fmtDay(dt)}${sub ? ' · ' + sub : ''}`, W - M, 138); g.textAlign = 'left'; g.font = F(700, 40); g.fillStyle = '#fff'; g.fillText('حاضر', M, 100); g.textAlign = 'right'; g.fillStyle = AMBER; g.fillRect(0, 170, W, 8); };
  const footer = g => { g.fillStyle = MUTED; g.font = F(400, 20); g.textAlign = 'center'; g.fillText(`صفحة ${pageNo} · أُنشئ ${fmtDay(new Date(db.now()))} ${fmtTime(db.now())} · منصة حاضر`, W / 2, 1715); g.textAlign = 'right'; };
  const table = (g, y, cols, data, rowH = 50) => {
    let x = W - M; g.fillStyle = '#F5F7FA'; g.fillRect(M, y, W - 2 * M, rowH); g.fillStyle = NAVY; g.font = F(700, 22);
    cols.forEach(([l, w]) => { g.fillText(l, x - 12, y + rowH * .64); x -= w; }); y += rowH; g.font = F(400, 22);
    data.forEach((r, i) => { x = W - M; if (i % 2) { g.fillStyle = '#FBFCFD'; g.fillRect(M, y, W - 2 * M, rowH); } r.forEach((v, j) => { g.fillStyle = typeof v === 'object' ? v.c : NAVY; g.fillText(String(typeof v === 'object' ? v.t : v), x - 12, y + rowH * .64); x -= cols[j][1]; }); g.strokeStyle = LINE; g.lineWidth = 1.5; g.beginPath(); g.moveTo(M, y + rowH); g.lineTo(W - M, y + rowH); g.stroke(); y += rowH; });
    return y;
  };
  pages.push(await pdfPage(g => {
    header(g, hol ? 'اليوم عطلة، الأرقام من آخر يوم دوام' : '');
    const k = [['إجمالي الطلاب', c.total, NAVY], ['حاضر بالوقت', c.came - late.length, TEAL], ['متأخر', late.length, AMBER], ['غائب', c.absent, RED], ['بعذر', c.excused, '#7A5BB0'], ['نسبة الحضور', c.rate + '%', TEAL]];
    const bw = (W - 2 * M - 5 * 16) / 6; k.forEach(([l, v, col], i) => { const x = W - M - (i + 1) * bw - i * 16; g.fillStyle = '#F5F7FA'; g.fillRect(x, 220, bw, 150); g.fillStyle = col; g.fillRect(x + bw - 8, 220, 8, 150); g.fillStyle = MUTED; g.font = F(600, 22); g.fillText(l, x + bw - 24, 262); g.fillStyle = col; g.font = F(700, 52); g.fillText(String(v), x + bw - 24, 336); });
    const by = 410, bwid = W - 2 * M, t = Math.max(1, c.total); let x = W - M;
    [[c.came - late.length, TEAL], [late.length, AMBER], [c.excused, '#B08ADB'], [c.absent, RED], [c.pending, '#C9D1DE']].forEach(([v, col]) => { const w = Math.max(0, v) / t * bwid; g.fillStyle = col; g.fillRect(x - w, by, w, 26); x -= w; });
    g.fillStyle = NAVY; g.font = F(700, 30); g.fillText('الحضور حسب الشعبة', W - M, 510);

function donut(parts, total, center, sub) {

  const arcs = parts.filter(p => p.v > 0).map(p => { const len = total ? p.v / total * L : 0; const s = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="16" stroke-dasharray="${Math.max(len - 2, 0)} ${L}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${p.l}: ${p.v}</title></circle>`; off += len; return s; }).join('');
  return `<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="${center} ${sub}"><circle r="${R}" cx="70" cy="70" fill="none" stroke="#EEF1F6" stroke-width="16"/>${arcs}<text x="70" y="70" text-anchor="middle" class="dn">${center}</text><text x="70" y="92" text-anchor="middle" class="ds">${sub}</text></svg>`;
}
function spark(vals, color = '#0B7F70') {
  if (vals.length < 2) return '';
  const w = 96, h = 30, mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * w, h - 3 - (v - mn) / rg * (h - 6)]);
  return `<svg viewBox="0 0 ${w} ${h}" class="spark" aria-hidden="true"><path d="M${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join('L')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="3" fill="${color}"/></svg>`;
}
// Attendance rate per school day (area) with absences (bars) underneath.
function trendChart(series) {
  const W = 640, H = 220, P = { l: 34, r: 10, t: 14, b: 34 }; const n = series.length; if (!n) return '';
  const iw = W - P.l - P.r, ih = H - P.t - P.b; const x = i => P.l + (n === 1 ? iw / 2 : i / (n - 1) * iw);
  const minR = Math.max(0, Math.min(80, Math.floor(Math.min(...series.map(s => s.rate)) / 10) * 10)); const y = r => P.t + ih - (r - minR) / (100 - minR) * ih;
  const maxA = Math.max(1, ...series.map(s => s.absent)); const bw = Math.min(18, iw / n * .45);
  const grid = [minR, (minR + 100) / 2, 100].map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#E3E8EF"/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end" class="ax">${Math.round(v)}%</text>`).join('');
  const bars = series.map((s, i) => `<rect x="${x(i) - bw / 2}" y="${H - P.b - s.absent / maxA * ih * .35}" width="${bw}" height="${s.absent / maxA * ih * .35}" rx="3" fill="#C8453F" opacity=".22"><title>${s.label}: ${s.absent} غائب</title></rect>`).join('');
  const line = series.map((s, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(s.rate).toFixed(1)}`).join('');
  const area = `${line}L${x(n - 1)},${H - P.b}L${x(0)},${H - P.b}Z`;
  const dots = series.map((s, i) => `<circle cx="${x(i)}" cy="${y(s.rate)}" r="${i === n - 1 ? 5 : 3}" fill="${i === n - 1 ? '#0B7F70' : '#fff'}" stroke="#0B7F70" stroke-width="2"><title>${s.label}: ${s.rate}% حضور · ${s.absent} غائب</title></circle>`).join('');
  const labels = series.map((s, i) => (i % Math.ceil(n / 8) === 0 || i === n - 1) ? `<text x="${x(i)}" y="${H - 12}" text-anchor="middle" class="ax">${s.short}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="نسبة الحضور لآخر ${n} يوم دراسي"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B7F70" stop-opacity=".28"/><stop offset="1" stop-color="#0B7F70" stop-opacity="0"/></linearGradient></defs>${grid}${bars}<path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="#0B7F70" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}

  const W = 640, H = 170, P = { l: 10, r: 10, t: 10, b: 28 }; const iw = W - P.l - P.r, ih = H - P.t - P.b; const mx = Math.max(1, ...bins); const bw = iw / nb;
  const late = atTime(day, st.late).getTime(); const lx = P.l + (late - t0) / (t1 - t0) * iw;

  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="توزيع أوقات الوصول"><line x1="${P.l}" x2="${W - P.r}" y1="${P.t + ih}" y2="${P.t + ih}" stroke="#E3E8EF"/>${bars}<line x1="${lx}" x2="${lx}" y1="${P.t}" y2="${P.t + ih}" stroke="#8A5A0B" stroke-dasharray="4 4"/><text x="${lx - 4}" y="${P.t + 12}" text-anchor="end" class="ax" style="fill:#8A5A0B;font-weight:700">بداية التأخير</text>${ticks}</svg>`;
}
