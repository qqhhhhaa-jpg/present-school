/* ---------- teacher: today's tasks (the assistant that keeps the day organised) ---------- */
function teacherTasks(t) {
  const tasks = []; const wd = new Date(db.now()).getDay(); const holiday = db.isHoliday() || wd > 4;
  // today's lessons from the published timetable
  const lessons = []; if (!holiday) t.sections.forEach(id => { const pub = db.ttPublished(id); (pub?.[wd] || []).forEach((cl, i) => { if (cl && cl.teacher === t.name) lessons.push({ i, id, subject: cl.subject }); }); });
  lessons.sort((a, b) => a.i - b.i);
  const ps = db.periods();
  // absences to record in the sections
  t.sections.forEach(id => { const n = db.students(id).filter(s => db.statusOf(s.id).status === 'pending').length; if (n && !holiday) tasks.push({ ic: 'check', tone: 'a', text: `${n} طالب بـ${db.sectionShort(id)} بعدهم ما بصموا`, href: `#/section/${encodeURIComponent(id)}`, btn: 'تفقّد' }); });
  // missing final marks for my subject
  if (db.teacherCan(t.id, 'marks')) t.sections.forEach(id => { const subs = db.sectionSubjects(id).filter(s => s === t.subject); subs.forEach(sub => { const miss = db.students(id).filter(s => db.subjectResult(s.id, id, sub).missing).length; if (miss) tasks.push({ ic: 'grade', tone: 'r', text: `${miss} طالب بـ${db.sectionShort(id)} بدون درجة نهائية بـ${sub}`, href: '#/marks', btn: 'ارصد' }); }); });
  // students needing the second round in my subject
  t.sections.forEach(id => { const n = db.students(id).filter(s => { const x = db.subjectResult(s.id, id, t.subject); return !x.missing && !x.pass; }).length; if (n) tasks.push({ ic: 'alert', tone: 'a', text: `${n} طالب بـ${db.sectionShort(id)} راسبين بـ${t.subject} (يحتاجون متابعة أو دور ثاني)`, href: '#/promotion', btn: 'شوف' }); });
  // unanswered parent messages
  const open = db.teacherCan(t.id, 'inbox') ? db.openTickets({ sections: t.sections }) : 0; if (open) tasks.push({ ic: 'chat', tone: 'a', text: `${open} رسالة من أولياء الأمور بانتظار ردك`, href: '#/inbox', btn: 'رد' });
  // unpublished timetable edits
  const pend = db.teacherCan(t.id, 'tt') ? db.ttPending(t.sections) : 0; if (pend) tasks.push({ ic: 'calendar', tone: 'a', text: `${pend} جدول بيه تغييرات ما انتشرت`, href: '#/timetable', btn: 'انشر' });
  // homework due soon
  const hw = db.posts({ sections: t.sections, type: 'hw' }).filter(p => p.by === t.id && p.due).slice(0, 2);
  hw.forEach(p => tasks.push({ ic: 'hw', tone: 't', text: `واجب «${p.title}» موعده ${p.due}`, href: '#/posts', btn: 'فتح' }));
  return { lessons, ps, tasks, holiday };
}
function teacherTasksCard(t) {
  const { lessons, ps, tasks, holiday } = teacherTasks(t);
  return `<div class="card ttasks"><div class="ch"><h2>${icon('spark', 18)} مهامي اليوم</h2><span class="muted small">${tasks.length ? `${tasks.length} شغلة` : 'كلشي مرتب ✓'}</span></div>
    <div class="ttgrid"><div><div class="msec" style="margin:0 0 6px">حصصي اليوم</div>${holiday ? '<div class="muted small">اليوم ما بيه دوام.</div>' : lessons.length ? lessons.map(l => `<div class="lrow"><span class="lno num">${l.i + 1}</span><div style="flex:1"><b>${esc(l.subject)}</b><div class="muted small">${esc(db.sectionShort(l.id))} · <span class="num">${ps[l.i].label}</span></div></div></div>`).join('') : '<div class="muted small">ماكو حصص إلك بالجدول المنشور اليوم.</div>'}</div>
    <div><div class="msec" style="margin:0 0 6px">يحتاج انتباهك</div>${tasks.length ? tasks.map(x => `<a class="row al" href="${x.href}"><span class="ki ${x.tone}">${icon(x.ic, 15)}</span><span style="flex:1">${esc(x.text)}</span><span class="btn sm">${x.btn}</span></a>`).join('') : '<div class="muted small">ماكو شي معلّق. يوم موفق 🌱</div>'}</div></div></div>`;
}

/* ============ TEACHER / STAFF ATTENDANCE (حضور الكادر التدريسي) ============ */
const staffAttState = { day: null, q: '', f: 'all' };

const staffAtt = {
  render(el) {
    staffAttState.day = staffAttState.day || db.days()[0];
    const canManage = can('att') || ctx().role === 'owner' || ctx().role === 'admin';
    el.innerHTML = topbar('حضور وبصمة الكادر التدريسي', 'متابعة حية لبصمات دخول وانصراف المدرسين وأجهزة البصمة', canManage ? `
      <button class="btn pr" id="btn-quick-t-scan">${icon('device', 18)} محاكاة بصمة مدرس</button>
      <button class="btn" id="btn-t-holiday">${icon('calendar', 16)} إعلان عطلة رسمية</button>
      <button class="btn" id="btn-manual-t-att">${icon('plus', 16)} تسجيل يدوي</button>
      <button class="btn" id="btn-t-excuse">${icon('plus', 16)} إجازة / عذر</button>
      <button class="btn" id="btn-t-month-rep">${icon('report', 16)} تقرير الدوام الشهري</button>
    ` : `
      <button class="btn" id="btn-t-month-rep">${icon('report', 16)} تقرير الدوام الشهري</button>
    `) + `
    <div id="t-hol-banner"></div>
    <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <label class="field" style="min-width:180px">اليوم
        <select class="input" id="t-day">
          ${db.days().map((d, i) => `<option value="${d}" ${d === staffAttState.day ? 'selected' : ''}>${i === 0 ? 'اليوم · ' : ''}${fmtDay(new Date(d))}</option>`).join('')}
        </select>
      </label>
      <label class="field" style="flex:1;min-width:200px">بحث بالاسم أو المادة
        <input class="input" id="t-q" value="${esc(staffAttState.q)}" placeholder="اكتب اسم المدرس أو المادة...">
      </label>
      <div class="small muted" style="padding-bottom:10px">
        بداية الدوام: <b class="num">${db.settings().start || '07:45'}</b> · الحد الأقصى للتأخير: <b class="num">${db.settings().late || '07:55'}</b> · الانصراف: <b class="num">${db.settings().end || '13:30'}</b>
      </div>
    </div>
    <div id="t-stats-box"></div>
    <div class="seg" id="t-fseg" role="group" aria-label="تصفية حالة الكادر"></div>
    <div class="card tablewrap" id="t-tbl"></div>
    <div class="card" id="t-live-feed" style="display:flex;flex-direction:column;gap:10px"></div>
    `;

    $('#t-day', el).onchange = e => { staffAttState.day = +e.target.value; this.update(el); };
    $('#t-q', el).oninput = e => { staffAttState.q = e.target.value; this.update(el); };

    el.onclick = e => {
      const f = e.target.closest('[data-tf]');
      if (f) { staffAttState.f = f.dataset.tf; this.update(el); return; }

      if (e.target.closest('#btn-t-holiday')) {
        officialHolidayModal(staffAttState.day, null, () => this.update(el));
        return;
      }
      const editTHol = e.target.closest('[data-edit-hol], [data-edit-t-hol]');
      if (editTHol) {
        const d = editTHol.dataset.editHol || editTHol.dataset.editTHol;
        officialHolidayModal(d, d, () => this.update(el));
        return;
      }
      const pubTHol = e.target.closest('[data-publish-hol], [data-publish-t-hol]');
      if (pubTHol) {
        const d = pubTHol.dataset.publishHol || pubTHol.dataset.publishTHol;
        db.publishHoliday(d, ctx().name);
        toast('تم نشر العطلة رسمياً وإشعار الطلاب والمدرسين 📢', d);
        this.update(el);
        return;
      }
      const delTHol = e.target.closest('[data-del-hol], [data-del-t-hol]');
      if (delTHol) {
        const d = delTHol.dataset.delHol || delTHol.dataset.delTHol;
        if (confirm('هل أنت متأكد من حذف وإلغاء هذه العطلة واستئناف الدوام؟')) {
          db.removeHoliday(d, ctx().name);
          toast('تم حذف العطلة واستئناف الدوام', d);
          this.update(el);
        }
        return;
      }
      if (e.target.closest('#btn-quick-t-scan')) {
        simulateTeacherScanModal(() => this.update(el));
        return;
      }
      if (e.target.closest('#btn-manual-t-att')) {
        manualTeacherAttModal(() => this.update(el));
        return;
      }
      if (e.target.closest('#btn-t-excuse')) {
        teacherExcuseModal(null, () => this.update(el));
        return;
      }
      if (e.target.closest('#btn-t-month-rep')) {
        teacherMonthReportModal();
        return;
      }

      const min = e.target.closest('[data-t-mark-in]');
      if (min) {
        const tid = min.dataset.tMarkIn;
        db.teacherMarkManual(tid, 'in', ctx().name);
        toast('سُجّلت بصمة الدخول', db.teacher(tid)?.name);
        this.update(el);
        return;
      }

      const mout = e.target.closest('[data-t-mark-out]');
      if (mout) {
        const tid = mout.dataset.tMarkOut;
        db.teacherMarkManual(tid, 'out', ctx().name);
        toast('سُجّلت بصمة الانصراف', db.teacher(tid)?.name);
        this.update(el);
        return;
      }

      const excBtn = e.target.closest('[data-t-exc]');
      if (excBtn) {
        teacherExcuseModal(excBtn.dataset.tExc, () => this.update(el));
        return;
      }

      const histBtn = e.target.closest('[data-t-hist]');
      if (histBtn) {
        teacherHistoryModal(histBtn.dataset.tHist);
        return;
      }
    };

    this.update(el);
  },

  update(el) {
    const list = db.teachers();
    const day = staffAttState.day || db.days()[0];
    const isToday = day === db.days()[0];
    const isHoliday = db.offDay(day);
    const holInfo = db.holidayOn(day);
    const canManage = can('att') || ctx().role === 'owner' || ctx().role === 'admin';
    const summ = db.teacherSummary(day);

    const holBanner = $('#t-hol-banner', el);
    if (holBanner) {
      holBanner.innerHTML = holBannerHtml(holInfo, isHoliday, canManage, day);
    }

    const statsBox = $('#t-stats-box', el);
    if (statsBox) {
      statsBox.innerHTML = `
      <div class="grid g4" style="gap:10px">
        <div class="card stat" style="border-right:4px solid var(--brand)">
          <span class="pill p-quiet">الكادر الكلي</span>
          <div class="n num">${summ.total}</div>
          <div class="small muted">مدرس ومعلم</div>
        </div>
        <div class="card stat" style="border-right:4px solid var(--teal)">
          <span class="pill p-present">حاضر في الموعد</span>
          <div class="n num" style="color:var(--teal)">${summ.present}</div>
          <div class="small muted">التزام تام بالموعد</div>
        </div>
        <div class="card stat" style="border-right:4px solid var(--amber)">
          <span class="pill p-late">تأخير / بعد 7:55</span>
          <div class="n num" style="color:var(--amber)">${summ.late}</div>
          <div class="small muted">${summ.left ? summ.left + ' انصرفوا' : 'حضروا متأخرين'}</div>
        </div>
        <div class="card stat" style="border-right:4px solid var(--red)">
          <span class="pill p-absent">غياب / إجازة</span>
          <div class="n num" style="color:var(--red)">${summ.absent + summ.excused}</div>
          <div class="small muted">${summ.excused} بإجازة رسمية · نسبة الالتزام <b class="num">${summ.rate}%</b></div>
        </div>
      </div>`;
    }

    const fseg = $('#t-fseg', el);
    if (fseg) {
      const F = isHoliday ? [
        ['all', `الكل (${summ.total})`],
        ['holiday', `عطلة رسمية (${summ.total})`]
      ] : [
        ['all', `الكل (${summ.total})`],
        ['present', `حاضر (${summ.present})`],
        ['late', `متأخر (${summ.late})`],
        ['left', `انصرف (${summ.left})`],
        ['excused', `إجازة / عذر (${summ.excused})`],
        ['absent', `غائب (${summ.absent})`],
        ...(isToday ? [['pending', `لم يبصم بعد (${summ.pending})`]] : [])
      ];
      fseg.innerHTML = F.map(([k, label]) => `<button type="button" data-tf="${k}" aria-pressed="${staffAttState.f === k}">${label}</button>`).join('');
    }

    if (isHoliday && staffAttState.f !== 'all' && staffAttState.f !== 'holiday') {
      staffAttState.f = 'all';
    }
    let rows = list.map(t => ({ t, st: db.teacherStatusOf(t.id, day) }));
    if (staffAttState.q) {
      const q = norm(staffAttState.q);
      rows = rows.filter(r => norm(r.t.name).includes(q) || norm(r.t.subject || '').includes(q) || (r.t.phone && r.t.phone.includes(q)));
    }
    if (staffAttState.f !== 'all') {
      rows = rows.filter(r => r.st.status === staffAttState.f || (staffAttState.f === 'late' && r.st.late));
    }

    const tbl = $('#t-tbl', el);
    if (tbl) {
      const canManage = can('att') || ctx().role === 'owner' || ctx().role === 'admin';
      const tableNotice = isHoliday ? `
      <div style="background:linear-gradient(90deg, #EEF2FF 0%, #E0E7FF 100%);border:1px solid #C7D2FE;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px">
        <span style="font-size:24px;flex:none">${holInfo?.badge || '🏖️'}</span>
        <div style="flex:1">
          <div style="font-weight:700;color:#3730A3;font-size:14px">
            إشعار دوام الكادر: اليوم عطلة رسمية معتمدة (${esc(holInfo?.name || 'عطلة رسمية')})
          </div>
          <div style="font-size:12px;color:#4338CA;margin-top:2px">
            كافة أعضاء الكادر التعليمي في حالة إعفاء رسمي معتمد من البصمة والدوام · يستمر هذا الإشعار والإعفاء سارياً طوال اليوم وحتى نهايته.
          </div>
        </div>
        <span class="pill" style="background:#4338CA;color:#fff;font-size:11px;font-weight:700;flex:none">ساري طوال اليوم حتى 23:59</span>
      </div>` : '';
      tbl.innerHTML = tableNotice + (rows.length ? `
      <table>
        <thead>
          <tr>
            <th>المدرس</th>
            <th>المادة والشعب</th>
            <th>بصمة الدخول الصباحية</th>
            <th>بصمة الانصراف</th>
            <th>الحالة</th>
            ${canManage ? '<th>الإجراءات</th>' : ''}
          </tr>
        </thead>
        <tbody>
          ${rows.map(({ t, st }) => {
        const inTime = st.inEv ? fmtTime(st.inEv.ts) : (st.exempt ? '<span class="muted small">مستثنى رسمياً</span>' : '—');
        const inDev = st.inEv ? (st.inEv.deviceId ? db.device(st.inEv.deviceId)?.name.split(' · ')[0] : 'يدوي') : (st.exempt ? 'إعفاء بقرار' : '');
        const inMethod = st.inEv?.method || (st.exempt ? 'حالة خاصة' : '');
        const outTime = st.outEv ? fmtTime(st.outEv.ts) : '—';
        const outDev = st.outEv ? (st.outEv.deviceId ? db.device(st.outEv.deviceId)?.name.split(' · ')[0] : 'يدوي') : '';

        let pillHtml = '';
        if (st.exempt) pillHtml = `<span class="pill" style="background:#F3E8FF;color:#6B21A8;border:1px solid #D8B4FE" title="مستثنى بقرار: ${esc(st.exemption?.reason || '')}">مستثنى (حالة خاصة) 🛡️</span>`;
        else if (st.status === 'present') pillHtml = '<span class="pill p-present">حاضر في الموعد ✓</span>';
        else if (st.status === 'late') pillHtml = '<span class="pill p-late">متأخر ⏱</span>';
        else if (st.status === 'left') pillHtml = '<span class="pill p-left">انصرف ⏏</span>';
        else if (st.status === 'excused') pillHtml = `<span class="pill p-excused" title="${esc(st.excuse?.note || '')}">إجازة: ${esc(st.excuse?.reason || 'عذر')}</span>`;
        else if (st.status === 'pending') pillHtml = '<span class="pill p-quiet">لم يبصم بعد ⌛</span>';
        else if (st.status === 'holiday') pillHtml = '<span class="pill p-quiet">عطلة رسمية</span>';
        else pillHtml = '<span class="pill p-absent">غائب ✕</span>';

        return `<tr>
              <td>
                <div style="display:flex;gap:10px;align-items:center">
                  ${avatar(t.name)}
                  <div>
                    <b>${esc(t.name)}</b>
                    <div class="muted small num" dir="ltr">${esc(t.phone)}</div>
                  </div>
                </div>
              </td>
              <td>
                <div><b>${esc(t.subject || 'عام')}</b></div>
                <div class="muted small">${t.sections?.length ? t.sections.map(s => esc(db.sectionShort(s))).join('، ') : 'كل المدرسة'}</div>
              </td>
              <td>
                <b class="num" style="font-size:15px">${inTime}</b>
                ${st.inEv ? `<div class="muted small">${esc(inMethod)} · ${esc(inDev)}</div>` : ''}
              </td>
              <td>
                <b class="num" style="font-size:15px">${outTime}</b>
                ${st.outEv ? `<div class="muted small">${esc(outDev)}</div>` : ''}
              </td>
              <td>${pillHtml}</td>
              ${canManage ? `
              <td>
                <div style="display:flex;gap:6px;flex-wrap:wrap">
                  ${!st.inEv ? `<button type="button" class="btn sm pr" data-t-mark-in="${t.id}" title="تسجيل حضور الآن">${icon('check', 13)} دخول</button>` : ''}
                  ${st.inEv && !st.outEv ? `<button type="button" class="btn sm" data-t-mark-out="${t.id}" title="تسجيل انصراف">${icon('logout', 13)} انصراف</button>` : ''}
                  <button type="button" class="btn sm" data-t-exc="${t.id}" title="تسجيل إجازة أو عذر">${icon('plus', 13)} إجازة</button>
                  <button type="button" class="btn sm" data-t-hist="${t.id}" title="سجل بصمات المدرس">${icon('eye', 13)} السجل</button>
                </div>
              </td>` : ''}
            </tr>`;
      }).join('')}
        </tbody>
      </table>` : '<div class="empty">لا توجد سجلات مطابقة للبحث أو التصفية الحالية.</div>');
    }

    const feed = $('#t-live-feed', el);
    if (feed) {
      const recents = db.recentTeacherEvents(8);
      feed.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="display:flex;align-items:center;gap:6px;font-size:16px">
          ${icon('device', 18)} سجل حركات البصمة الحية للكادر اليوم (${recents.length})
        </h2>
        <span class="muted small">محدّث لحظياً مع أجهزة ZKTeco و Hikvision</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${recents.length ? recents.map(e => {
        const t = db.teacher(e.teacherId);
        const dev = e.deviceId ? db.device(e.deviceId) : null;
        const isIn = e.type === 'in';
        return `<div class="row" style="background:var(--surface-200);border-radius:10px;padding:8px 12px">
            <span class="ti" style="width:34px;height:34px;border-radius:10px;--ic:${isIn ? '#0B7F70' : '#1E2B5C'}">
              ${icon(isIn ? 'check' : 'logout', 16)}
            </span>
            <div style="flex:1">
              <b>${esc(t?.name || 'مدرس')}</b>
              <div class="muted small">${isIn ? 'بصمة دخول صباحي' : 'بصمة انصراف'} · ${esc(e.method || 'بصمة')} · ${esc(dev?.name || 'تسجيل يدوي')}</div>
            </div>
            <div style="text-align:left">
              <b class="num" style="font-size:15px">${fmtTime(e.ts)}</b>
              <div class="muted small">${ago(e.ts, db.now())}</div>
            </div>
          </div>`;
      }).join('') : '<div class="small muted">لا توجد حركات بصمة مسجلة للكادر حتى الآن اليوم.</div>'}
      </div>`;
    }
  }
};

function simulateTeacherScanModal(onDone) {
  const tList = db.teachers();
  const dList = db.devices();
  modal('محاكاة بصمة مدرس حية', `<form id="stsf" style="display:flex;flex-direction:column;gap:12px" novalidate>
    <div class="muted small">اختر المدرس وجهاز البصمة لاختبار تسجيل الحضور أو الانصراف عبر الأجهزة:</div>
    <label class="field">المدرس
      <select class="input" name="teacherId">
        ${tList.map(t => {
    const st = db.teacherStatusOf(t.id);
    const nextAction = st.inEv && !st.outEv ? 'انصراف' : 'دخول';
    return `<option value="${t.id}">${esc(t.name)} (${esc(t.subject || 'عام')}) - البصمة التالية: ${nextAction}</option>`;
  }).join('')}
      </select>
    </label>
    <div class="grid g2" style="gap:10px">
      <label class="field">جهاز البصمة
        <select class="input" name="deviceId">
          ${dList.map(d => `<option value="${d.id}">${esc(d.name)} (${esc(d.model)})</option>`).join('')}
        </select>
      </label>
      <label class="field">طريقة البصمة
        <select class="input" name="method">
          <option value="بصمة إصبع">بصمة إصبع (Fingerprint)</option>
          <option value="بصمة وجه">بصمة وجه (Face ID)</option>
          <option value="بطاقة ممغنطة">بطاقة ذكية (RFID Card)</option>
          <option value="بصمة كف">بصمة كف (Palm)</option>
        </select>
      </label>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
      <button type="button" class="btn" data-close>إلغاء</button>
      <button class="btn pr" style="min-height:44px">${icon('device', 16)} تسجيل البصمة الآن</button>
    </div>
  </form>`, (m, close) => {
    $('#stsf', m).onsubmit = e => {
      e.preventDefault();
      const tid = e.target.teacherId.value;
      const did = e.target.deviceId.value;
      const method = e.target.method.value;
      const dev = db.device(did);
      const t = db.teacher(tid);
      const curSt = db.teacherStatusOf(tid);
      const type = (curSt.inEv && !curSt.outEv) ? 'out' : 'in';
      const ev = { id: Date.now(), teacherId: tid, type, ts: db.now(), deviceId: did, method };
      (db.teacherEvents()).push(ev);
      toast(type === 'in' ? 'تم تسجيل بصمة الدخول' : 'تم تسجيل بصمة الانصراف', `${t.name} · ${dev.name} · ${method}`);
      close();
      onDone();
    };
  });
}

function manualTeacherAttModal(onDone) {
  const tList = db.teachers();
  modal('تسجيل حضور / انصراف يدوي للمدرس', `<form id="mtf" style="display:flex;flex-direction:column;gap:12px" novalidate>
    <label class="field">اختر المدرس
      <select class="input" name="teacherId">
        ${tList.map(t => `<option value="${t.id}">${esc(t.name)} (${esc(t.subject || 'عام')})</option>`).join('')}
      </select>
    </label>
    <div class="grid g2" style="gap:10px">
      <label class="field">نوع التسجيل
        <select class="input" name="type">
          <option value="in">تسجيل حضور صباحي (دخول)</option>
          <option value="out">تسجيل انصراف نهاية الدوام (خروج)</option>
        </select>
      </label>
      <label class="field">المسؤول
        <input class="input" value="${esc(ctx().name)}" readonly>
      </label>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
      <button type="button" class="btn" data-close>إلغاء</button>
      <button class="btn pr" style="min-height:44px">${icon('check', 16)} تثبيت السجل</button>
    </div>
  </form>`, (m, close) => {
    $('#mtf', m).onsubmit = e => {
      e.preventDefault();
      const tid = e.target.teacherId.value;
      const type = e.target.type.value;
      const r = db.teacherMarkManual(tid, type, ctx().name);
      if (r.ok) {
        toast('تم تسجيل الحضور اليدوي', db.teacher(tid)?.name);
        close();
        onDone();
      }
    };
  });
}

function teacherExcuseModal(presetId, onDone) {
  const tList = db.teachers();
  modal('تسجيل إجازة / عذر رسمي لمدرس', `<form id="tef" style="display:flex;flex-direction:column;gap:12px" novalidate>
    <label class="field">المدرس
      <select class="input" name="teacherId">
        ${tList.map(t => `<option value="${t.id}" ${t.id === presetId ? 'selected' : ''}>${esc(t.name)} (${esc(t.subject || 'عام')})</option>`).join('')}
      </select>
    </label>
    <div class="grid g2" style="gap:10px">
      <label class="field">اليوم
        <select class="input" name="day">
          ${db.days().map(d => `<option value="${d}">${fmtDay(new Date(d))}</option>`).join('')}
        </select>
      </label>
      <label class="field">نوع الإجازة / العذر
        <select class="input" name="reason">
          <option value="إجازة اعتيادية">إجازة اعتيادية</option>
          <option value="إجازة مرضية">إجازة مرضية</option>
          <option value="إيفاد رسمي أو وزاري">إيفاد رسمي أو وزاري</option>
          <option value="مأذونية ساعية خاصة">مأذونية ساعية خاصة</option>
          <option value="ظرف عائلي طارئ">ظرف عائلي طارئ</option>
        </select>
      </label>
    </div>
    <label class="field">ملاحظات الإدارة
      <input class="input" name="note" placeholder="مثال: بموافقة السيد المدير / إجازة رسمية مدفوعة">
    </label>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
      <button type="button" class="btn" data-close>إلغاء</button>
      <button class="btn pr" style="min-height:44px">${icon('check', 16)} حفظ الإجازة</button>
    </div>
  </form>`, (m, close) => {
    $('#tef', m).onsubmit = e => {
      e.preventDefault();
      const tid = e.target.teacherId.value;
      const day = +e.target.day.value;
      const reason = e.target.reason.value;
      const note = e.target.note.value;
      const r = db.teacherAddExcuse(tid, { day, reason, note }, ctx().name);
      if (r.ok) {
        toast('تم تسجيل الإجازة للمدرس', `${db.teacher(tid)?.name} · ${reason}`);
        close();
        onDone();
      }
    };
  });
}

function teacherHistoryModal(teacherId) {
  const t = db.teacher(teacherId);
  if (!t) return;
  const ds = db.days();
  modal(`سجل دوام وبصمات: ${t.name}`, `<div style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;background:var(--surface-200);padding:10px 14px;border-radius:10px">
      <div><b>${esc(t.name)}</b> <span class="muted">(${esc(t.subject || 'عام')})</span></div>
      <div class="muted small num" dir="ltr">${esc(t.phone)}</div>
    </div>
    <div class="tablewrap" style="max-height:55vh;overflow:auto">
      <table>
        <thead>
          <tr>
            <th>اليوم والتاريخ</th>
            <th>بصمة الدخول</th>
            <th>بصمة الانصراف</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody>
          ${ds.map(d => {
    const st = db.teacherStatusOf(t.id, d);
    const inTime = st.inEv ? fmtTime(st.inEv.ts) : '—';
    const inDev = st.inEv ? (st.inEv.deviceId ? db.device(st.inEv.deviceId)?.name.split(' · ')[0] : 'يدوي') : '';
    const outTime = st.outEv ? fmtTime(st.outEv.ts) : '—';
    let pillHtml = '';
    if (st.status === 'present') pillHtml = '<span class="pill p-present">حاضر ✓</span>';
    else if (st.status === 'late') pillHtml = '<span class="pill p-late">متأخر ⏱</span>';
    else if (st.status === 'left') pillHtml = '<span class="pill p-left">انصرف ⏏</span>';
    else if (st.status === 'excused') pillHtml = `<span class="pill p-excused">إجازة: ${esc(st.excuse?.reason || '')}</span>`;
    else if (st.status === 'holiday') pillHtml = '<span class="pill p-quiet">عطلة</span>';
    else if (st.status === 'pending') pillHtml = '<span class="pill p-quiet">لم يبصم</span>';
    else pillHtml = '<span class="pill p-absent">غائب</span>';

    return `<tr>
              <td><b>${fmtDay(new Date(d))}</b></td>
              <td>${inTime} ${inDev ? `<small class="muted">(${inDev})</small>` : ''}</td>
              <td>${outTime}</td>
              <td>${pillHtml}</td>
            </tr>`;
  }).join('')}
        </tbody>
      </table>
    </div>
    <div style="display:flex;justify-content:flex-end">
      <button class="btn" data-close>إغلاق</button>
    </div>
  </div>`);
}

async function staffReportPdf() {
  const st = db.settings();
  const rep = db.teacherMonthReport();
  const dt = new Date(db.now());
  const F = (w, z) => `${w} ${z}px Cairo, "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif`;
  const W = 1240, M = 80;
  const NAVY = '#1E2B5C', TEAL = '#0B7F70', AMBER = '#F2A93B', RED = '#C8453F', MUTED = '#5B6478', LINE = '#E3E8EF';
  const pages = [];
  let pageNo = 0;

  const totalTeachers = rep.rows.length;
  const avgRate = totalTeachers ? Math.round(rep.rows.reduce((a, r) => a + r.rate, 0) / totalTeachers) : 100;
  const totLate = rep.rows.reduce((a, r) => a + r.c.late, 0);
  const totAbsent = rep.rows.reduce((a, r) => a + r.c.absent, 0);
  const totExc = rep.rows.reduce((a, r) => a + r.c.excused, 0);

  const header = (g, sub) => {
    pageNo++;
    g.fillStyle = NAVY;
    g.fillRect(0, 0, W, 170);
    g.fillStyle = '#fff';
    g.font = F(700, 44);
    g.fillText('تقرير دوام وحضور الكادر التعليمي', W - M, 90);
    g.font = F(400, 24);
    g.fillStyle = '#C9D6F0';
    g.fillText(`${st.schoolName} · السجل التراكمي لالتزام المدرسين${sub ? ' · ' + sub : ''}`, W - M, 138);
    g.textAlign = 'left';
    g.font = F(700, 36);
    g.fillStyle = '#fff';
    g.fillText('منصة حاضر', M, 100);
    g.textAlign = 'right';
    g.fillStyle = AMBER;
    g.fillRect(0, 170, W, 8);
  };

  const footer = g => {
    g.fillStyle = MUTED;
    g.font = F(400, 20);
    g.textAlign = 'center';
    g.fillText(`صفحة ${pageNo} · استخرج بتاريخ ${fmtDay(dt)} · نظام حاضر للبصمة البيومترية`, W / 2, 1715);
    g.textAlign = 'right';
  };

  const table = (g, y, cols, data, rowH = 50) => {
    let x = W - M;
    g.fillStyle = '#F5F7FA';
    g.fillRect(M, y, W - 2 * M, rowH);
    g.fillStyle = NAVY;
    g.font = F(700, 21);
    cols.forEach(([l, w]) => {
      g.fillText(l, x - 12, y + rowH * .64);
      x -= w;
    });
    y += rowH;
    g.font = F(400, 21);
    data.forEach((row, i) => {
      x = W - M;
      if (i % 2) {
        g.fillStyle = '#FBFCFD';
        g.fillRect(M, y, W - 2 * M, rowH);
      }
      row.forEach((v, j) => {
        g.fillStyle = typeof v === 'object' ? v.c : NAVY;
        g.fillText(String(typeof v === 'object' ? v.t : v), x - 12, y + rowH * .64);
        x -= cols[j][1];
      });
      g.strokeStyle = LINE;
      g.lineWidth = 1.2;
      g.beginPath();
      g.moveTo(M, y + rowH);
      g.lineTo(W - M, y + rowH);
      g.stroke();
      y += rowH;
    });
    return y;
  };

  const teacherData = rep.rows.map((r, idx) => [
    idx + 1,
    r.t.name,
    r.t.subject || 'عام',
    r.c.present,
    r.c.late,
    r.c.absent ? { t: r.c.absent, c: RED } : 0,
    r.c.excused,
    { t: r.rate + '%', c: r.rate >= 90 ? TEAL : r.rate >= 75 ? AMBER : RED }
  ]);

  const cols = [
    ['#', 60],
    ['اسم المدرس', 360],
    ['المادة', 160],
    ['حضور بالموعد', 130],
    ['تأخير', 110],
    ['غياب', 110],
    ['إجازة', 90],
    ['الالتزام', 90]
  ];

  const PER_FIRST = 20;
  const PER_SUB = 26;

  const firstChunk = teacherData.slice(0, PER_FIRST);
  pages.push(await pdfPage(g => {
    header(g, '');
    const cards = [
      ['الكادر الكلي', totalTeachers, NAVY],
      ['معدل الالتزام', avgRate + '%', TEAL],
      ['إجمالي التأخيرات', totLate, AMBER],
      ['إجمالي الغيابات', totAbsent, RED],
      ['إجازات رسمية', totExc, '#7A5BB0']
    ];
    const bw = (W - 2 * M - 4 * 16) / 5;
    cards.forEach(([l, v, col], i) => {
      const x = W - M - (i + 1) * bw - i * 16;
      g.fillStyle = '#F5F7FA';
      g.fillRect(x, 210, bw, 130);
      g.fillStyle = col;
      g.fillRect(x + bw - 8, 210, 8, 130);
      g.fillStyle = MUTED;
      g.font = F(600, 20);
      g.fillText(l, x + bw - 20, 250);
      g.fillStyle = col;
      g.font = F(700, 46);
      g.fillText(String(v), x + bw - 20, 314);
    });

    g.fillStyle = NAVY;
    g.font = F(700, 28);
    g.fillText(`سجل التزام المدرسين والمعلمين (${totalTeachers} مدرس)`, W - M, 390);

    table(g, 420, cols, firstChunk, 50);
    footer(g);
  }));

  for (let i = PER_FIRST; i < teacherData.length; i += PER_SUB) {
    const chunk = teacherData.slice(i, i + PER_SUB);
    pages.push(await pdfPage(g => {
      header(g, 'تابع سجل الكادر');
      table(g, 220, cols, chunk, 50);
      footer(g);
    }));
  }

  return {
    blob: jpegsToPdf(pages),
    name: `تقرير-دوام-الكادر-${dt.getFullYear()}-${dt.getMonth() + 1}.pdf`
  };
}

      } finally {
        btn.disabled = false;
        btn.innerHTML = old;
      }
    });
    $('#t-csv-btn', m)?.addEventListener('click', () => {
      const head = ['المدرس', 'المادة', 'حضور', 'تأخير', 'غياب', 'إجازة', 'نسبة الالتزام'];
      const lines = [head, ...rep.rows.map(r => [r.t.name, r.t.subject || '', r.c.present, r.c.late, r.c.absent, r.c.excused, r.rate + '%'])];
      const csv = '\uFEFF' + lines.map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `تقرير_دوام_الكادر_${dayKey(new Date())}.csv`; a.click();
    });
  });
}

/* ============ EXEMPTIONS & SPECIAL CASES (استثناءات البصمة والحالات الخاصة) ============ */
const exState = { q: '', f: 'all' };

const exemptionsView = {
  render(el) {
    const canManage = can('exemptions') || ['owner', 'admin'].includes(ctx().role);
    el.innerHTML = topbar('استثناءات البصمة والحالات الخاصة', 'إدارة إعفاءات الطلاب والملاك التدريسي من البصمة البيومترية وتوثيق القرارات الرسمية', canManage ? `<button class="btn pr" id="add-ex">${icon('plus', 18)}إضافة استثناء جديد</button>` : '') + `
    <div id="ex-stats" style="margin-bottom:14px"></div>
    <div class="card" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
      <div class="seg" id="ex-fseg" role="group" aria-label="تصفية الاستثناءات"></div>
      <label class="field" style="flex:1;min-width:220px;margin:0">
        <input class="input" id="ex-q" value="${esc(exState.q)}" placeholder="بحث بالاسم، رقم الأمر الإداري، سبب الإعفاء...">
      </label>
    </div>
    <div class="card tablewrap" id="ex-tbl"></div>`;

    $('#ex-q', el).oninput = e => { exState.q = e.target.value; this.update(el); };
    $('#add-ex', el)?.addEventListener('click', () => addExemptionModal(() => this.update(el)));

    el.addEventListener('click', e => {
      const fBtn = e.target.closest('[data-ex-f]');
      if (fBtn) {
        exState.f = fBtn.dataset.exF;
        this.update(el);
        return;
      }

      const togBtn = e.target.closest('[data-ex-tog]');
      if (togBtn) {
        const id = togBtn.dataset.exTog;
        const r = db.toggleExemption(id, ctx().name);
        if (r.ok) {
          toast(r.active ? 'تم تفعيل الاستثناء' : 'تم تعطيل الاستثناء', '');
          this.update(el);
        }
        return;
      }

      const edBtn = e.target.closest('[data-ex-edit]');
      if (edBtn) {
        const ex = db.exemptions().find(x => x.id === edBtn.dataset.exEdit);
        if (ex) editExemptionModal(ex, () => this.update(el));
        return;
      }

      const delBtn = e.target.closest('[data-ex-del]');
      if (delBtn) {
        const ex = db.exemptions().find(x => x.id === delBtn.dataset.exDel);
        if (ex) deleteExemptionModal(ex, () => this.update(el));
        return;
      }
    });

    this.update(el);
  },

  update(el) {
    const list = db.exemptions();
    const canManage = can('exemptions') || ['owner', 'admin'].includes(ctx().role);
    const total = list.length;
    const studentsCount = list.filter(x => x.targetType === 'student').length;
    const staffCount = list.filter(x => x.targetType === 'teacher').length;
    const activeCount = list.filter(x => x.active !== false).length;

    const stats = $('#ex-stats', el);
    if (stats) {
      stats.innerHTML = `
      <div class="grid g4" style="gap:10px">
        <div class="card stat" style="border-right:4px solid var(--brand)">
          <span class="pill p-quiet">إجمالي الاستثناءات</span>
          <div class="n num">${total}</div>
          <div class="small muted">مسجلة في سجل الحالات الخاصة</div>
        </div>
        <div class="card stat" style="border-right:4px solid var(--teal)">
          <span class="pill p-present">سارية المفعول</span>
          <div class="n num" style="color:var(--teal)">${activeCount}</div>
          <div class="small muted">معفية من البصمة حالياً</div>
        </div>
        <div class="card stat" style="border-right:4px solid #7A5BB0">
          <span class="pill" style="background:#F3E8FF;color:#6B21A8">طلاب مستثنون</span>
          <div class="n num" style="color:#7A5BB0">${studentsCount}</div>
          <div class="small muted">حالات مرضية / جلدية / تقارير</div>
        </div>
        <div class="card stat" style="border-right:4px solid var(--amber)">
          <span class="pill p-late">كادر ومدرسون</span>
          <div class="n num" style="color:var(--amber)">${staffCount}</div>
          <div class="small muted">إعفاء رسمي من بصمة الدوام</div>
        </div>
      </div>`;
    }

    const fseg = $('#ex-fseg', el);
    if (fseg) {
      const F = [
        ['all', `الكل (${total})`],
        ['student', `الطلاب (${studentsCount})`],
        ['teacher', `الكادر (${staffCount})`],
        ['active', `سارية (${activeCount})`],
        ['inactive', `معطلة / منتهية (${total - activeCount})`]
      ];
      fseg.innerHTML = F.map(([k, label]) => `<button type="button" data-ex-f="${k}" aria-pressed="${exState.f === k}">${label}</button>`).join('');
    }

    let rows = list;
    if (exState.f === 'student') rows = rows.filter(x => x.targetType === 'student');
    else if (exState.f === 'teacher') rows = rows.filter(x => x.targetType === 'teacher');
    else if (exState.f === 'active') rows = rows.filter(x => x.active !== false);
    else if (exState.f === 'inactive') rows = rows.filter(x => x.active === false);

    if (exState.q) {
      const q = norm(exState.q);
      rows = rows.filter(x => {
        const name = x.targetType === 'student' ? db.student(x.targetId)?.name || '' : db.teacher(x.targetId)?.name || '';
        return norm(name).includes(q) || norm(x.reason || '').includes(q) || norm(x.category || '').includes(q) || norm(x.orderNo || '').includes(q) || norm(x.notes || '').includes(q);
      });
    }

    const tbl = $('#ex-tbl', el);
    if (tbl) {
      tbl.innerHTML = rows.length ? `
      <table>
        <thead>
          <tr>
            <th>الشخص المستثنى</th>
            <th>النوع</th>
            <th>سبب الاستثناء والتصنيف</th>
            <th>المدة والسريان</th>
            <th>سياسة الحضور</th>
            <th>التوثيق الرسمي</th>
            <th>الحالة</th>
            ${canManage ? '<th>الإجراءات</th>' : ''}
          </tr>
        </thead>
        <tbody>
          ${rows.map(ex => {
        const isStu = ex.targetType === 'student';
        const person = isStu ? db.student(ex.targetId) : db.teacher(ex.targetId);
        const name = person?.name || (isStu ? 'طالب غير متوفر' : 'مدرس غير متوفر');
        const subText = isStu ? (person ? db.sectionLabel(person.sectionId) : 'طالب') : (person ? `${person.subject || 'عام'} · ${person.phone}` : 'كادر');
        const photo = isStu ? db.photoOf(ex.targetId) : null;
        const isYear = ex.mode === 'year' || (!ex.startDate && !ex.endDate);
        const durationText = isYear ? 'طوال العام الدراسي الحالي' : `من ${ex.startDate || '—'} إلى ${ex.endDate || '—'}`;
        const isAuto = (ex.attPolicy || 'auto_present') === 'auto_present';
        const policyBadge = isAuto
          ? '<span class="pill p-present" title="يُحسب حاضر تلقائياً في موعد الحضور ولا يُرسل غياب لولي الأمر">حاضر تلقائياً ✓</span>'
          : '<span class="pill" style="background:#EDE9FE;color:#5B21B6" title="يُسجّل كحالة مستثنى رسمياً">حالة خاصة 🛡️</span>';
        const isActive = ex.active !== false;

        return `<tr>
              <td>
                <div style="display:flex;gap:10px;align-items:center">
                  ${avatar(name, '', photo)}
                  <div>
                    <b>${esc(name)}</b>
                    <div class="muted small">${esc(subText)}</div>
                  </div>
                </div>
              </td>
              <td>
                <span class="pill ${isStu ? 'p-quiet' : 'p-late'}">${isStu ? 'طالب' : 'كادر تدريسي'}</span>
              </td>

function topbar(title, sub, actions = '') {
  const c = ctx();
  const ck = db.clock();
  const un = db.unread(c.inbox);
  const canSearch = ['owner', 'admin', 'teacher'].includes(c.role);
  // Back button on every page except the account's home: returns to the previous page inside the platform,
  // or to the natural parent (a section → classes, a student → students, anything else → home).
  const atHome = current ? current.name === HOME[c.role] && !current.arg : true;
  const secName = current?.name || 'dashboard';
  const scfg = getSectionSearchConfig(secName);
  return `<div class="top">
    ${atHome ? '' : `<button type="button" class="iconbtn backbtn" data-back aria-label="رجوع" title="رجوع">${icon('back', 20)}</button>`}
    <div class="t"><h1>${esc(title)}</h1><div class="muted small">${sub}</div></div>
    ${canSearch ? `<label class="search" id="gsearch" data-section="${secName}" title="${scfg.title}">${icon('search', 18)}<span class="sbadge ${scfg.isGlobal ? 'sbadge-global' : ''}">${scfg.badge}</span><input id="q" placeholder="${scfg.placeholder}" autocomplete="off" aria-label="${scfg.title}"><span class="kbd">/</span><div class="pop" id="qpop" hidden></div></label>` : ''}
    <span class="clock" title="${ck.mode === 'real' ? 'الوقت الحقيقي' : 'ساعة العرض التجريبي'}"><span class="dot ${ck.paused && ck.mode !== 'real' ? '' : 'live'}"></span><span class="num" id="clk">${clockText()}</span>
      ${ck.mode === 'real' ? '' : `<button class="btn sm" data-clock="${ck.paused ? 'play' : 'pause'}" aria-label="${ck.paused ? 'تشغيل' : 'إيقاف'} الساعة" style="min-height:28px;padding:0 8px">${icon(ck.paused ? 'play' : 'pause', 14)}</button>`}</span>
    <button type="button" class="iconbtn mobonly" data-install title="ثبّت «حاضر» على شاشتك" aria-label="ثبّت التطبيق على الشاشة" ${matchMedia('(display-mode: standalone)').matches || navigator.standalone ? 'hidden' : ''}>${icon('download')}</button>
    <span class="bellwrap"><button type="button" class="iconbtn" data-bell aria-label="الإشعارات" aria-expanded="false" aria-haspopup="dialog">${icon('bell')}${un ? `<span class="cnt">${un}</span>` : ''}</button><div class="npop" id="npop" role="dialog" aria-label="الإشعارات" hidden></div></span>
    ${actions}
    <button class="iconbtn mob logoutm" data-logout aria-label="تسجيل الخروج">${icon('logout')}</button>
  </div>`;
}

// Hader wordmark: custom rounded Kufi «حاضر» in two tones: the ح in teal (present ✓), the rest in navy, and the gold "something new" diamond.
const WM_REST = '<path d="M198 100 V16"/><path d="M118 100 V88 Q118 64 141 64 Q164 64 164 88 V100 H78 Q62 100 60 116 L57 132"/><path d="M98 100 V86"/>';
const WM_HAH = '<path d="M226 62 H272 L240 100 H198"/>';
const WM = WM_REST + WM_HAH;
const wmInner = (color, teal, dot) => `<g fill="none" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"><g stroke="${color}">${WM_REST}</g><g stroke="${teal}">${WM_HAH}</g></g><rect x="131.5" y="26.5" width="19" height="19" rx="2.3" transform="rotate(45 141 36)" fill="${dot}"/>`;
function wordmark(h = 32, color = '#1E2B5C', dot = '#F2A93B') {
  const w = Math.round(h * 242 / 140);
  const teal = color === '#1E2B5C' ? '#0B7F70' : '#34C3AE';
  return `<svg width="${w}" height="${h}" viewBox="44 4 242 140" role="img" aria-label="حاضر" style="display:block">${wmInner(color, teal, dot)}</svg>`;
}
let logoN = 0;
function logo(size = 32) {
  const id = 'hl' + (++logoN);
  return `<svg width="${size}" height="${size}" viewBox="0 0 1024 1024" aria-hidden="true" style="display:block;flex:none"><defs><radialGradient id="${id}g" cx="28%" cy="18%" r="100%"><stop offset="0" stop-color="#2E408A"/><stop offset=".55" stop-color="#1E2B5C"/><stop offset="1" stop-color="#111936"/></radialGradient><linearGradient id="${id}l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7C873"/><stop offset=".5" stop-color="#F2A93B"/><stop offset="1" stop-color="#C98322"/></linearGradient></defs><rect width="1024" height="1024" rx="230" fill="url(#${id}g)"/><rect x="40" y="40" width="944" height="944" rx="196" fill="none" stroke="url(#${id}l)" stroke-opacity=".45" stroke-width="${size < 48 ? 0 : 5}"/><g transform="translate(512 512) scale(${size < 48 ? 3.4 : 2.85}) translate(-165 -74)">${wmInner('#FFFFFF', '#34C3AE', `url(#${id}l)`)}</g></svg>`;
}

/* ---------- contextual / section-scoped search ---------- */
// Picking a student from search: pages that can show that student in place (attendance, reports)
// do so and keep you where you are; everywhere else opens the student's profile.
function go(it) {
  if (typeof it === 'object' && it?.onClick) {
    it.onClick();
    return;
  }
  const href = typeof it === 'string' ? it : it?.href;
  if (!href) return;
  const m = href.match(/^#\/student\/(.+)$/);
  if (m && current?.view?.pickStudent && current.view.pickStudent(current.el, m[1])) return;
  location.hash = href;
}

function bindSearch(root) {
  const input = $('#q', root); if (!input) return;
  const pop = $('#qpop', root); let sel = 0, items = [];
  const secName = current?.name || 'dashboard';
  const scfg = getSectionSearchConfig(secName);

  const resetInPageFilters = () => {
    if (secName === 'students') {
      const sq = $('#sq', current?.el);
      if (sq && sq.value) { sq.value = ''; sq.dispatchEvent(new Event('input', { bubbles: true })); }
    } else if (secName === 'attendance') {
      const aq = $('#aq', current?.el);
      if (aq && aq.value) { aq.value = ''; aq.dispatchEvent(new Event('input', { bubbles: true })); }
    } else if (secName === 'reports') {
      const rq = $('#rq', current?.el);
      if (rq && rq.value) { rq.value = ''; rq.dispatchEvent(new Event('input', { bubbles: true })); }
    } else if (secName === 'users') {
      const uq = $('#uq', current?.el);
      if (uq && uq.value) { uq.value = ''; uq.dispatchEvent(new Event('input', { bubbles: true })); }
    } else if (secName === 'audit') {
      const audq = $('#audq', current?.el);
      if (audq && audq.value) { audq.value = ''; audq.dispatchEvent(new Event('input', { bubbles: true })); }
    } else if (secName === 'devices') {
      $$('#live .tile', current?.el).forEach(el => el.style.display = '');
    } else if (secName === 'classes') {
      $$('#live .card, #live .sec, #live [data-addsec]', current?.el).forEach(el => el.style.display = '');
    } else if (secName === 'posts') {
      $$('#live .card, #live [data-post]', current?.el).forEach(card => card.style.display = '');
    } else if (secName === 'marks') {
      $$('#live .card', current?.el).forEach(card => card.style.display = '');
    } else if (secName === 'inbox') {
      $$('#live .ticket', current?.el).forEach(t => t.style.display = '');
    }
  };

  const triggerItem = (it) => {
    if (!it) return;
    if (it.onClick) {
      it.onClick();
    } else if (it.href) {
      go(it.href);
    }
    input.value = '';
    pop.hidden = true;
  };

  const run = () => {
    const q = input.value.trim();
    if (!q) {
      pop.hidden = true;
      resetInPageFilters();
      return;
    }
    const nq = norm(q);
    const mark = s => {
      if (!s) return '';
      const str = String(s);
      const n = norm(str); const i = n.indexOf(nq);
      return i < 0 ? esc(str) : esc(str.slice(0, i)) + '<mark>' + esc(str.slice(i, i + q.length)) + '</mark>' + esc(str.slice(i + q.length));
    };

    items = [];

    if (scfg.isGlobal) {
      // ===== GLOBAL SEARCH (الرئيسية فقط للسهولة) =====
      const r = db.search(q, scope());
      items = [
        ...r.students.map(s => {
          const st = db.statusOf(s.id).status;
          return {
            href: `#/student/${s.id}`,
            html: `${avatar(s.name, st, db.photoOf(s.id))}<div style="flex:1;min-width:0"><b>${mark(s.name)}</b><div class="muted small">${esc(db.sectionShort(s.sectionId))} · رقم <span class="num">${s.no}</span></div></div>${pill(st)}`
          };
        }),
        ...r.sections.map(s => ({
          href: `#/section/${s.id}`,
          html: `<span class="tip" style="width:42px;height:42px;border-radius:13px">${icon('grade', 16)}<b>${esc(db.grade(s.gradeId).short)}</b></span><div style="flex:1"><b>${esc(db.sectionLabel(s.id))}</b><div class="muted small">${db.students(s.id).length} طالباً</div></div>`
        })),
        ...r.guardians.map(g => {
          const kids = db.childrenOf(g.id);
          return {
            href: `#/student/${kids[0]?.id}`,
            html: `<span class="av" style="background:var(--surface-300);color:var(--ink)">و</span><div style="flex:1"><b>${mark(g.name)}</b><div class="muted small">ولي أمر ${esc(kids.map(k => db.first(k.name)).join('، '))} · <span class="num" dir="ltr">${maskPhone(g.phone)}</span></div></div>`
          };
        }),
      ];
    } else {
      // ===== SECTION-SPECIFIC SEARCH (حسب نوع القسم) =====
      const sc = scope();

      if (secName === 'students') {
        const r = db.search(q, sc).students;
        items = r.map(s => {
          const st = db.statusOf(s.id).status;
          const g = db.guardian(s.guardianId);
          return {
            href: `#/student/${s.id}`,
            html: `${avatar(s.name, st, db.photoOf(s.id))}<div style="flex:1;min-width:0"><b>${mark(s.name)}</b><div class="muted small">${esc(db.sectionShort(s.sectionId))} · رقم <span class="num">${s.no}</span>${g ? ` · ولي الأمر: ${esc(g.name)}` : ''}</div></div>${pill(st)}`
          };
        });
        const sq = $('#sq', current?.el);
        if (sq && sq.value !== q) {
          sq.value = q;
          sq.dispatchEvent(new Event('input', { bubbles: true }));
        }

      } else if (secName === 'attendance') {
        let list = db.students();
        if (sc.sections) list = list.filter(s => sc.sections.includes(s.sectionId));
        const matched = list.filter(s => norm(s.name).includes(nq) || String(s.no).includes(q));
        const attDay = db.days()[0];
        items = matched.map(s => {
          const x = db.statusOf(s.id, attDay);
          const timeInfo = x.inEv ? fmtTime(x.inEv.ts) : (x.excuse ? x.excuse.reason : 'لم يصل');
          return {
            href: `#/student/${s.id}`,
            onClick: () => {
              if (current?.view?.pickStudent) current.view.pickStudent(current.el, s.id);
              else location.hash = `#/student/${s.id}`;
            },
            html: `${avatar(s.name, x.status, db.photoOf(s.id))}<div style="flex:1;min-width:0"><b>${mark(s.name)}</b><div class="muted small">${esc(db.sectionShort(s.sectionId))} · ${timeInfo}</div></div>${pill(x.status)}`
          };
        });
        const aq = $('#aq', current?.el);
        if (aq && aq.value !== q) {
          aq.value = q;
          aq.dispatchEvent(new Event('input', { bubbles: true }));
        }

      } else if (secName === 'classes') {
        const secs = sc.sections ? db.sections().filter(s => sc.sections.includes(s.id)) : db.sections();
        const matched = secs.filter(s => norm(db.sectionLabel(s.id)).includes(nq) || norm(s.homeroom || '').includes(nq) || String(s.room || '').includes(q));
        items = matched.map(s => ({
          href: `#/section/${s.id}`,
          html: `<span class="tip" style="width:42px;height:42px;border-radius:13px">${icon('grade', 16)}<b>${esc(db.grade(s.gradeId).short)}</b></span><div style="flex:1;min-width:0"><b>${mark(db.sectionLabel(s.id))}</b><div class="muted small">مشرف الشعبة: ${esc(s.homeroom || '—')} · ${db.students(s.id).length} طالباً · قاعة <span class="num">${s.room}</span></div></div>`
        }));
        $$('#live .card, #live .sec, #live [data-addsec]', current?.el).forEach(el => {
          const text = el.textContent || '';
          el.style.display = norm(text).includes(nq) ? '' : 'none';
        });

      } else if (secName === 'section') {
        const secId = current?.arg;
        const list = db.students(secId);
        const matched = list.filter(s => norm(s.name).includes(nq) || String(s.no).includes(q));
        items = matched.map(s => {
          const x = db.statusOf(s.id);
          return {
            href: `#/student/${s.id}`,
            html: `${avatar(s.name, x.status, db.photoOf(s.id))}<div style="flex:1;min-width:0"><b>${mark(s.name)}</b><div class="muted small">رقم <span class="num">${s.no}</span> · شعبة ${esc(db.sectionShort(s.sectionId))}</div></div>${pill(x.status)}`
          };
        });

      } else if (secName === 'devices') {
        const devs = db.devices ? db.devices() : [];
        const matched = devs.filter(d => norm(d.name).includes(nq) || norm(d.location || '').includes(nq) || (d.ip && d.ip.includes(q)) || (d.serial && d.serial.includes(q)) || (d.model && norm(d.model).includes(nq)));
        items = matched.map(d => ({
          href: `#/devices`,
          onClick: () => {
            const card = $(`[data-dev-id="${d.id}"]`, current?.el);
            if (card) {
              card.scrollIntoView({ behavior: 'smooth', block: 'center' });
              card.style.outline = '2px solid var(--teal)';
              setTimeout(() => { card.style.outline = ''; }, 2000);
            }
          },
          html: `<span class="ti" style="width:40px;height:40px;border-radius:12px;--ic:${d.online ? '#0B7F70' : '#C8453F'}">${icon(d.type === 'zk' ? 'device' : 'child', 20)}</span><div style="flex:1;min-width:0"><b>${mark(d.name)}</b><div class="muted small">${esc(d.model || '')} · <span class="num" dir="ltr">${esc(d.serial || d.ip || '—')}</span></div></div><span class="pill ${d.online ? 'p-present' : 'p-absent'}">${d.online ? 'متصل' : 'منقطع'}</span>`
        }));
        $$('#live .tile', current?.el).forEach(tile => {
          const text = tile.textContent || '';
          tile.style.display = norm(text).includes(nq) ? '' : 'none';
        });

      } else if (secName === 'posts') {
        const posts = db.posts ? db.posts(scope()) : [];
        const matched = posts.filter(p => norm(p.title || '').includes(nq) || norm(p.body || '').includes(nq) || norm(p.by || '').includes(nq) || (p.subject && norm(p.subject).includes(nq)));
        items = matched.map(p => ({
          href: `#/posts`,
          onClick: () => {
            const card = $(`[data-post="${p.id}"]`, current?.el);
            if (card) card.click();
            else location.hash = '#/posts';
          },
          html: `<span class="ti" style="width:40px;height:40px;border-radius:12px;--ic:${p.type === 'hw' ? '#C47F17' : '#1E2B5C'}">${icon(p.type === 'hw' ? 'book' : 'spark', 18)}</span><div style="flex:1;min-width:0"><b>${mark(p.title)}</b><div class="muted small">${esc(p.subject || (p.type === 'hw' ? 'واجب' : 'إعلان'))} · ${esc(p.by || '')}</div></div>`
        }));
        $$('#live .card, #live [data-post]', current?.el).forEach(card => {
          const text = card.textContent || '';
          card.style.display = norm(text).includes(nq) ? '' : 'none';
        });

      } else if (secName === 'marks') {
        const secs = sc.sections ? db.sections().filter(s => sc.sections.includes(s.id)) : db.sections();
        const allMarks = db.marks ? db.marks({ sections: secs.map(s => s.id) }) : [];
        const matched = allMarks.filter(m => norm(m.subject || '').includes(nq) || norm(m.exam || '').includes(nq) || norm(m.lesson || '').includes(nq) || norm(m.byName || '').includes(nq));
        items = matched.map(m => ({
          href: `#/marks`,
          onClick: () => {
            const card = $(`[data-sheet="${m.id}"]`, current?.el);
            if (card) card.click();
            else location.hash = '#/marks';
          },
          html: `<span class="ti" style="width:40px;height:40px;border-radius:12px;--ic:#1E2B5C">${icon('grade', 20)}</span><div style="flex:1;min-width:0"><b>${mark(m.subject)} · ${mark(m.exam)}</b><div class="muted small">${esc(db.sectionShort(m.sectionId))} · ${esc(m.byName || '')}</div></div>`
        }));
        $$('#live .card', current?.el).forEach(card => {
          const text = card.textContent || '';
          card.style.display = norm(text).includes(nq) ? '' : 'none';
        });

      } else if (secName === 'users') {
        const accounts = db.accounts ? db.accounts() : [];
        const matched = accounts.filter(a => a.roles.some(r => norm(r.name || '').includes(nq)) || (a.phone && a.phone.includes(q)) || (() => { const cr = db.credOf(a.phone); return cr && norm(cr.username || '').includes(nq); })());
        items = matched.map(a => {
          const cr = db.credOf(a.phone);
          return {
            href: `#/users`,
            onClick: () => {
              const row = $(`[data-edit="${a.phone}"]`, current?.el)?.closest('tr');
              if (row) { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); row.style.background = 'var(--surface-300)'; setTimeout(() => { row.style.background = ''; }, 2000); }
            },
            html: `${avatar(a.roles[0]?.name || '')}<div style="flex:1;min-width:0"><b>${mark(a.roles[0]?.name || '')}</b><div class="muted small">${esc(a.roles.map(r => r.role).join('، '))} · <span class="num" dir="ltr">${esc(cr?.username || maskPhone(a.phone))}</span></div></div>`
          };
        });
        const uq = $('#uq', current?.el);
        if (uq && uq.value !== q) {
          uq.value = q;
          uq.dispatchEvent(new Event('input', { bubbles: true }));
        }

      } else if (secName === 'audit') {
        const logs = db.audit ? db.audit() : [];
        const matched = logs.filter(a => norm(a.actor || '').includes(nq) || norm(a.action || '').includes(nq) || norm(a.detail || a.details || '').includes(nq));
        items = matched.slice(0, 40).map(a => ({
          href: `#/audit`,
          html: `<div style="flex:1;min-width:0"><b>${mark(a.action || 'عملية')}</b><div class="muted small">${esc(a.actor || a.by || '—')} · ${esc(a.detail || a.details || '')} · <span class="num">${fmtTime(a.ts)}</span></div></div>`
        }));
        const audq = $('#audq', current?.el);
        if (audq && audq.value !== q) {
          audq.value = q;
          audq.dispatchEvent(new Event('input', { bubbles: true }));
        }

      } else if (secName === 'inbox') {
        const tickets = db.tickets ? db.tickets(sc) : [];
        const matched = tickets.filter(t => norm(t.name || '').includes(nq) || norm(t.question || '').includes(nq));
        items = matched.map(t => ({
          href: `#/inbox`,
          onClick: () => {
            const card = $(`[data-reply="${t.id}"]`, current?.el)?.closest('.ticket');
            if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); card.style.outline = '2px solid var(--teal)'; setTimeout(() => { card.style.outline = ''; }, 2000); }
          },
          html: `<div style="flex:1;min-width:0"><b>${mark(t.name)}</b><div class="muted small">${esc((t.question || '').slice(0, 60))}</div></div><span class="pill ${t.status === 'open' ? 'p-late' : 'p-present'}">${t.status === 'open' ? 'بانتظار الرد' : 'تم الرد'}</span>`
        }));
        $$('#live .ticket', current?.el).forEach(ticket => {
          const text = ticket.textContent || '';
          ticket.style.display = norm(text).includes(nq) ? '' : 'none';
        });

      } else if (secName === 'reports') {
        const r = db.search(q, sc).students;
        items = r.map(s => {
          const st = db.statusOf(s.id).status;
          return {
            href: `#/student/${s.id}`,
            html: `${avatar(s.name, st, db.photoOf(s.id))}<div style="flex:1;min-width:0"><b>${mark(s.name)}</b><div class="muted small">${esc(db.sectionShort(s.sectionId))} · رقم <span class="num">${s.no}</span></div></div>${pill(st)}`
          };
        });
        const rq = $('#rq', current?.el);
        if (rq && rq.value !== q) {
          rq.value = q;
          rq.dispatchEvent(new Event('input', { bubbles: true }));
        }

      } else {
        const r = db.search(q, sc).students;
        items = r.map(s => {
          const st = db.statusOf(s.id).status;
          return {
            href: `#/student/${s.id}`,
            html: `${avatar(s.name, st, db.photoOf(s.id))}<div style="flex:1;min-width:0"><b>${mark(s.name)}</b><div class="muted small">${esc(db.sectionShort(s.sectionId))} · رقم <span class="num">${s.no}</span></div></div>${pill(st)}`
          };
        });
      }
    }

    sel = 0;
    pop.innerHTML = items.length
      ? items.map((it, i) => `<div class="row ${i === sel ? 'on' : ''}" data-idx="${i}" data-href="${it.href || ''}">${it.html}</div>`).join('')
      : `<div class="empty">لا توجد نتائج في هذا القسم لـ «${esc(q)}»</div>`;
    pop.hidden = false;
  };

  input.addEventListener('input', run);
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();

      $$('.row', pop).forEach((r, i) => r.classList.toggle('on', i === sel));
    }
    if (e.key === 'Enter' && items[sel]) {
      triggerItem(items[sel]);
    }
    if (e.key === 'Escape') {
      input.value = '';
      pop.hidden = true;
      resetInPageFilters();
      input.blur();
    }
  });
  pop.addEventListener('mousedown', e => {
    const r = e.target.closest('[data-idx]');
    if (r) {

      const idx = +r.dataset.idx;

function route() {
  if (db.session() && !db.sessionValid()) db.kickOut();
  const c = ctx();
  const [rawName = '', rawArg] = location.hash.replace(/^#\/?/, '').split('/');
  const name = rawName.split('?')[0]; let arg = rawArg && rawArg.split('?')[0];
  try { if (arg) arg = decodeURIComponent(arg); } catch { } // Arabic section ids arrive URL-encoded
  if (!c) { document.body.classList.remove('msheet-open'); activeRoleKey = null; current = null; app.innerHTML = ''; views.login.render(app); window.scrollTo(0, 0); return; }
  { const u = db.credOf(c.phone); db.setActor(`${c.name}${u && !u.pending ? ' · ' + u.username : ''} (${c.roleInfo.label.split(' · ')[0]})`); }
  const allowed = [...navFor(c).map(n => n[0]), 'notes', ...(['owner', 'admin', 'teacher'].includes(c.role) ? ['student', 'section'] : [])];
  const target = allowed.includes(name) && views[name] ? name : HOME[c.role];
  if (target !== name) { location.replace(`#/${target}`); return; }
  // Remember where we came from so the back button returns there (not out of the platform).
  const here = `#/${name}${arg ? '/' + arg : ''}`;
  if (navStack[navStack.length - 1] !== here) { if (navStack[navStack.length - 2] === here) navStack.pop(); else navStack.push(here); if (navStack.length > 30) navStack.shift(); }

  const curRoleKey = `${c.phone}_${c.rid || c.role}`;
  const shellNeeded = !$('.app') || !$('#main') || !$('.side .nav') || activeRoleKey !== curRoleKey;

  if (shellNeeded) {
    activeRoleKey = curRoleKey;
    app.innerHTML = shell(c, name);
    const sn = $('.side .nav');
    if (sn && sideNavScroll) sn.scrollTop = sideNavScroll;
  } else {
    updateNav(c, name);
  }

  let main = $('#main');
  if (main && !shellNeeded) {
    const cleanMain = main.cloneNode(false);
    main.parentNode.replaceChild(cleanMain, main);
    main = cleanMain;
  }
  current = { name, arg, view: views[name], el: main };
  views[name].render(main, arg);
  bindChrome();
  applyProtection();
  window.scrollTo(0, 0);

  const activeLink = document.querySelector(`.side .nav a[href="#/${name}"]`);
  activeLink?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

    <div><b>أندرويد (Chrome)</b><ol class="small" style="margin:6px 0 0;padding-inline-start:20px;line-height:2"><li>افتح رابط المنصة بـChrome</li><li>اضغط النقاط الثلاث فوك</li><li>اختار «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»</li></ol></div>
    <div><b>الحاسبة (Chrome أو Edge)</b><div class="small muted">اضغط أيقونة التثبيت يم شريط العنوان.</div></div>
    <button class="btn pr" data-close>تمام</button></div>`);
});
// Unread notifications appear as a number on the app icon (phones and computers that support it).
function appBadge() { try { const c = ctx(); const n = c ? db.unread(c.inbox) : 0; if ('setAppBadge' in navigator) (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {}); } catch { } }
db.subscribe(() => { appBadge(); showInstallBtn(); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
setTimeout(() => { showInstallBtn(); appBadge(); }, 500);

/* ---------- privacy: protect what parents and students see ----------
   A website cannot fully block screenshots (only a native app can). What it can do: no downloads, no copy/print,
   cover the screen when the app goes to the background, and stamp every screen, page and video with the viewer's
   name and number so any photo of it shows who took it. */
function protectedViewer() { const c = ctx(); return !!c && (c.role === 'parent' || c.role === 'student'); }
function watermarkText() { const c = ctx(); if (!c) return ''; const ph = String(c.phone || ''); return `${c.name} · ${ph.slice(0, 4)}•••${ph.slice(-3)} · ${fmtDay(new Date(db.now()))}`; }
function watermarkTile(text, op = 0.13, color = '#1E2B5C') {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220"><text x="180" y="110" text-anchor="middle" fill="${color}" stroke="${color === '#FFFFFF' ? '#000' : 'none'}" stroke-opacity="${op * .6}" stroke-width=".6" fill-opacity="${op}" font-family="Cairo, Tahoma, sans-serif" font-size="15" font-weight="700" transform="rotate(-24 180 110)">${text.replace(/[<&>]/g, '')}</text></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function applyProtection() {
  const p = db.protection(); const on = protectedViewer();
  document.body.classList.toggle('prot-copy', on && p.noCopy);
  document.body.classList.toggle('prot-print', on);
  let wm = document.getElementById('wm');
  if (on && p.watermark) { if (!wm) { wm = document.createElement('div'); wm.id = 'wm'; wm.setAttribute('aria-hidden', 'true'); document.body.append(wm); } wm.style.backgroundImage = watermarkTile(watermarkText()); }
  else wm?.remove();
}
const blocked = e => protectedViewer() && db.protection().noCopy;
document.addEventListener('contextmenu', e => { if (blocked() && !e.target.closest('input,textarea')) e.preventDefault(); });
document.addEventListener('dragstart', e => { if (blocked() && e.target.closest('img,video,canvas,a')) e.preventDefault(); });
document.addEventListener('copy', e => { if (blocked() && !e.target.closest?.('input,textarea')) { e.preventDefault(); toast('النسخ غير مسموح', 'محتوى المدرسة خاص', 'absent'); } });
document.addEventListener('keydown', e => {
  if (!protectedViewer()) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ['s', 'p'].includes(k)) { e.preventDefault(); toast(k === 'p' ? 'الطباعة غير مسموحة' : 'الحفظ غير مسموح', 'محتوى المدرسة خاص', 'absent'); }
  if (k === 'printscreen') { veil(true); setTimeout(() => veil(false), 1200); try { navigator.clipboard?.writeText(''); } catch { } toast('لقطة الشاشة غير مسموحة', 'كل صورة تطلع عليها اسمك ورقمك', 'absent'); }
});
function veil(v) { document.body.classList.toggle('veiled', v && protectedViewer() && db.protection().blurOnLeave); }
document.addEventListener('visibilitychange', () => veil(document.hidden));
window.addEventListener('blur', () => veil(true));
window.addEventListener('focus', () => veil(false));
window.addEventListener('beforeprint', () => { if (protectedViewer()) toast('الطباعة غير مسموحة', 'محتوى المدرسة خاص', 'absent'); });
db.subscribe(w => { if (w === 'settings') applyProtection(); });

})();

</script>
