  'linear-gradient(135deg, #DB2777, #BE185D)',
  'linear-gradient(135deg, #0891B2, #0E7490)',
  'linear-gradient(135deg, #4F46E5, #4338CA)',
  'linear-gradient(135deg, #EA580C, #C2410C)',
];

const attendance = {
  pickStudent(el, id) {
    const s = db.student(id); const sc = scope(); if (!s || (sc.sections && !sc.sections.includes(s.sectionId))) return false;
    att.sec = s.sectionId; att.q = s.name; att.f = 'all';
    this.update(el); return true;
  },
  render(el) {
    const qs = new URLSearchParams(location.hash.split('?')[1] || '');
    if (qs.get('f')) att.f = qs.get('f');
    if (qs.get('sec')) att.sec = qs.get('sec');
    const sc = scope();
    if (sc.sections && att.sec && !sc.sections.includes(att.sec)) att.sec = '';
    att.day = att.day || db.days()[0];
    const canManage = can('att') || ['owner', 'admin'].includes(ctx().role);
    el.innerHTML = topbar('الحضور والانصراف', sub(), canManage ? `<button class="btn" id="att-hol-btn">${icon('calendar', 16)} إعلان عطلة رسمية / طارئة</button>` : '') + `
    <div id="att-hol-banner"></div>
    <div id="att-content"></div>`;

    el.onclick = e => {
      if (e.target.closest('#att-hol-btn')) {
        officialHolidayModal(att.day, null, () => this.update(el));
        return;
      }
      const editH = e.target.closest('[data-edit-hol]');
      if (editH) {
        const d = editH.dataset.editHol;
        officialHolidayModal(d, d, () => this.update(el));
        return;
      }
      const pubH = e.target.closest('[data-publish-hol]');
      if (pubH) {
        const d = pubH.dataset.publishHol;
        db.publishHoliday(d, ctx().name);
        toast('تم نشر العطلة رسمياً وإشعار الطلاب والمدرسين 📢', d);
        this.update(el);
        return;
      }
      const delH = e.target.closest('[data-del-hol]');
      if (delH) {
        const d = delH.dataset.delHol;
        if (confirm('هل أنت متأكد من حذف وإلغاء هذه العطلة واستئناف الدوام؟')) {
          db.removeHoliday(d, ctx().name);
          toast('تم حذف العطلة واستئناف الدوام', d);
          this.update(el);
        }
        return;
      }
      const openSec = e.target.closest('[data-open-sec]');
      if (openSec) {
        att.sec = openSec.dataset.openSec;
        att.q = '';
        att.f = 'all';
        this.update(el);
        return;
      }
      const pickStu = e.target.closest('[data-pick-stu]');
      if (pickStu) {
        this.pickStudent(el, pickStu.dataset.pickStu);
        return;
      }
      if (e.target.closest('#btn-back-to-apps')) {
        att.sec = '';
        att.q = '';
        att.f = 'all';
        this.update(el);
        return;
      }
      const f = e.target.closest('[data-f]');
      if (f) {
        att.f = f.dataset.f;
        this.update(el);
        return;
      }
      const m = e.target.closest('[data-mark]');
      if (m) {
        db.markManual(m.dataset.mark, ctx().name);
        toast('سُجّل الحضور يدوياً', db.student(m.dataset.mark).name);
        this.update(el);
        return;
      }
      const x = e.target.closest('[data-excuse]');
      if (x) {
        excuseModal(db.student(x.dataset.excuse), () => this.update(el));
        return;
      }
    };
    this.update(el);
  },
  update(el) {
    const sc = scope();
    const canManage = can('att') || ['owner', 'admin'].includes(ctx().role);
    att.day = att.day || db.days()[0];
    const isToday = att.day === db.days()[0];
    const isHoliday = db.offDay(att.day);
    const holInfo = db.holidayOn(att.day);

    const bannerBox = $('#att-hol-banner', el);
    if (bannerBox) {
      bannerBox.innerHTML = holBannerHtml(holInfo, isHoliday, canManage, att.day);
    }

    const container = $('#att-content', el);
    if (!container) return;

    // Get allowed sections for this user
    const allSecs = db.sections();
    const allowedSecs = sc.sections ? allSecs.filter(s => sc.sections.includes(s.id)) : allSecs;

    // 1. APPS DASHBOARD VIEW (When no section is selected)
    if (!att.sec || !allowedSecs.some(s => s.id === att.sec)) {
      const q = (att.appQ || '').trim();
      const nq = norm(q);
      const allGrades = db.grades();
      const schoolStudents = sc.sections ? db.students().filter(s => sc.sections.includes(s.sectionId)) : db.students();
      const schoolSummary = db.summary(schoolStudents, att.day);

      // Filter sections based on search (grade name, short code like 5ع/2م, section name, supervisor, stage)
      const filteredSecs = allowedSecs.filter(s => {
        if (!nq) return true;
        const g = db.grade(s.gradeId);
        const text = `${g?.name || ''} ${g?.short || ''} ${s.name} ${s.homeroom || ''} ${g?.stage || ''}`;
        return norm(text).includes(nq);
      });

      // Also search students by name, number, or deviceId
      const matchedStudents = nq ? schoolStudents.filter(s =>
        norm(s.name).includes(nq) || String(s.no || '').includes(q) || String(s.deviceId || '').includes(q)
      ) : [];

      // Group sections by Grade
      const gradesWithSecs = allGrades.map((g, idx) => {
        const secs = filteredSecs.filter(s => s.gradeId === g.id);
        return { grade: g, secs, colorIndex: idx };
      }).filter(g => g.secs.length > 0);

      const stuResultsHtml = matchedStudents.length ? `
        <div class="card" style="margin-bottom:16px;padding:14px 16px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px">
            <div style="display:flex;align-items:center;gap:8px">
              <span class="ki t" style="width:28px;height:28px;border-radius:9px">${icon('users', 14)}</span>
              <h2 style="margin:0;font-size:15px">نتائج البحث في الطلاب</h2>
              <span class="pill p-quiet num">${matchedStudents.length}</span>
            </div>
            ${matchedStudents.length > 25 ? `<span class="muted small">يُعرض أول 25 نتيجة</span>` : ''}
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            ${matchedStudents.slice(0, 25).map(s => {
              const x = db.statusOf(s.id, att.day);
              const isH = x.status === 'holiday';
              return `<div class="row" style="padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-100);gap:10px;flex-wrap:wrap">
                <a href="#/student/${s.id}" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:10px;flex:1;min-width:180px">
                  ${avatar(s.name, x.status, db.photoOf(s.id))}
                  <div style="min-width:0">
                    <b style="display:block">${esc(s.name)}</b>
                    <div class="muted small">${esc(db.sectionLabel(s.sectionId))} · رقم <span class="num">${s.no}</span>${x.inEv ? ` · وصول <span class="num">${fmtTime(x.inEv.ts)}</span>` : ''}</div>
                  </div>
                </a>
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                  ${isH ? '<span class="pill" style="background:#E0E7FF;color:#3730A3;border:1px solid #C7D2FE">عطلة رسمية</span>' : pill(x.status)}
                  ${!isH && isToday && can('att') && (x.status === 'pending' || x.status === 'absent') ? `<button type="button" class="btn sm pr" data-mark="${s.id}">حضور يدوي</button><button type="button" class="btn sm" data-excuse="${s.id}">عذر</button>` : ''}
                  <button type="button" class="btn sm" data-pick-stu="${s.id}">فتح الشعبة</button>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>` : '';

      container.innerHTML = `
      <div class="card ap-bar">
        <label class="field" style="min-width:190px">اليوم
          <select class="input" id="day">
            ${db.days().map((d, i) => `<option value="${d}" ${d === att.day ? 'selected' : ''}>${i === 0 ? 'اليوم · ' : ''}${fmtDay(new Date(d))}</option>`).join('')}
          </select>
        </label>
        <label class="field" style="flex:1;min-width:220px">بحث عن طالب أو صف أو شعبة
          <input class="input" id="app-q" value="${esc(att.appQ || '')}" placeholder="اسم الطالب، رقمه، اسم الصف، الشعبة أو مشرف الشعبة">
        </label>
        <div class="ap-kpis" aria-label="ملخص المدرسة">
          <div class="ap-kpi"><b>${schoolStudents.length}</b><span>الطلاب</span></div>
          ${isHoliday ? `<div class="ap-kpi"><b style="font-size:13px;padding:3px 0">${icon('calendar', 14)}</b><span>عطلة رسمية</span></div>` : `
          <div class="ap-kpi t"><b>${schoolSummary.came}</b><span>حاضر</span></div>
          <div class="ap-kpi r"><b>${schoolSummary.absent}</b><span>غائب</span></div>
          <div class="ap-kpi a"><b>${schoolSummary.late}</b><span>متأخر</span></div>`}
        </div>
      </div>

      ${stuResultsHtml}

      ${gradesWithSecs.length ? [...new Set(gradesWithSecs.map(x => x.grade.stage))].map((stage, sti) => `
        <div class="stg-h st${sti % 3}"><span class="stg-i">${icon('grade', 16)}</span><h2>المرحلة ${esc(String(stage || '').replace('ال', ''))}</h2><span class="stg-c">${gradesWithSecs.filter(x => x.grade.stage === stage).length} صف</span></div>
        <div class="tiles" style="margin-bottom:18px">${gradesWithSecs.filter(x => x.grade.stage === stage).map(({ grade: g, secs }) => {
          const gl = secs.flatMap(s => db.students(s.id)); const gx = db.summary(gl, att.day);
          const gc = gx.rate >= 90 ? 'teal' : 'amber';
          return `<div class="tile">
            <div style="display:flex;gap:12px;align-items:center">
              <span class="tip st${sti % 3}">${icon('grade', 20)}<b>${esc(g.short || g.name.slice(0, 2))}</b></span>
              <div style="flex:1;min-width:0"><b style="font-size:17px">${esc(g.name)}</b><div class="muted small">${secs.length} شعبة · ${gl.length} طالباً</div></div>
              ${isHoliday ? `<span class="pill p-quiet">${icon('calendar', 13)} عطلة</span>` : `<b class="num" style="font-size:20px;color:var(--${gc}-ink)">${gx.rate}%</b>`}
            </div>
            ${isHoliday ? '' : `<div class="bar" style="flex:none"><i style="width:${gx.rate}%;background:var(--${gc})"></i></div>`}
            <div class="secs">${secs.map((s, si) => { const ss = db.students(s.id); const n = ss.length; const y = db.summary(ss, att.day); const pct = n ? Math.round(y.came / n * 100) : 0; return `<button type="button" class="sec sc c${si % 6}" data-open-sec="${s.id}" title="فتح حضور ${esc(g.name)} شعبة ${esc(s.name)}"><span class="sl">${esc(shortSecIcon(s, g))}</span><span class="sb"><span class="sn">الكل <em>${n}</em></span><span class="sp">${isHoliday ? 'عطلة رسمية' : `حاضر <em>${y.came}</em>`}</span><span class="sm"><i style="width:${isHoliday ? 0 : pct}%"></i></span></span></button>`; }).join('')}</div>
          </div>`;
        }).join('')}</div>`).join('') : (!matchedStudents.length ? `<div class="empty">لا توجد نتائج مطابقة لبحثك (لا طلاب ولا شعب)</div>` : '')}
      `;

      $('#day', container).onchange = e => { att.day = +e.target.value; this.update(el); };
      $('#app-q', container).oninput = e => { att.appQ = e.target.value; this.update(el); const i = $('#app-q', el); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } };
      return;
    }

    // 2. SINGLE SECTION ATTENDANCE APP (When a section is opened)
    const allGrades = db.grades();
    const currentSec = db.section(att.sec);
    const gradeIdx = allGrades ? allGrades.findIndex(g => g.id === currentSec?.gradeId) : 0;
    const appColor = GRADE_APP_COLORS[(gradeIdx >= 0 ? gradeIdx : 0) % GRADE_APP_COLORS.length];

    let list = db.students(att.sec);
    const rows = list.map(s => ({ s, x: db.statusOf(s.id, att.day) }));
    const counts = { all: rows.length };
    rows.forEach(r => {
      counts[r.x.status] = (counts[r.x.status] || 0) + 1;
      if (r.x.late) counts.late = (counts.late || 0) + (r.x.status === 'left' ? 1 : 0);
      if (r.x.exempt) counts.exempt = (counts.exempt || 0) + 1;
    });

    if (isHoliday && att.f !== 'all' && att.f !== 'holiday') {
      att.f = 'all';
    }

    const F = isHoliday ? [
      ['all', 'الكل'],
      ['holiday', `عطلة رسمية (${counts.holiday || rows.length})`]
    ] : [
      ['all', 'الكل'],
      ['present', 'حاضر'],
      ['late', 'متأخر'],
      ['absent', 'غائب'],
      ['excused', 'بعذر'],
      ['left', 'انصرف'],
      ...(counts.exempt ? [['exempt', 'مستثنى (حالة خاصة)']] : []),
      ...(isToday ? [['pending', 'لم يصل']] : [])
    ];

    const q = (att.q || '').trim();
    const nq = norm(q);
    const shown = rows.filter(r => {
      const matchFilter = att.f === 'all'
        ? true
        : att.f === 'exempt'
          ? r.x.exempt
          : (r.x.status === att.f || (att.f === 'late' && r.x.late));
      return matchFilter && (!nq || norm(r.s.name).includes(nq) || String(r.s.no || '').includes(q));
    });

    const tableNotice = isHoliday ? `
    <div style="background:linear-gradient(90deg, #EEF2FF 0%, #E0E7FF 100%);border:1px solid #C7D2FE;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px">
      <span style="font-size:24px;flex:none">${holInfo?.badge || '🏖️'}</span>
      <div style="flex:1">
        <div style="font-weight:700;color:#3730A3;font-size:14px">
          إشعار الحضور: اليوم عطلة رسمية معتمدة (${esc(holInfo?.name || 'عطلة رسمية')})
        </div>
        <div style="font-size:12px;color:#4338CA;margin-top:2px">
          طلاب شعبة (${esc(currentSec?.name || '')}) في حالة إعفاء رسمي معتمد من البصمة والدوام · يستمر هذا الإشعار والإعفاء سارياً طوال اليوم وحتى نهايته.
        </div>
      </div>
      <span class="pill" style="background:#4338CA;color:#fff;font-size:11px;font-weight:700;flex:none">ساري طوال اليوم حتى 23:59</span>
    </div>` : '';

    container.innerHTML = `
    <div class="card ap-head">
      <div class="ap-hl">
        <button type="button" class="btn ap-back" id="btn-back-to-apps">${icon('arrow', 16)} كل الشعب</button>
        <span class="ap-ico lg">${icon('grade', 20)}<b>${esc(db.grade(currentSec?.gradeId)?.short || shortSecIcon(currentSec))}</b></span>
        <div style="min-width:0">
          <h2>${esc(db.sectionLabel(currentSec?.id))}</h2>
          <div class="ap-meta">
            ${currentSec?.homeroom ? `<span class="ap-chip">مشرف الشعبة: <b>${esc(currentSec.homeroom)}</b></span>` : ''}
            ${currentSec?.room ? `<span class="ap-chip">القاعة: <b>${esc(currentSec.room)}</b></span>` : ''}
            <span class="ap-chip">الطلاب: <b>${list.length}</b></span>
          </div>
        </div>
      </div>
      <label class="field" style="margin-bottom:0;min-width:180px">اليوم
        <select class="input" id="sec-day">
          ${db.days().map((d, i) => `<option value="${d}" ${d === att.day ? 'selected' : ''}>${i === 0 ? 'اليوم · ' : ''}${fmtDay(new Date(d))}</option>`).join('')}
        </select>
      </label>
    </div>

    <div class="ap-tools">
      <label class="field">بحث في طلاب الشعبة
        <input class="input" id="aq" value="${esc(att.q)}" placeholder="اكتب اسم الطالب">
      </label>
    </div>

    <div class="seg" id="fseg" role="group" aria-label="تصفية حسب الحالة" style="margin-bottom:12px">
      ${F.map(([k, l]) => `<button data-f="${k}" aria-pressed="${att.f === k}">${l} <span class="num">${counts[k] || 0}</span></button>`).join('')}
    </div>

    <!-- Students Table for THIS SECTION ONLY -->
    <div class="card tablewrap" id="tbl">
      ${tableNotice}
      ${shown.length ? `
        <table>
          <thead>
            <tr>
              <th>الطالب</th>
              <th>الشعبة</th>
              <th>الوصول</th>
              <th>الانصراف</th>
              <th>الطريقة</th>
              <th>الحالة</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody>
            ${shown.map(({ s, x }) => {
              const isH = x.status === 'holiday';
              return `<tr>
                <td><a href="#/student/${s.id}" style="color:inherit;display:flex;gap:10px;align-items:center;text-decoration:none">${avatar(s.name, x.status, db.photoOf(s.id))}<b>${esc(s.name)}</b></a></td>
                <td class="muted">${esc(db.sectionShort(s.sectionId))}</td>
                <td class="num">${x.inEv ? `<button class="evlink" data-ev="${x.inEv.id}" title="إثبات الوصول">${fmtTime(x.inEv.ts)} ${icon('eye', 13)}</button>` : (isH ? '<span class="muted small">—</span>' : x.exempt ? '<span class="muted small">مستثنى رسمياً</span>' : '—')}</td>
                <td class="num">${x.outEv ? `<button class="evlink" data-ev="${x.outEv.id}" title="إثبات الانصراف">${fmtTime(x.outEv.ts)} ${icon('eye', 13)}</button>` : (isH ? '<span class="muted small">—</span>' : '—')}</td>
                <td class="muted small">${isH ? '<span style="color:#4338CA;font-weight:600">عطلة معفاة رسمياً</span>' : x.inEv ? esc(x.inEv.method) : x.excuse ? esc(x.excuse.reason) : (x.exempt ? `<span title="${esc(x.exemption?.reason || '')}">حالة خاصة 🛡️</span>` : '—')}</td>
                <td>${isH ? '<span class="pill" style="background:#E0E7FF;color:#3730A3;border:1px solid #C7D2FE">عطلة رسمية 🏖️</span>' : pill(x.status)}${x.status === 'left' && x.late ? ' ' + pill('late') : ''}${x.exempt && !isH ? ` <span class="pill" style="background:#F3E8FF;color:#6B21A8;border:1px solid #D8B4FE" title="مستثنى بقرار: ${esc(x.exemption?.reason || '')}">مستثنى 🛡️</span>` : ''}</td>
                <td style="white-space:nowrap">${!isH && isToday && can('att') && (x.status === 'pending' || x.status === 'absent') ? `<button class="btn sm" data-mark="${s.id}">حضور يدوي</button> <button class="btn sm" data-excuse="${s.id}">عذر</button>` : ''}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      ` : `<div class="empty">لا يوجد طلاب بهذه الحالة في شعبة (${esc(currentSec?.name || '')})</div>`}
    </div>`;

    $('#sec-day', container).onchange = e => { att.day = +e.target.value; this.update(el); };
    $('#aq', container).oninput = e => { att.q = e.target.value; this.update(el); };
  }
};

function holBannerHtml(holInfo, isHoliday, canManage, day) {
  const allHols = db.holidays();
  if (!isHoliday && !holInfo) {
    if (canManage && allHols.length > 0) {
      const nearest = allHols.find(h => h.day >= day) || allHols[0];
      return `
      <div class="card" style="background:var(--surface-200);border:1px solid var(--border);border-radius:12px;padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:24px;width:40px;height:40px;background:var(--surface-300);border-radius:10px;display:flex;align-items:center;justify-content:center">${nearest.badge || '🏛️'}</span>
          <div>
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-weight:700;color:var(--ink)">عطلة مسجلة في المستودع: ${esc(nearest.name)}</span>
              ${nearest.status === 'draft' ? `<span class="pill" style="background:#FDE68A;color:#92400E;font-size:11px;font-weight:700">مسودة</span>` : `<span class="pill" style="background:#DCFCE7;color:#166534;font-size:11px;font-weight:700">منشورة</span>`}
            </div>
            <div class="muted small">${nearest.day} · ${esc(nearest.category || 'عطلة')} ${nearest.orderNo ? `· ${esc(nearest.orderNo)}` : ''}</div>
          </div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          ${nearest.status === 'draft' ? `<button type="button" class="btn sm pr" data-publish-hol="${nearest.day}">${icon('send', 13)} نشر للكل</button>` : ''}
          <button type="button" class="btn sm" data-edit-hol="${nearest.day}" style="font-weight:700;border-color:var(--brand);color:var(--brand)">${icon('edit', 13)} تعديل العطلة والشعار</button>
          <button type="button" class="btn sm danger" data-del-hol="${nearest.day}" style="font-weight:700">${icon('trash', 13)} حذف العطلة</button>
        </div>
      </div>`;
    }
    return '';
  }
  if (holInfo) {
    const isDraft = holInfo.status === 'draft';
    return `
    <div class="card" style="background:${isDraft ? '#FFFBEB' : 'linear-gradient(135deg, #FEF3C7 0%, #FFFBEB 100%)'};border:${isDraft ? '2px dashed #F59E0B' : '1px solid #FCD34D'};display:flex;gap:14px;align-items:center;margin-bottom:12px;border-radius:12px;padding:12px 16px;flex-wrap:wrap">
      <span style="font-size:26px;width:48px;height:48px;background:${isDraft ? '#FDE68A' : '#F59E0B'};color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 6px rgba(0,0,0,0.06)">
        ${holInfo.badge || '🏛️'}
      </span>
      <div style="flex:1;min-width:240px">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span style="font-size:16px;font-weight:700;color:#92400E">${esc(holInfo.name)}</span>
          ${isDraft ? `
            <span class="pill" style="background:#FDE68A;color:#92400E;border:1px solid #F59E0B;font-weight:700">مسودة في المستودع (غير منشورة)</span>
          ` : `
            <span class="pill" style="background:#DCFCE7;color:#166534;border:1px solid #86EFAC;font-weight:700">منشورة ومعتمدة للطلاب والمدرسين ✓</span>
            <span class="pill" style="background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;font-weight:700">🕒 سارية طوال اليوم حتى 23:59</span>
          `}
        </div>
        <div style="font-size:13px;color:#B45309;margin-top:2px">
          ${isDraft ? `
            هذه العطلة محفوظة في المستودع كمسودة. انقر <b>"نشر للطلاب والمدرسين والكل"</b> لتعميمها رسمياً وإعفاء الجميع من البصمة.
          ` : `
            تم إعفاء جميع الطلاب والملاك التدريسي من البصمة لهذا اليوم (${fmtDay(new Date(day))}) طوال اليوم وحتى نهايته (11:59 ليلاً)، ولا يُحسب أي غياب أو تأخير.
          `}
          ${holInfo.orderNo ? ` · رقم القرار: <b>${esc(holInfo.orderNo)}</b>` : ''}
          ${holInfo.by ? ` · بواسطة: <b>${esc(holInfo.by)}</b>` : ''}
        </div>
      </div>
      ${canManage ? `
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          ${isDraft ? `
            <button type="button" class="btn pr" data-publish-hol="${holInfo.day}" style="background:#16A34A;border-color:#16A34A;color:#fff">${icon('send', 15)} نشر للطلاب والمدرسين والكل</button>
          ` : `
            <button type="button" class="btn sm" data-publish-hol="${holInfo.day}" title="إعادة إرسال تبليغ رسمي للطلاب والمدرسين">${icon('bell', 14)} إعادة نشر / تبليغ</button>
          `}
          <button type="button" class="btn sm" data-edit-hol="${holInfo.day}">${icon('edit', 14)} تعديل العطلة والشعار</button>
          <button type="button" class="btn sm danger" data-del-hol="${holInfo.day}">${icon('trash', 14)} حذف العطلة</button>
        </div>
      ` : ''}
    </div>`;
  }
  return `
  <div class="card" style="background:#F1F5F9;border:1px solid #CBD5E1;display:flex;gap:14px;align-items:center;margin-bottom:12px;border-radius:12px;padding:12px 16px">
    <span style="font-size:24px;width:44px;height:44px;background:#64748B;color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none">🏖️</span>
    <div style="flex:1">
      <div style="font-size:16px;font-weight:700;color:#334155">عطلة نهاية الأسبوع الرسمية</div>
      <div style="font-size:13px;color:#64748B">يوم عطلة أسبوعية دورية (${fmtDay(new Date(day))})، البصمة لا تُحسب تلقائياً.</div>
    </div>
  </div>`;
}

function officialHolidayModal(defaultDay, editDay = null, onDone = null) {
  if (typeof editDay === 'function') {
    onDone = editDay;
    editDay = null;
  }
  document.querySelectorAll('.scrim').forEach(s => s.remove());
  const curDay = typeof defaultDay === 'string' ? defaultDay : (defaultDay ? dayKey(new Date(defaultDay)) : dayKey(new Date(db.now())));
  const targetHol = editDay ? db.getHoliday(editDay) : null;
  const allHols = db.holidays();
  const dStr = targetHol ? targetHol.day : curDay;
  const isEditing = !!targetHol;
  let selectedBadge = targetHol?.badge || '🏛️';

  const badges = [
    { id: '🏛️', label: 'عطلة رسمية عامة' },
    { id: '🌧️', label: 'أمطار وسوء طقس' },
    { id: '⚠️', label: 'عطلة طارئة' },
    { id: '🏖️', label: 'مناسبة خاصة' },
    { id: '🗳️', label: 'مراكز اقتراع' },
    { id: '🎓', label: 'عطلة امتحانات' }
  ];

  modal(isEditing ? 'تعديل العطلة الرسمية وشعارها' : 'إعلان عطلة رسمية / طارئة (إعفاء من البصمة)', `
  <form id="holf" style="display:flex;flex-direction:column;gap:12px" novalidate>
    <div style="background:var(--surface-200);padding:10px 14px;border-radius:10px">
      <div style="font-weight:700;color:var(--ink)">
        ${isEditing ? `تعديل العطلة الخاصة بيوم (${dStr})` : 'إعفاء عام وشامل من البصمة للطلاب والمدرسين'}
      </div>
      <div class="muted small" style="margin-top:2px">
        يمكنك حفظ العطلة كمسودة في المستودع أولاً، أو نشرها فورياً لإشعار كافة الطلاب والكوادر وإعفائهم من الحضور.
      </div>
    </div>

    <div>
      <label class="field" style="margin-bottom:0">شعار / أيقونة العطلة</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px" id="badge-selector">
        ${badges.map(b => `
          <button type="button" class="btn sm badge-btn" data-badge="${b.id}" style="display:flex;align-items:center;gap:6px;min-height:36px;border-radius:10px;${b.id === selectedBadge ? 'background:var(--brand);color:#fff;border-color:var(--brand)' : ''}">
            <span style="font-size:18px">${b.id}</span>
            <span>${b.label}</span>
          </button>
        `).join('')}
      </div>
      <input type="hidden" name="badge" id="hol-badge-input" value="${selectedBadge}">
    </div>

    ${!isEditing ? `
    <div class="grid g2" style="gap:10px">
      <label class="field">نطاق مدة العطلة
        <select class="input" id="hol-range-mode" name="rangeMode">
          <option value="single">يوم واحد فقط</option>
          <option value="range">فترة محددة (عدة أيام)</option>
        </select>
      </label>

      <label class="field">تصنيف العطلة
        <select class="input" name="category" id="hol-cat">
          <option value="عطلة رسمية عامة">عطلة رسمية عامة (وطنية / دينية)</option>
          <option value="عطلة طارئة لسوء الأحوال الجوية">عطلة طارئة لسوء الأحوال الجوية (أمطار / سيول / غبار)</option>
          <option value="عطلة بقرار مجلس الوزراء">عطلة بقرار مجلس الوزراء / الأمانة العامة</option>
          <option value="عطلة محلية بقرار المحافظة">عطلة محلية بقرار المحافظة أو مديرية التربية</option>
          <option value="عطلة انتخابية أو مناسبة خاصة">عطلة انتخابية أو مناسبة خاصة</option>
          <option value="أخرى">سبب آخر</option>
        </select>
      </label>
    </div>` : `
    <div class="grid g2" style="gap:10px">
      <label class="field">تاريخ العطلة
        <input class="input" type="date" name="startDate" value="${dStr}" required>
      </label>
      <label class="field">تصنيف العطلة
        <select class="input" name="category" id="hol-cat">
          <option value="عطلة رسمية عامة" ${targetHol?.category === 'عطلة رسمية عامة' ? 'selected' : ''}>عطلة رسمية عامة (وطنية / دينية)</option>
          <option value="عطلة طارئة لسوء الأحوال الجوية" ${targetHol?.category === 'عطلة طارئة لسوء الأحوال الجوية' ? 'selected' : ''}>عطلة طارئة لسوء الأحوال الجوية (أمطار / سيول / غبار)</option>
          <option value="عطلة بقرار مجلس الوزراء" ${targetHol?.category === 'عطلة بقرار مجلس الوزراء' ? 'selected' : ''}>عطلة بقرار مجلس الوزراء / الأمانة العامة</option>
          <option value="عطلة محلية بقرار المحافظة" ${targetHol?.category === 'عطلة محلية بقرار المحافظة' ? 'selected' : ''}>عطلة محلية بقرار المحافظة أو مديرية التربية</option>
          <option value="عطلة انتخابية أو مناسبة خاصة" ${targetHol?.category === 'عطلة انتخابية أو مناسبة خاصة' ? 'selected' : ''}>عطلة انتخابية أو مناسبة خاصة</option>
          <option value="أخرى" ${targetHol?.category === 'أخرى' ? 'selected' : ''}>سبب آخر</option>
        </select>
      </label>
    </div>`}

    ${!isEditing ? `
    <div class="grid g2" style="gap:10px">
      <label class="field" id="box-start-date">تاريخ العطلة
        <input class="input" type="date" name="startDate" value="${dStr}" required>
      </label>
      <label class="field" id="box-end-date" style="display:none">إلى تاريخ (نهاية العطلة)
        <input class="input" type="date" name="endDate" value="${dStr}">
      </label>
    </div>` : ''}

    <label class="field">مسمى وعنوان العطلة
      <input class="input" name="name" id="hol-name" placeholder="مثال: عطلة طارئة لسوء الأحوال الجوية وهطول الأمطار" value="${esc(targetHol?.name || 'عطلة رسمية')}" required>
    </label>

    <div class="grid g2" style="gap:10px">
      <label class="field">رقم الأمر / القرار الرسمي (اختياري)
        <input class="input" name="orderNo" placeholder="مثال: قرار وزاري رقم 418" value="${esc(targetHol?.orderNo || '')}">
      </label>
      <label class="field">ملاحظات إضافية (اختياري)
        <input class="input" name="notes" placeholder="ملاحظات للإدارة وأولياء الأمور" value="${esc(targetHol?.notes || '')}">
      </label>
    </div>

    <div style="background:var(--surface-200);padding:12px;border-radius:10px">
      <span style="font-size:13px;font-weight:700;color:var(--ink)">حالة النشر والمستودع:</span>
      <div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="radio" name="status" value="published" ${(!targetHol || targetHol.status !== 'draft') ? 'checked' : ''}>
          <span style="font-weight:700;color:#166534">📢 نشر للطلاب والمدرسين والكل</span>
        </label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="radio" name="status" value="draft" ${(targetHol?.status === 'draft') ? 'checked' : ''}>
          <span style="font-weight:600;color:#92400E">📦 حفظ كمسودة في المستودع (دون تعميم الآن)</span>
        </label>
      </div>
    </div>

    <div style="background:var(--surface-200);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:6px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span style="font-weight:700;color:var(--ink);font-size:14px">📂 مستودع وسجل كافة العطلات المعلنة (${allHols.length})</span>
        <span class="muted small">أزرار التعديل والحذف والنشر</span>
      </div>
      <div style="max-height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:6px" id="hol-list-box">
        ${allHols.length ? allHols.map(h => {
          const isD = h.status === 'draft';
          return `
          <div class="row" style="background:var(--surface-100);padding:8px 12px;border-radius:8px;gap:8px;align-items:center;border:1px solid var(--border)">
            <span style="font-size:22px;flex:none">${h.badge || '🏛️'}</span>
            <div style="flex:1">
              <div style="display:flex;gap:6px;align-items:center">
                <b>${esc(h.name)}</b>
                ${isD ? `<span class="pill" style="background:#FDE68A;color:#92400E;font-size:11px;font-weight:700">مسودة</span>` : `<span class="pill" style="background:#DCFCE7;color:#166534;font-size:11px;font-weight:700">منشورة</span>`}
              </div>
              <div class="muted small">${h.day} · ${esc(h.category || 'عطلة')} ${h.orderNo ? `· ${esc(h.orderNo)}` : ''}</div>
            </div>
            ${isD ? `<button type="button" class="btn sm pr" data-pop-pub-hol="${h.day}" title="نشر للجميع">${icon('send', 13)} نشر</button>` : ''}
            <button type="button" class="btn sm" data-pop-edit-hol="${h.day}" style="font-weight:700;border-color:var(--brand);color:var(--brand)">${icon('edit', 13)} تعديل</button>
            <button type="button" class="btn sm danger" data-pop-del-hol="${h.day}" style="font-weight:700">${icon('trash', 13)} حذف</button>
          </div>
        `}).join('') : '<div class="muted small" style="text-align:center;padding:10px 0">لا توجد عطلات مسجلة في المستودع حالياً. بمجرد إضافة عطلة من النموذج أعلاه، ستظهر هنا فوراً مع أزرار [تعديل] و [حذف] و [نشر].</div>'}
      </div>
    </div>

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;align-items:center;flex-wrap:wrap">
      ${isEditing ? `<button type="button" class="btn danger" id="btn-modal-del-active" style="margin-inline-end:auto">${icon('trash', 15)} حذف هذه العطلة</button>` : ''}
      <button type="button" class="btn" data-close>إلغاء</button>
      <button class="btn pr" style="min-height:44px">${icon('save', 16)} ${isEditing ? 'حفظ التعديلات' : 'حفظ / نشر العطلة'}</button>
    </div>
  </form>`, (m, close) => {
    const rangeMode = $('#hol-range-mode', m);
    const startBox = $('#box-start-date', m);
    const endBox = $('#box-end-date', m);
    const catSel = $('#hol-cat', m);
    const nameInput = $('#hol-name', m);
    const badgeInput = $('#hol-badge-input', m);

    $$('.badge-btn', m).forEach(b => {
      b.onclick = () => {
        $$('.badge-btn', m).forEach(x => {
          x.style.background = '';
          x.style.color = '';
          x.style.borderColor = '';
        });
        b.style.background = 'var(--brand)';
        b.style.color = '#fff';
        b.style.borderColor = 'var(--brand)';
        badgeInput.value = b.dataset.badge;
      };
    });

    if (catSel) {
      catSel.onchange = () => {
        if (!nameInput.value || nameInput.value === 'عطلة رسمية' || nameInput.value.startsWith('عطلة')) {
          if (catSel.value === 'عطلة طارئة لسوء الأحوال الجوية') {
            nameInput.value = 'عطلة طارئة لسوء الأحوال الجوية وهطول الأمطار';
            const bRain = $('[data-badge="🌧️"]', m);
            bRain?.click();
          } else if (catSel.value === 'عطلة بقرار مجلس الوزراء') {
            nameInput.value = 'عطلة رسمية بقرار الأمانة العامة لمجلس الوزراء';
            const bGov = $('[data-badge="🏛️"]', m);
            bGov?.click();
          } else if (catSel.value === 'عطلة محلية بقرار المحافظة') {
            nameInput.value = 'عطلة رسمية بقرار ديوان المحافظة';
            const bGov = $('[data-badge="🏛️"]', m);
            bGov?.click();
          } else if (catSel.value === 'عطلة انتخابية أو مناسبة خاصة') {
            nameInput.value = 'عطلة رسمية للمراكز الانتخابية';
            const bElec = $('[data-badge="🗳️"]', m);
            bElec?.click();
          }
        }
      };
    }

    if (rangeMode) {
      rangeMode.onchange = () => {
        const isRange = rangeMode.value === 'range';
        if (startBox) startBox.childNodes[0].nodeValue = isRange ? 'من تاريخ (بداية العطلة)' : 'تاريخ العطلة';
        if (endBox) endBox.style.display = isRange ? '' : 'none';
      };
    }

    m.addEventListener('click', e => {
      const pubBtn = e.target.closest('[data-pop-pub-hol]');
      if (pubBtn) {
        const d = pubBtn.dataset.popPubHol;
        db.publishHoliday(d, ctx().name);
        toast('تم نشر العطلة رسمياً وإشعار الطلاب والمدرسين 📢', d);
        close();
        onDone?.();
        return;
      }
      const editBtn = e.target.closest('[data-pop-edit-hol]');
      if (editBtn) {
        const d = editBtn.dataset.popEditHol;
        close();
        officialHolidayModal(d, d, onDone);
        return;
      }
      const delBtn = e.target.closest('[data-pop-del-hol]');
      if (delBtn) {
        const d = delBtn.dataset.popDelHol;
        if (confirm('هل أنت متأكد من حذف وإلغاء هذه العطلة؟')) {
          db.removeHoliday(d, ctx().name);
          toast('تم حذف العطلة واستئناف الدوام', d);
          delBtn.closest('.row')?.remove();
          onDone?.();
        }
        return;
      }
      const delActive = e.target.closest('#btn-modal-del-active');
      if (delActive && isEditing) {
        if (confirm(`هل أنت متأكد من حذف وإلغاء عطلة يوم (${targetHol.day})؟`)) {
          db.removeHoliday(targetHol.day, ctx().name);
          toast('تم حذف العطلة واستئناف الدوام', targetHol.day);
          close();
          onDone?.();
        }
        return;
      }
    });

    $('#holf', m).onsubmit = e => {
      e.preventDefault();
      const form = e.target;
      const isRange = rangeMode && rangeMode.value === 'range';
      const startDate = form.startDate.value;
      const endDate = isRange ? form.endDate.value : startDate;
      const name = form.name.value.trim() || 'عطلة رسمية';
      const category = form.category.value;
      const orderNo = form.orderNo.value.trim();
      const notes = form.notes.value.trim();
      const badge = badgeInput.value || '🏛️';
      const status = form.status.value || 'published';

      if (!startDate) return toast('يرجى تحديد تاريخ العطلة', '', 'absent');

      let r;
      if (isEditing) {
        r = db.editHoliday(targetHol.day, {
          startDate,
          endDate,
          name,
          category,
          orderNo,
          notes,
          badge,
          status
        }, ctx().name);
      } else {
        r = db.addHolidayRange({
          startDate,
          endDate,
          name,
          category,
          orderNo,
          notes,
          badge,
          status
        }, ctx().name);
      }

      if (r.ok) {
        if (status === 'draft') {
          toast('تم حفظ العطلة كمسودة في المستودع بنجاح 📦', name);
        } else {
          toast('تم نشر العطلة بنجاح وإشعار الطلاب والمدرسين 📢', name);
        }
        close();
        onDone?.();
      } else {
        toast('خطأ في التاريخ', r.error, 'absent');
      }
    };
  });
}

function excuseModal(s, onDone) {
  let reason = 'مريض';
  modal(`تبرير غياب: ${s.name}`, `
    <div class="seg" role="group" aria-label="السبب">${['مريض', 'ظرف عائلي', 'سفر', 'سبب آخر'].map(r => `<button data-r="${r}" aria-pressed="${r === reason}">${r}</button>`).join('')}</div>
    <label class="field">ملاحظة (اختياري)<textarea class="input" id="note" rows="3" style="padding:10px;min-height:80px"></textarea></label>
    <div class="muted small">يُسجَّل في المنصة تلقائياً ويصل لمشرف الشعبة.</div>
    <button class="btn pr" id="send">إرسال التبرير</button>`, (m, close) => {
    m.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) { reason = b.dataset.r; $$('[data-r]', m).forEach(x => x.setAttribute('aria-pressed', x === b)); } });
    $('#send', m).onclick = () => { db.addExcuse(s.id, reason, $('#note', m).value.trim(), ctx().name); close(); toast('أُرسل التبرير', `${s.name} · ${reason}`); onDone?.(); };
  });
}

/* ============ STUDENTS ============ */
const stu = { q: '', sec: '' };
const students = {
  render(el) {
    const sc = scope(); const c = ctx();
    const secs = sc.sections ? db.sections().filter(s => sc.sections.includes(s.id)) : db.sections();
    el.innerHTML = topbar(c.role === 'teacher' ? 'طلابي' : 'الطلاب', sub(), ['owner', 'admin'].includes(c.role) ? `<button class="btn" id="impbtn">${icon('upload', 18)}استيراد من ملف</button><button class="btn pr" id="add">${icon('plus', 18)}إضافة طالب</button>` : '') + `
    <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <label class="field" style="flex:1;min-width:200px">بحث<input class="input" id="sq" value="${esc(stu.q)}" placeholder="الاسم أو رقم الطالب"></label>
      <label class="field" style="min-width:200px">الشعبة<select class="input" id="ss"><option value="">الكل</option>${secs.map(s => `<option value="${s.id}" ${s.id === stu.sec ? 'selected' : ''}>${esc(db.sectionLabel(s.id))}</option>`).join('')}</select></label>
    </div><div class="card tablewrap" id="list"></div>`;
    $('#sq', el).oninput = e => { stu.q = e.target.value; this.update(el); };

// Face capture with the device camera. The frame is grabbed at the green level and saved as a small JPEG;
// the first one becomes the student's reference photo.
function faceModal(s) {
  const c = ctx(); const by = `${c.name}${db.credOf(c.phone)?.username ? ' · ' + db.credOf(c.phone).username : ''}`;
  modal(db.photoOf(s.id) ? 'تحديث صورة الوجه' : 'صورة بصمة الوجه', `
    <div id="cam" style="height:280px;border-radius:16px;background:#0f172a;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">
      <video id="vid" playsinline muted autoplay style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none;z-index:1"></video>
      <svg width="190" height="230" viewBox="0 0 230 280" aria-hidden="true" style="position:relative;z-index:2;pointer-events:none"><ellipse cx="115" cy="130" rx="82" ry="108" fill="none" stroke="#34C3AE" stroke-width="4" stroke-dasharray="10 8"/></svg>
      <span class="pill" id="fq" style="position:absolute;top:12px;right:12px;background:var(--red);color:var(--on-red);z-index:3">جاري الفتح…</span>
      <select id="camsel" style="position:absolute;top:12px;left:12px;z-index:3;max-width:140px;background:rgba(15,23,42,0.85);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:8px;font-size:11px;padding:3px 6px;display:none"></select>
      <span id="camnote" class="small" style="position:absolute;bottom:10px;inset-inline:10px;text-align:center;color:#DDE3F5;z-index:3">جاري فتح الكاميرا…</span></div>
    <div id="blackwarn" class="card small" style="display:none;background:var(--amber-soft);border-color:#F2D29A;padding:8px 12px;margin-top:6px;color:#8A5A0B">
      <b>الشاشة سوداء؟</b> تأكد من فتح غطاء الكاميرا (الستارة الصغيرة فوق الشاشة)، أو أغلق البرامج الأخرى (مثل Zoom أو Teams) أو اختر الكاميرا الأخرى من القائمة بالأعلى.
    </div>
    <div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px"><span>وضوح الوجه</span><span id="fqt">جاري ضبط الكاميرا…</span></div>
      <div style="display:flex;gap:4px;height:14px;margin-top:8px" id="meter"><i style="flex:1;border-radius:0 7px 7px 0;background:var(--surface-300)"></i><i style="flex:1;background:var(--surface-300)"></i><i style="flex:1;border-radius:7px 0 0 7px;background:var(--surface-300)"></i></div>
      <div style="display:flex;font-size:12px;font-weight:700;text-align:center;margin-top:4px"><span style="flex:1;color:var(--red-ink)">غير واضح</span><span style="flex:1;color:var(--amber-ink)">اقترب قليلاً</span><span style="flex:1;color:var(--teal-ink)">واضح</span></div></div>
    ${db.photoOf(s.id) ? '<div class="small muted">الصورة الأولى تبقى محفوظة مثل ما هي. هذي تنضاف كتحديث.</div>' : '<div class="small muted">هذي الصورة تصير الصورة المرجعية للطالب، وتظهر للإدارة حتى تقارن بيها.</div>'}
    <button class="btn pr" id="cap" disabled>التقاط الصورة</button>`, (m, close) => {
    const bars = $$('#meter i', m); const colors = ['var(--red)', 'var(--amber)', 'var(--teal)']; const txt = ['اقترب من الكاميرا', 'اقترب قليلاً', 'واضح · جاهز للالتقاط'];
    const vid = $('#vid', m); let stream = null, lvl = -1, iv = null;
    const stop = () => { clearInterval(iv); stream?.getTracks().forEach(t => t.stop()); };
    const watch = setInterval(() => { if (!document.body.contains(m)) { stop(); clearInterval(watch); } }, 500);

    const checkBrightness = () => {
      if (!stream || !vid.videoWidth) return 0;
      try {
        const cv = document.createElement('canvas'); cv.width = 32; cv.height = 32;
        const ctx = cv.getContext('2d');
        ctx.drawImage(vid, 0, 0, 32, 32);
        const data = ctx.getImageData(0, 0, 32, 32).data;
        let sum = 0;
        for (let i = 0; i < data.length; i += 4) sum += data[i] + data[i + 1] + data[i + 2];
        return sum / (32 * 32 * 3);
      } catch { return 50; }
    };

    let prevFrame = null;
    let liveFrames = 0;

    const sampleFrame = () => {
      if (!vid.videoWidth) return null;
      try {
        const scv = document.createElement('canvas'); scv.width = 48; scv.height = 48;
        const sctx = scv.getContext('2d');
        sctx.drawImage(vid, 0, 0, 48, 48);
        return sctx.getImageData(0, 0, 48, 48).data;
      } catch { return null; }
    };

    const getFrameDiff = (f1, f2) => {
      if (!f1 || !f2 || f1.length !== f2.length) return 0;
      let diff = 0;
      for (let i = 0; i < f1.length; i += 4) {
        diff += Math.abs(f1[i] - f2[i]) + Math.abs(f1[i + 1] - f2[i + 1]) + Math.abs(f1[i + 2] - f2[i + 2]);
      }
      return diff / (48 * 48 * 3);
    };

    const step = () => {
      const b = checkBrightness();
      const warn = $('#blackwarn', m);
      if (b < 8 && vid.videoWidth > 0) {
        if (warn) warn.style.display = 'block';
        $('#fqt', m).textContent = 'الكاميرا مغطاة أو معتمة';
        const fq = $('#fq', m); fq.textContent = 'شاشة سوداء'; fq.style.background = 'var(--red)';
        bars.forEach(bar => bar.style.background = 'var(--surface-300)');
        $('#cap', m).disabled = true;
        return;
      }
      if (warn) warn.style.display = 'none';

      // Liveness Detection: verify human micro-movements to reject motionless / paper photos
      const currFrame = sampleFrame();
      const delta = getFrameDiff(currFrame, prevFrame);
      prevFrame = currFrame;

      const fq = $('#fq', m);
      const capBtn = $('#cap', m);

      // Living human natural micro-movements: delta between 1.4 and 45
      // Static image / printed paper / frozen phone screen: delta < 1.0
      if (delta >= 1.4 && delta <= 45) {
        liveFrames = Math.min(3, liveFrames + 1);
      } else if (delta < 0.9 && vid.videoWidth > 0) {
        liveFrames = Math.max(0, liveFrames - 1);
      }

      if (liveFrames >= 2) {
        fq.textContent = 'شخص حي ومباشر ✓';
        fq.style.background = 'var(--teal)';
        $('#fqt', m).textContent = 'حيوية مؤكدة · جاهز لالتقاط بصمة الوجه';
        bars.forEach(bar => bar.style.background = 'var(--teal)');
        capBtn.disabled = false;
        capBtn.textContent = 'التقاط الصورة الحية (دقة عالية)';
      } else {
        if (delta < 0.9 && vid.videoWidth > 0) {
          fq.textContent = 'مرفوض: صورة صامتة!';
          fq.style.background = 'var(--red)';
          $('#fqt', m).textContent = 'يجب وجود الشخص حياً أمام الكاميرا (ممنوع الصور الثابتة)';
        } else {
          fq.textContent = 'فحص الحيوية…';
          fq.style.background = 'var(--amber)';
          $('#fqt', m).textContent = 'تحرك أو ارمش بعينك لتأكيد أنك شخص حي ومباشر';
        }
        bars.forEach((bar, i) => bar.style.background = i === 0 ? 'var(--amber)' : 'var(--surface-300)');
        capBtn.disabled = true;
      }
    };

    const grab = () => {
      if (!stream || !vid.videoWidth) return null;
      // High Definition Crop (600x750) with high smoothing and 0.92 quality
      const W = 600, H = 750, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
      const vw = vid.videoWidth, vh = vid.videoHeight, r = W / H; let sw = vh * r, sh = vh; if (sw > vw) { sw = vw; sh = vw / r; }
      g.translate(W, 0); g.scale(-1, 1);
      g.imageSmoothingEnabled = true;
      g.imageSmoothingQuality = 'high';
      g.drawImage(vid, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, W, H);
      return cv.toDataURL('image/jpeg', 0.92);
    };

    const save = () => { const data = grab(); stop(); db.captureFace(s.id, data, by); close(); toast(data ? 'انحفظت صورة الوجه الحية' : 'سُجّلت بصمة الوجه', data ? 'بصمة حية عالية الدقة أُرسلت للمنصة' : 'الكاميرا ما اشتغلت، فما انحفظت صورة'); };

    const startCam = async (chosenDevId) => {
      stop();
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('no camera');
        const constraints = chosenDevId ? { video: { deviceId: { exact: chosenDevId }, width: { ideal: 1920, min: 1280 }, height: { ideal: 1080, min: 720 } }, audio: false } : { video: { width: { ideal: 1920, min: 1280 }, height: { ideal: 1080, min: 720 }, facingMode: 'user' }, audio: false };
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch {
          stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 } }, audio: false });
        }
        if (!document.body.contains(m)) { stop(); return; }
        vid.srcObject = stream;
        vid.style.display = 'block';
        vid.onloadedmetadata = () => { vid.play().catch(() => { }); };
        await vid.play().catch(() => { });
        $('#camnote', m).textContent = 'خلي الوجه بالنص، بدون نظارة شمسية أو كمامة';

        // Enumerate video devices
        const devs = await navigator.mediaDevices.enumerateDevices().catch(() => []);
        const videoDevs = devs.filter(d => d.kind === 'videoinput');
        const sel = $('#camsel', m);
        if (videoDevs.length > 1 && sel) {
          sel.innerHTML = videoDevs.map((d, i) => `<option value="${d.deviceId}" ${stream?.getVideoTracks()[0]?.getSettings()?.deviceId === d.deviceId ? 'selected' : ''}>${d.label || ('كاميرا ' + (i + 1))}</option>`).join('');
          sel.style.display = 'block';
          sel.onchange = () => startCam(sel.value);
        }
        iv = setInterval(step, 800);
        step();
      } catch (err) {
        $('#camnote', m).textContent = 'الكاميرا مو متاحة. افتح المنصة بالمتصفح واسمح للكاميرا.';
      }
    };

    startCam();
    $('#cap', m).onclick = save;
  });
}

function notesList(list, fresh) {

  return list.map(n => {
    const isMark = n.kind === 'mark';
    const href = isMark ? '#/marks' : (n.kind === 'post' ? '#/posts' : '');
    const tag = href ? 'a' : 'div';
    return `<${tag} ${href ? `href="${href}"` : ''} class="row al" style="text-decoration:none;color:inherit;${(fresh ? !fresh.has(n.id ?? n.ts) : n.read) ? '' : 'background:var(--surface-300);margin:0 -10px;padding:10px'}">
      <span class="pill ${tone[n.kind]}">${label[n.kind]}</span>
      <div style="flex:1;min-width:0">
        <b>${esc(n.title)}</b>
        <div class="muted small">${esc(n.body)}</div>
      </div>
      <span class="num small muted">${ago(n.ts, db.now())}</span>
      ${n.evId ? `<button type="button" class="btn sm" data-ev="${n.evId}" style="min-height:28px;padding:0 10px;font-size:11.5px">${icon('eye', 13)}الإثبات</button>` : ''}
      ${href ? icon('back', 14) : ''}
    </${tag}>`;
  }).join('');
}


/* ============ REPORTS ============ */
const rep = { sec: '', q: '', focus: '', appQ: '' };
const CELL = { holiday: ['var(--surface-300)', 'ع'], present: ['var(--teal)', '✓'], left: ['var(--teal)', '✓'], late: ['var(--amber)', 'ت'], absent: ['var(--red)', 'غ'], excused: ['var(--amber-soft)', 'ع'], pending: ['var(--surface-300)', ''], none: ['transparent', ''] };

async function monthReportPdf(sectionId) {
  const st = db.settings();
  const r = db.monthReport(sectionId);
  const secName = db.sectionLabel(sectionId);
  const dt = new Date(db.now());
  const F = (w, z) => `${w} ${z}px Cairo, "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif`;
  const W = 1240, M = 80;
  const NAVY = '#1E2B5C', TEAL = '#0B7F70', AMBER = '#F2A93B', RED = '#C8453F', MUTED = '#5B6478', LINE = '#E3E8EF';
  const pages = [];
  let pageNo = 0;

  const tot = r.rows.reduce((a, x) => ({
    p: a.p + x.c.present,
    l: a.l + x.c.late,
    ab: a.ab + x.c.absent,
    e: a.e + x.c.excused
  }), { p: 0, l: 0, ab: 0, e: 0 });
  const allCount = tot.p + tot.l + tot.ab + tot.e;
  const overallRate = allCount ? Math.round((tot.p + tot.l) / allCount * 100) : 0;

  const header = (g, sub) => {
    pageNo++;
    g.fillStyle = NAVY;
    g.fillRect(0, 0, W, 170);
    g.fillStyle = '#fff';
    g.font = F(700, 44);
    g.fillText('تقرير الحضور الشهري والتراكمي', W - M, 90);
    g.font = F(400, 24);
    g.fillStyle = '#C9D6F0';
    g.fillText(`${st.schoolName} · ${secName} · ${r.days.length} يوم دراسي${sub ? ' · ' + sub : ''}`, W - M, 138);
    g.textAlign = 'left';
    g.font = F(700, 36);
    g.fillStyle = '#fff';
    g.fillText('منصة حاضر', M, 100);
    g.textAlign = 'right';
    g.fillStyle = AMBER;
    g.fillRect(0, 170, W, 8);
  };

  const footer = g => {
    g.fillStyle = MUTED;
    g.font = F(400, 20);
    g.textAlign = 'center';
    g.fillText(`صفحة ${pageNo} · تقرير رسمي مستخرج بتاريخ ${fmtDay(dt)} · نظام حاضر المدرسي الذكي`, W / 2, 1715);
    g.textAlign = 'right';
  };

  const table = (g, y, cols, data, rowH = 48) => {
    let x = W - M;
    g.fillStyle = '#F5F7FA';
    g.fillRect(M, y, W - 2 * M, rowH);
    g.fillStyle = NAVY;
    g.font = F(700, 21);
    cols.forEach(([l, w]) => {
      g.fillText(l, x - 12, y + rowH * .64);
      x -= w;
    });
    y += rowH;
    g.font = F(400, 21);
    data.forEach((row, i) => {
      x = W - M;
      if (i % 2) {
        g.fillStyle = '#FBFCFD';
        g.fillRect(M, y, W - 2 * M, rowH);
      }
      row.forEach((v, j) => {
        g.fillStyle = typeof v === 'object' ? v.c : NAVY;
        g.fillText(String(typeof v === 'object' ? v.t : v), x - 12, y + rowH * .64);
        x -= cols[j][1];
      });
      g.strokeStyle = LINE;
      g.lineWidth = 1.2;
      g.beginPath();
      g.moveTo(M, y + rowH);
      g.lineTo(W - M, y + rowH);
      g.stroke();
      y += rowH;
    });
    return y;
  };

  const studentData = r.rows.map((x, idx) => [
    idx + 1,
    x.s.name,
    x.s.no || '—',
    x.c.present,
    x.c.late,
    x.c.absent ? { t: x.c.absent, c: RED } : 0,
    x.c.excused,
    { t: x.rate + '%', c: x.rate >= 90 ? TEAL : x.rate >= 75 ? AMBER : RED }
  ]);

  const cols = [
    ['#', 60],
    ['اسم الطالب', 380],
    ['الرقم', 120],
    ['حضور', 110],
    ['تأخير', 110],
    ['غياب', 110],
    ['بعذر', 100],
    ['الالتزام', 90]
  ];

  const PER_FIRST = 20;
  const PER_SUB = 26;

  const firstChunk = studentData.slice(0, PER_FIRST);
  pages.push(await pdfPage(g => {
    header(g, '');
    const cards = [
      ['إجمالي الطلاب', r.rows.length, NAVY],
      ['نسبة الحضور', overallRate + '%', TEAL],
      ['مرات التأخير', tot.l, AMBER],
      ['الغياب التراكمي', tot.ab, RED],
      ['غياب مبرر', tot.e, '#7A5BB0']
    ];
    const bw = (W - 2 * M - 4 * 16) / 5;
    cards.forEach(([l, v, col], i) => {
      const x = W - M - (i + 1) * bw - i * 16;
      g.fillStyle = '#F5F7FA';
      g.fillRect(x, 210, bw, 130);
      g.fillStyle = col;
      g.fillRect(x + bw - 8, 210, 8, 130);
      g.fillStyle = MUTED;
      g.font = F(600, 20);
      g.fillText(l, x + bw - 20, 250);
      g.fillStyle = col;
      g.font = F(700, 46);
      g.fillText(String(v), x + bw - 20, 314);
    });

    g.fillStyle = NAVY;
    g.font = F(700, 28);
    g.fillText(`قائمة الطلاب وسجل الالتزام (${r.rows.length} طالب)`, W - M, 390);

    table(g, 420, cols, firstChunk, 48);
    footer(g);
  }));

  for (let i = PER_FIRST; i < studentData.length; i += PER_SUB) {
    const chunk = studentData.slice(i, i + PER_SUB);
    pages.push(await pdfPage(g => {
      header(g, 'تابع قائمة الطلاب');
      table(g, 220, cols, chunk, 50);
      footer(g);
    }));
  }

  const cleanSec = db.sectionShort(sectionId).replace(/[\/\s]/g, '-');
  return {
    blob: jpegsToPdf(pages),
    name: `تقرير-الحضور-الشهري-${cleanSec}-${dt.getFullYear()}-${dt.getMonth() + 1}.pdf`
  };
}

const reports = {

  pickStudent(el, id) {
    const s = db.student(id); const sc = scope(); if (!s || (sc.sections && !sc.sections.includes(s.sectionId))) return false;
    rep.sec = s.sectionId; rep.focus = id; rep.q = '';
    this.render(el); $('#rr-' + id, el)?.scrollIntoView({ block: 'center', behavior: 'smooth' }); return true;

    if (!secs.some(s => s.id === rep.sec)) rep.sec = '';
    el.onclick = e => {

      if (o) { rep.sec = o.dataset.openSec; rep.q = ''; rep.focus = ''; this.render(el); return; }

        const groups = db.grades().map(g => ({ g, ss: list.filter(s => s.gradeId === g.id) })).filter(x => x.ss.length);
        const stColor = r => r >= 90 ? 'var(--teal)' : r >= 75 ? 'var(--amber)' : 'var(--red)';
        $('#rep-apps', el).innerHTML = groups.length ? groups.map(({ g, ss }, gi) => `

/* ============ MARKS ============ */
// Colour of a score by percentage: >65 pass (green), 50..65 caution (yellow + parent note), <50 fail (red).
const markTone = (v, max) => {
  const p = v / max * 100;
  if (p > 65) return ['var(--teal)', 'var(--on-teal)', p >= 85 ? 'ممتاز' : 'ناجح', 'pass'];
  if (p >= 50) return ['var(--amber)', 'var(--on-amber)', 'ناجح · يحتاج تحسين', 'warn'];
  return ['var(--red)', 'var(--on-red)', 'راسب', 'fail'];
};
const markState = { sec: '', subj: '', kid: '' };
function scoreChip(v, max, big) {

  return `<span class="num" style="display:inline-flex;align-items:baseline;gap:3px;padding:${big ? '6px 14px' : '2px 10px'};border-radius:999px;background:${bg};color:${fg};font-weight:800;font-size:${big ? 22 : 14}px">${v}<small style="font-size:${big ? 13 : 11}px;opacity:.85">/ ${max}</small></span>`;
}

        ${!m.draft && val !== null ? '<span class="pill p-present" style="font-size:10px;padding:2px 6px">وصل لولي الأمر ✓</span>' : ''}
        ${scoreChip(val, m.max)}
        ${!m.draft && val !== null ? `<button type="button" class="btn sm" data-wa="${s.id}" title="إرسال النتيجة لواتساب ولي الأمر" style="padding:4px 8px;font-size:11px">${icon('send', 12)} واتساب</button>` : ''}
        ${can ? `<button type="button" class="btn sm" data-edm="${s.id}">تعديل</button>` : ''}
      </div>`;
    }).join('')}</div>
    ${hist.length ? `<div><b>سجل التعديلات</b><div class="small muted" style="margin:2px 0 4px">ينحفظ دائماً ولا يمكن حذفه.</div>${hist.map(h => histLine(h)).join('')}</div>` : ''}
    ${can ? `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;border-top:1px solid var(--line);padding-top:8px">
      ${m.draft ? `<button type="button" class="btn pr" id="pub-curr-sheet-btm">${icon('send', 16)}نشر الامتحان وإشعار أولياء الأمور</button>` : '<span></span>'}
      <button type="button" class="btn sm danger" id="del-curr-sheet">${icon('trash', 14)}حذف الامتحان</button>
    </div>` : ''}`;
  };
  modal(`${m.subject} · ${m.exam}`, `<div id="shbody" style="display:flex;flex-direction:column;gap:12px">${draw()}</div>`, (el, close) => {
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-edm]');
      if (b) editMarkModal(m, b.dataset.edm, () => { const box = $('#shbody', el); if (box) box.innerHTML = draw(); });
      const wb = e.target.closest('[data-wa]');
      if (wb) {
        const st = db.student(wb.dataset.wa);
        const g = db.guardian(st?.guardianId);
        const val = m.scores[st?.id] ?? 'لم يُمتحن';
        const rawPhone = (g?.phone || '').replace(/\D/g, '');
        const phone = rawPhone.replace(/^0/, '964');
        const txt = encodeURIComponent(`السلام عليكم ورحمة الله،\nنود إعلامكم بنتيجة الطالب (${st?.name}) في مادة (${m.subject}) - ${m.exam}:\nالدرجة: ${val} من ${m.max}.\n${db.settings().schoolName}`);
        window.open(`https://wa.me/${phone}?text=${txt}`, '_blank');
        return;
      }
      if (e.target.closest('#add-stu-res-btn')) {
        addStudentScoreModal(m, () => { const box = $('#shbody', el); if (box) box.innerHTML = draw(); });
      }
      if (e.target.closest('#pub-curr-sheet') || e.target.closest('#pub-curr-sheet-btm')) {
        const r = db.publishMarks(m.id, me);
        if (r.ok) {
          toast('تم نشر الدرجات', `${m.subject} · ${m.exam} · تم إشعار أولياء الأمور والطلاب`);
          const box = $('#shbody', el); if (box) box.innerHTML = draw();
          if (current?.view?.update) current.view.update(current.el);
        } else toast('تعذر النشر', r.error, 'absent');
      }
      if (e.target.closest('#del-curr-sheet')) {
        if (confirm(`هل أنت متأكد من حذف امتحان «${m.subject} - ${m.exam}» وجميع درجاته؟`)) {
          const r = db.deleteSheet(m.id, me);
          if (r.ok) {
            close();
            toast('انحذف الامتحان', `${m.subject} · ${m.exam}`);
            if (current?.view?.update) current.view.update(current.el);
          }
        }
      }
    });
  });
}

function addStudentScoreModal(m, done) {
  const me = actor();
  const studs = db.students(m.sectionId);
  const withoutScore = studs.filter(s => m.scores[s.id] == null);
  const list = withoutScore.length ? withoutScore : studs;

  modal('إضافة طالب / نتيجة: ' + m.subject, `<form id="asf" style="display:flex;flex-direction:column;gap:12px" novalidate>
    <div class="muted small">${esc(m.subject)} · ${esc(m.exam)} · الشعبة: ${esc(db.sectionLabel(m.sectionId))}</div>
    <label class="field" data-k="studentId">اختر الطالب
      <select class="input" name="studentId">
        ${list.map(s => `<option value="${s.id}">${esc(s.name)} (رقم ${s.no})${m.scores[s.id] != null ? ` - مسجل له حالياً: ${m.scores[s.id]}` : ''}</option>`).join('')}
      </select>
      <span class="help"></span>
    </label>
    <label class="field" data-k="value">الدرجة (من ${m.max})
      <input class="input num" name="value" type="number" min="0" max="${m.max}" inputmode="decimal" placeholder="0 - ${m.max}" required>
      <span class="help">من 0 إلى ${m.max}.</span>
    </label>
    ${m.draft ? '<div class="muted small">ملاحظة: الامتحان مسودة، فلن يتم إشعار ولي الأمر إلا عند نشر الامتحان بالكامل.</div>' : '<div class="muted small">ملاحظة: الامتحان منشور، وسيصل إشعار فوري لولي الأمر بهذه النتيجة.</div>'}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
      <button type="button" class="btn" data-close>إلغاء</button>
      <button class="btn pr" style="min-height:44px">${icon('check', 16)}إضافة النتيجة</button>
    </div>
  </form>`, (el, close) => {
    const f = $('#asf', el);
    f.onsubmit = e => {
      e.preventDefault();
      const sid = f.studentId.value;
      const val = f.value.value;
      if (val === '' || isNaN(val) || Number(val) < 0 || Number(val) > m.max) {
        const x = $('[data-k="value"]', el);
        x.classList.add('err');
        $('.help', x).textContent = `الدرجة لازم تكون بين 0 و ${m.max}.`;
        return;
      }
      const r = db.addStudentScore(m.id, sid, Number(val), me);
      if (!r.ok) {
        toast('خطأ', r.error, 'absent');
        return;
      }
      close();
      done();
      toast('أُضيفت النتيجة', `${db.student(sid)?.name} · ${val} من ${m.max}`);
    };
  });
}

function publishModal() {
  const me = actor();
  const c = ctx();
  const sc = scope();
  const allGrades = db.grades();

            <option value="">الصف بالكامل (جميع الشُعب)</option>
          </select>
        </label>
      </div>

    <div id="pub-drafts-box" style="display:flex;flex-direction:column;gap:10px"></div>

    <!-- Quick publish new exam for the entire class with one click -->
    <details id="pub-new-details" style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px">
      <summary style="font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;outline:none">
        ${icon('plus', 16)} رصد ونشر امتحان جديد للصف بالكامل بنقرة واحدة
      </summary>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
        <div class="grid g2" style="gap:10px">
          <label class="field">المادة
            <input class="input" id="pub-new-sub" value="${esc(teacherSubj || '')}" placeholder="مثال: الرياضيات" ${teacherSubj ? 'readonly' : ''}>
          </label>
          <label class="field">اسم الامتحان
            <input class="input" id="pub-new-exam" value="امتحان الشهر الأول" placeholder="مثال: امتحان نصف السنة">
          </label>
        </div>
        <div class="grid g2" style="gap:10px">
          <label class="field">الدرجة العظمى
            <input class="input num" id="pub-new-max" type="number" min="1" value="100">
          </label>
          <label class="field">نوع الامتحان
            <select class="input" id="pub-new-type">
              ${Object.entries(db.EXAM_TYPES).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}
            </select>
          </label>
        </div>
        <button type="button" class="btn pr" id="btn-quick-new-pub" style="min-height:46px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px">

        </button>
      </div>
    </details>

    <div style="display:flex;justify-content:flex-end;margin-top:4px">
      <button class="btn" data-close>إغلاق</button>
    </div>
  </div>`, (m, close) => {
    const gradeSel = $('#pub-grade-sel', m);
    const secSel = $('#pub-sec-sel', m);
    const box = $('#pub-drafts-box', m);

    const updateSecOptions = () => {
      const gid = gradeSel.value;
      const validSecs = allSecs.filter(s => !gid || s.gradeId === gid);
      secSel.innerHTML = `<option value="">${gid ? 'الصف بالكامل (جميع شُعب ' + esc(db.grade(gid)?.name || '') + ')' : 'كل الشعب والصفوف'}</option>` +
        validSecs.map(s => `<option value="${s.id}" ${s.id === initSecId ? 'selected' : ''}>${esc(db.sectionLabel(s.id))}</option>`).join('');
    };

    const updateBox = () => {
      const gid = gradeSel.value;
      const sid = secSel.value;
      const targetSecs = allSecs.filter(s => (!gid || s.gradeId === gid) && (!sid || s.id === sid));
      const targetSecIds = targetSecs.map(s => s.id);
      const drafts = db.marks({ sections: targetSecIds, includeDrafts: true }).filter(d => d.draft);
      const label = sid ? db.sectionLabel(sid) : (gid ? (db.grade(gid)?.name || 'الصف') : 'كل الصفوف');
      const studs = db.students().filter(s => targetSecIds.includes(s.sectionId));

      if (drafts.length > 0) {
        box.innerHTML = `
        <div class="card" style="background:var(--amber-soft);border:1.5px solid var(--amber);padding:14px;display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="ti" style="width:36px;height:36px;border-radius:11px;--ic:#C47F17">${icon('grade', 18)}</span>
            <div style="flex:1">
              <b>يوجد <span class="num">${drafts.length}</span> امتحانات محفوظة كمسودة لـ (${esc(label)})</b>
              <div class="small muted">تتضمن درجات <span class="num">${studs.length}</span> طالباً جاهزة للنشر الفوري.</div>
            </div>
          </div>
          <button type="button" class="btn pr" id="btn-pub-grade-all" style="min-height:50px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px">
            ${icon('send', 18)} نشر درجات «${esc(label)}» بالكامل الآن (${drafts.length} امتحان)
          </button>
          <div style="max-height:26vh;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-top:4px">
            ${drafts.map(d => `<div style="display:flex;align-items:center;justify-content:space-between;background:#fff;padding:8px 12px;border-radius:8px;border:1px solid var(--line)">
              <div style="font-size:13px"><b>${esc(d.subject)} · ${esc(d.exam)}</b> <span class="muted small">(${esc(db.sectionShort(d.sectionId))})</span></div>
              <button type="button" class="btn sm pr" data-pub-single="${d.id}" style="padding:4px 8px">${icon('send', 12)} نشر</button>
            </div>`).join('')}
          </div>
        </div>`;
      } else {
        box.innerHTML = `
        <div class="card" style="background:var(--teal-soft);border:1px solid var(--teal);padding:14px;display:flex;flex-direction:column;gap:6px">
          <div style="font-weight:700;color:var(--teal-ink);display:flex;align-items:center;gap:6px">
            ${icon('check', 18)} جميع درجات «${esc(label)}» منشورة ومحدّثة
          </div>
          <div class="small muted">لا توجد مسودات معلّقة لهذا الصف حالياً. لنشر درجات امتحان جديد للصف بالكامل، استخدم النموذج أدناه واضغط «نشر».</div>
        </div>`;
      }
    };

    updateSecOptions();
    updateBox();

    gradeSel.onchange = () => { initSecId = ''; updateSecOptions(); updateBox(); };
    secSel.onchange = () => { updateBox(); };

    m.addEventListener('click', e => {
      if (e.target.closest('#btn-pub-grade-all')) {
        const gid = gradeSel.value;
        const sid = secSel.value;
        const r = db.publishGradeMarks({ gradeId: gid, sectionId: sid }, me);
        if (r.ok) {
          const label = sid ? db.sectionLabel(sid) : (gid ? (db.grade(gid)?.name || 'الصف') : 'كل الصفوف');
          toast('تم نشر الدرجات', `تم نشر درجات «${label}» بالكامل بنجاح (${r.count} امتحان) وإشعار أولياء الأمور`);
          close();
          if (current?.view?.update) current.view.update(current.el);
        } else {
          toast('خطأ في النشر', r.error || 'حدث خطأ أثناء النشر', 'absent');
        }
        return;
      }

      const single = e.target.closest('[data-pub-single]');
      if (single) {
        const r = db.publishMarks(single.dataset.pubSingle, me);
        if (r.ok) {
          toast('تم نشر الدرجات', `${r.mark.subject} · ${r.mark.exam} · تم إشعار أولياء الأمور`);
          updateBox();
          if (current?.view?.update) current.view.update(current.el);
        }
        return;
      }

      if (e.target.closest('#btn-quick-new-pub')) {
        const gid = gradeSel.value;
        const sid = secSel.value;
        const subj = ($('#pub-new-sub', m)?.value || '').trim();
        const exam = ($('#pub-new-exam', m)?.value || '').trim();
        const max = Number($('#pub-new-max', m)?.value) || 100;
        const examType = $('#pub-new-type', m)?.value || 'monthly';
        if (!subj) { toast('تنبيه', 'يرجى كتابة أو اختيار اسم المادة أولاً', 'absent'); return; }

        const r = db.quickPublishGradeExam({ gradeId: gid, sectionId: sid, subject: subj, exam, max, examType }, me);
        if (r.ok) {
          const label = sid ? db.sectionLabel(sid) : (gid ? (db.grade(gid)?.name || 'الصف') : 'كل الصفوف');
          toast('تم نشر درجات الصف', `تم نشر امتحان «${subj} - ${exam}» لـ «${label}» بالكامل (${r.totalNotified} طالب) بنجاح`);
          close();
          if (current?.view?.update) current.view.update(current.el);
        } else {
          toast('تعذر النشر', r.error || 'تأكد من اختيار الصف والشعبة', 'absent');
        }
        return;
      }
    });
  });
}

function editMarkModal(m, studentId, done) {
  const s = db.student(studentId); const cur = m.scores[studentId] ?? null; const me = actor();
  modal('تعديل درجة: ' + s.name, `<form id="emf" style="display:flex;flex-direction:column;gap:12px" novalidate>
    <div class="muted small">${esc(m.subject)} · ${esc(m.exam)} · الدرجة الحالية: <b class="num">${cur ?? 'لا توجد'}</b> من ${m.max}</div>
    <label class="field" data-k="value">الدرجة الجديدة<input class="input num" name="value" type="number" min="0" max="${m.max}" value="${cur ?? ''}" inputmode="decimal"><span class="help">من 0 إلى ${m.max}.</span></label>
    <label class="field" data-k="reason">سبب التعديل (إلزامي)<input class="input" name="reason" placeholder="مثال: خطأ بالجمع، إعادة تصحيح الورقة"><span class="help">ينحفظ ويه التعديل، ويوصل إشعار لولي الأمر والإدارة.</span></label>
    <div class="card" style="padding:10px 12px;background:var(--surface-300);border:0" class="small">ينكتب باسمك: <b>${esc(me.name)}</b>${me.username ? ` · <span class="num" dir="ltr" style="font-weight:700">${esc(me.username)}</span>` : ''}</div>
    <div style="display:flex;gap:8px"><button class="btn pr" style="flex:1;min-height:46px">حفظ التعديل</button>${cur !== null ? '<button type="button" class="btn dg" id="delm" style="min-height:46px">حذف الدرجة</button>' : ''}</div></form>`, (el, close) => {
    const f = $('#emf', el);
    const submit = value => {
      const r = db.editMark(m.id, studentId, value, f.reason.value, me);
      $$('.field', el).forEach(x => x.classList.remove('err'));
      if (!r.ok) { const x = $(`[data-k="${r.field || 'reason'}"]`, el); x.classList.add('err'); $('.help', x).textContent = r.error; return; }
      close(); done(); toast(value === null ? 'انحذفت الدرجة' : 'تعدّلت الدرجة', `${s.name} · انحفظ بسجل التعديلات`);

    f.onsubmit = e => { e.preventDefault(); if (f.value.value === '') { const x = $('[data-k="value"]', el); x.classList.add('err'); $('.help', x).textContent = 'اكتب الدرجة، أو اضغط «حذف الدرجة».'; return; } submit(f.value.value); };
    $('#delm', el)?.addEventListener('click', () => submit(null));
  });
}

async function aiAnswer(q, kidId, role, history) {

  const prompt = `أنت مساعد مدرسة عراقية داخل منصة «حاضر». جاوب باللهجة العراقية، بجملتين أو ثلاث، ومن البيانات التالية فقط.
قواعد: لا تعطي أرقام تليفونات ولا معلومات عن طلاب أو أشخاص ثانيين. إذا السؤال يحتاج إنسان من المدرسة، أو ما تعرف الجواب من البيانات، قول هذا واقترح تحويله للإدارة. لا تخترع درجات أو مواعيد.

آخر المحادثة: ${JSON.stringify(history.slice(-6).map(m => ({ [m.from]: m.text })))}
السؤال: ${q}
رجّع JSON بس: {"reply":"...","action":"none|excuse|escalate|attendance|homework|marks|posts"}`;
  try {
    const r = await Promise.race([sample.json(prompt, { modelTier: 'quick', cache: false }), new Promise((_, rej) => setTimeout(() => rej(new Error('t')), 20000))]);
    if (!r?.reply) return null;
    const link = { attendance: { kind: 'link', label: role === 'student' ? 'سجل حضوري' : 'تفاصيل الحضور', href: role === 'student' ? '#/myatt' : '#/parent' }, homework: { kind: 'link', label: 'كل الواجبات', href: '#/posts' }, posts: { kind: 'link', label: 'كل المنشورات', href: '#/posts' }, marks: { kind: 'link', label: 'كل الدرجات', href: '#/marks' }, excuse: role === 'parent' ? { kind: 'excuse', label: 'تبرير الغياب' } : null, escalate: { kind: 'escalate', label: 'حوّل رسالتي للإدارة' } }[r.action];
    return { text: String(r.reply), actions: link ? [link] : [], ai: true };
  } catch { return null; }
}
