<head>

<title>حاضر · الحضور والانصراف</title>
<meta name="theme-color" content="#1E2B5C">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%201024%201024%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22g%22%20cx%3D%2228%25%22%20cy%3D%2218%25%22%20r%3D%22100%25%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232E408A%22/%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%231E2B5C%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23111936%22/%3E%3C/radialGradient%3E%3ClinearGradient%20id%3D%22gl%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23F7C873%22/%3E%3Cstop%20offset%3D%22.5%22%20stop-color%3D%22%23F2A93B%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23C98322%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%221024%22%20height%3D%221024%22%20rx%3D%22220%22%20fill%3D%22url%28%23g%29%22/%3E%3Cg%20transform%3D%22translate%28512%20512%29%20scale%283.5%29%20translate%28-165%20-74%29%22%3E%3Cg%20fill%3D%22none%22%20stroke-width%3D%2219%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cg%20stroke%3D%22%23FFFFFF%22%3E%3Cpath%20d%3D%22M198%20100%20V16%22/%3E%3Cpath%20d%3D%22M118%20100%20V88%20Q118%2064%20141%2064%20Q164%2064%20164%2088%20V100%20H78%20Q62%20100%2060%20116%20L57%20132%22/%3E%3Cpath%20d%3D%22M98%20100%20V86%22/%3E%3C/g%3E%3Cg%20stroke%3D%22%2334C3AE%22%3E%3Cpath%20d%3D%22M226%2062%20H272%20L240%20100%20H198%22/%3E%3C/g%3E%3C/g%3E%3Crect%20x%3D%22131.5%22%20y%3D%2226.5%22%20width%3D%2219%22%20height%3D%2219%22%20rx%3D%222.3%22%20transform%3D%22rotate%2845%20141%2036%29%22%20fill%3D%22%23F2A93B%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حاضر">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
<style>
/* حاضر · Hader — design tokens from the Hader design system */
:root{
  --brand:#1E2B5C; --on-brand:#FFFFFF;
  --teal:#0B7F70; --on-teal:#FFFFFF; --teal-ink:#08695C; --teal-soft:#E8F4F1;
  --amber:#F2A93B; --on-amber:#1E2B5C; --amber-ink:#8A5A0B; --amber-soft:#FDF1DA;
  --red:#C8453F; --on-red:#FFFFFF; --red-ink:#A9372F; --red-soft:#FBEAE9;
  --surface-100:#F5F7FA; --surface-200:#FFFFFF; --surface-300:#EEF1F6;
  --line:#E3E8EF; --line-strong:#77829A; --ink:#1E2B5C; --muted:#5B6478; --focus:#0B7F70;
  --side:#1E2B5C; --side-ink:#DDE3F5;
  --shadow-pop:0 18px 40px rgba(30,43,92,.18); --shadow-toast:0 14px 30px rgba(30,43,92,.35);
  --font-ar:Cairo,"Plus Jakarta Sans",system-ui,sans-serif;
  --font-latin:"Plus Jakarta Sans",Cairo,system-ui,sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
  color-scheme:light;
}
/* Day mode only, as requested: no dark theme. */
:root[data-theme="dark"]{color-scheme:light}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--surface-100);color:var(--ink);font-family:var(--font-ar);font-size:15px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.4;text-wrap:balance}
h1{font-size:26px}h2{font-size:18px}h3{font-size:16px}
.num{font-family:var(--font-latin);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)} .small{font-size:13px}
[hidden]{display:none!important}

/* layout */
.app{display:flex;min-height:100%}
.side{width:240px;flex:none;background:linear-gradient(180deg,#22306A 0%,#1E2B5C 45%,#172250 100%);color:var(--side-ink);padding:20px 14px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh;transition:width .2s ease-out;overflow:hidden}
.brand{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:2px 10px 16px;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,.1);color:#fff}
.brand b{font-size:22px}
.brand small{display:block;font-size:12px;color:var(--side-ink);line-height:1.2}
.nav a{position:relative;display:flex;align-items:center;gap:9px;padding:5px 8px;min-height:44px;white-space:nowrap;border-radius:12px;color:var(--side-ink);text-decoration:none;font-size:14.5px;font-weight:600;transition:background .15s ease-out,color .15s ease-out}
.nav a .ni{width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:rgba(255,255,255,.06);color:#C9D2EE;transition:background .15s ease-out}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a:hover .ni{background:rgba(255,255,255,.12);color:#fff}
.nav a.on{background:rgba(255,255,255,.13);color:#fff;font-weight:700}
.nav a.on .ni{background:var(--teal);color:#fff}
.nav a.on::before{content:"";position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:#F2A93B}
.nav a:focus-visible{outline:2px solid #34C3AE;outline-offset:2px}
.nsec{font-size:11.5px;font-weight:700;letter-spacing:.2px;color:rgba(221,227,245,.55);padding:14px 12px 4px}
.nav a .cnt{margin-inline-start:auto}
/* sidebar: brand and account stay fixed, only the sections list scrolls */
.side .nav{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px;scrollbar-width:thin}
.me{flex:none;margin-top:10px;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:rgba(10,16,40,.35);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:13px;line-height:1.5}
.me .who{display:flex;gap:10px;align-items:center}
.me .who .ell+.ell,.me .who span.ell{display:block;opacity:.75;font-size:12px}
.mebtn{width:34px;height:34px;flex:none;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:none;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.mebtn:hover{background:rgba(255,255,255,.1)}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebtn{min-height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:none;color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.sidebtn:hover{background:rgba(255,255,255,.08)}
.logout{min-height:42px;border-radius:10px;border:0;background:#C8453F;color:#fff;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.logout:hover{filter:brightness(1.08)}
.iconbtn.mob,.mob{display:none}
.logoutm{color:var(--red-ink);border-color:var(--red-ink)}
.main{flex:1;min-width:0;padding:22px 28px 90px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .t{flex:1;min-width:200px}
.bnav{display:none}

/* controls */
.btn{min-height:44px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface-200);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.pr{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn.nv{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.dg{border-color:var(--red-ink);color:var(--red-ink)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.input,select.input{min-height:44px;border:1px solid var(--line-strong);border-radius:var(--r-md);padding:0 12px;background:var(--surface-200);width:100%}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
.field .help{font-weight:400;color:var(--muted);font-size:12px}
.field.err .input{border-color:var(--red-ink)} .field.err .help{color:var(--red-ink);font-weight:700}
.search{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface-200);width:min(380px,100%);position:relative}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.kbd{border:1px solid var(--line-strong);border-radius:6px;padding:0 7px;font-size:12px;font-weight:700;color:var(--muted);font-family:var(--font-latin)}
.seg{display:inline-flex;background:var(--surface-300);border-radius:var(--r-md);padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-200);color:var(--ink)}
.toggle{width:44px;height:26px;border-radius:999px;background:var(--line-strong);position:relative;border:0;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--surface-200);transition:right .2s}
.toggle[aria-checked="true"]{background:var(--teal)} .toggle[aria-checked="true"]::after{right:21px}

/* surfaces */
.card{background:var(--surface-200);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.stat .n{font:700 36px/1.2 var(--font-latin);font-variant-numeric:tabular-nums;margin-top:6px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.bar{height:10px;border-radius:6px;background:var(--surface-300);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:6px;background:var(--teal);transition:width .4s}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;line-height:20px}
.p-present{background:var(--teal);color:var(--on-teal)} .p-late{background:var(--amber);color:var(--on-amber)}
.p-absent{background:var(--red);color:var(--on-red)} .p-excused{background:var(--amber-soft);color:var(--amber-ink)}
.p-left{background:var(--brand);color:var(--on-brand)} .p-pending,.p-quiet,.p-none,.p-holiday{background:var(--surface-300);color:var(--ink)}
.cnt{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--red);color:var(--on-red);font:700 12px/22px var(--font-latin);text-align:center;display:inline-block}
.av{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;background:var(--brand);color:var(--on-brand)}
.av.present{background:var(--teal);color:var(--on-teal)} .av.late,.av.excused{background:var(--amber);color:var(--on-amber)}
.av.absent{background:var(--red);color:var(--on-red)} .av.pending{background:var(--surface-300);color:var(--muted)} .av.left{background:var(--brand);color:var(--on-brand)}
.iconbtn{position:relative;width:44px;height:44px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface-200);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.iconbtn .cnt{position:absolute;top:-8px;left:-8px;border:2px solid var(--surface-100)}
.clock{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface-300);font-size:13px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block}
.dot.live{box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 25%,transparent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{color:var(--muted);font-weight:700;font-size:13px}
.tablewrap{overflow-x:auto}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{border-radius:var(--r-xl);border:1px solid var(--line);background:var(--surface-200);padding:16px;display:flex;flex-direction:column;gap:12px}
.tile.ok{background:var(--teal-soft);border-color:var(--teal)} .tile.bad{background:var(--red-soft);border-color:var(--red)}
.ti{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--brand);color:var(--on-brand);font:700 18px var(--font-latin);flex:none}
.tile.ok .ti{background:var(--teal);color:var(--on-teal)} .tile.bad .ti{background:var(--red);color:var(--on-red)}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.sec{border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--surface-100);cursor:pointer;text-align:right}
.sec b{display:block;font-size:16px}.sec span{font-size:12px;color:var(--muted)}
.sec.ok{background:var(--teal-soft);border-color:var(--teal)} .sec.warn{background:var(--amber-soft);border-color:var(--amber)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;font-size:12px;font-weight:700;text-align:center;cursor:pointer;border:1px solid transparent;background:var(--surface-100)}
.st.present{background:var(--teal-soft)} .st.late{background:var(--amber-soft)} .st.absent{background:var(--red-soft)} .st.excused{border-color:var(--amber)}
.st .av{width:46px;height:46px}

/* feed */
.feed .row{animation:none}
.feed .row.new{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--teal-soft)}to{background:transparent}}

/* overlays */
.toasts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 32px))}
.toast{display:flex;gap:12px;align-items:center;background:var(--brand);color:var(--on-brand);border-radius:var(--r-lg);padding:12px 16px;box-shadow:var(--shadow-toast);animation:drop .3s ease-out}
.toast small{display:block;opacity:.85;font-size:12px}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}}
.scrim{position:fixed;inset:0;background:rgba(15,20,36,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto}
.modal{background:var(--surface-200);border-radius:var(--r-xl);box-shadow:var(--shadow-pop);width:min(560px,100%);padding:22px;display:flex;flex-direction:column;gap:14px}
.modal header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pop{position:absolute;top:52px;left:0;width:min(420px,92vw);background:var(--surface-200);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);z-index:30;max-height:70vh;overflow:auto}
.pop .row{padding:10px 14px;cursor:pointer}
.pop .row:hover,.pop .row.on{background:var(--surface-300)}
mark{background:var(--amber-soft);color:inherit;border-radius:3px}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1fr minmax(320px,42%)}
.login .form{display:flex;align-items:center;justify-content:center;padding:32px 16px}
.login .form>div{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.login aside{background:var(--brand);color:var(--on-brand);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.otp{display:flex;gap:8px;justify-content:center;direction:ltr}
.otp input{width:48px;height:56px;text-align:center;font:700 22px var(--font-latin);border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-200)}
.demo{background:var(--amber-soft);border:1px solid var(--amber);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.8}
.demo button{background:none;border:0;padding:0;color:var(--teal-ink);font-weight:700;cursor:pointer;text-decoration:underline}

/* responsive */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  .side{display:none}
  .iconbtn.mob,.mob{display:inline-flex}
  .main{padding:16px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px))}
  .g3,.g2{grid-template-columns:1fr}
  h1{font-size:22px}
  .bnav{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--surface-200);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;position:relative;padding-top:4px}
  .bnav a.on{color:var(--ink)}
  .bnav a .cnt{position:absolute;top:-4px;left:calc(50% - 26px);min-width:18px;height:18px;line-height:18px;font-size:10px}
  .login{grid-template-columns:1fr}.login aside{display:none}
  .stat .n{font-size:28px}
  .search{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* print: the monthly report prints cleanly on A4 */
@media print{
  @page{size:A4 landscape;margin:10mm}
  .side,.bnav,.search,.clock,.iconbtn,.btn,.seg,.toasts{display:none!important}
  body{background:#fff;color:#000}
  .main{padding:0}
  .card{border-color:#ccc;break-inside:avoid}
  .mtab th,.mtab td{padding:3px 2px;font-size:10px}
}
/* Notification bell panel */
.bellwrap{position:relative;display:inline-flex}
.npop{position:absolute;top:calc(100% + 8px);left:0;width:min(380px,calc(100vw - 32px));max-height:min(70vh,520px);overflow:auto;background:var(--surface-200);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);z-index:40;text-align:right}
.npop .row{align-items:flex-start}
[data-bell][aria-expanded="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
/* bottom nav keeps plain icons */
.bnav a .ni{width:auto;height:auto;background:none;border-radius:0;color:inherit}
.bnav a.on::before{display:none}

/* Sidebar: floating rounded card, collapsible to icons only */
.brand{flex-direction:row;align-items:flex-start;justify-content:space-between}
.brand .bmain{display:flex;flex-direction:column;gap:6px;min-width:0}
.collapse{width:30px;height:30px;flex:none;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:none;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s ease-out}
.collapse:hover{background:rgba(255,255,255,.1)}
.nav a{min-height:42px}
.app.mini .side{width:72px;padding:18px 8px 12px}
.app.mini .brand{flex-direction:column;align-items:center;gap:10px;padding:0 0 12px}
.app.mini .brand .bmain small,.app.mini .nsec,.app.mini .nav a>span:not(.cnt),.app.mini .me .who>div,.app.mini .sidebtn,.app.mini .mebtn{display:none}
.app.mini .brand .bmain svg{width:52px;height:auto}
.app.mini .collapse{transform:scaleX(-1)}

@media (max-width:760px){
  .bnav{box-shadow:0 -4px 16px rgba(30,43,92,.06)}

  .bmore .cnt{position:absolute;top:-4px;left:calc(50% - 26px);min-width:18px;height:18px;line-height:18px;font-size:10px}
  .bnav a.on .ni,.bmore.on .ni{color:var(--teal)}
  .msheet:not([hidden]){display:block;position:fixed;inset:0;z-index:60}
  .mback{position:absolute;inset:0;background:rgba(17,25,54,.45);animation:fadein .18s}
  .mpanel{position:absolute;bottom:0;inset-inline:0;max-height:86vh;overflow:auto;background:var(--surface-100);border-radius:20px 20px 0 0;padding:8px 14px calc(18px + env(safe-area-inset-bottom,0px));animation:slideup .22s cubic-bezier(.2,.8,.2,1)}
  .mhandle{width:44px;height:5px;border-radius:9px;background:#CBD2DE;margin:2px auto 10px}
  .mme{display:flex;gap:10px;align-items:center;background:var(--surface-200);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px}
  .msec{font-size:12px;font-weight:700;color:var(--muted);margin:12px 4px 6px}

/* ---------------- lifecycle ---------------- */
function init() {

  const todayKey = dayKey(new Date());
  S = saved && saved.v === 5 && saved.day === todayKey ? saved : seed(saved?.clock?.mode === 'demo' ? 'demo' : 'real');
  S.seen = S.seen || {};

  if (!S.creds) S.creds = saved?.creds || seedCreds(); // generated logins survive a new demo day
  S.clock.real = Date.now(); // resume from where the page was closed
  tick(true);
  clearInterval(tickTimer);

function addEvent(ev, quiet) {
  ev.id = S.eid++; S.events.push(ev);
  const st = student(ev.studentId);
  // Catch-up on page load (quiet) still files the notifications; only live scans pop a toast.
  if (st) {
    const g = guardian(st.guardianId);
    const late = ev.type === 'in' && new Date(ev.ts).getHours() * 60 + new Date(ev.ts).getMinutes() > minutesOf(S.settings.late);
    notify(g.phone, {
      kind: ev.type === 'in' ? (late ? 'late' : 'in') : 'out',
      title: ev.type === 'in' ? `${late ? 'وصل متأخراً' : 'وصل إلى المدرسة'}: ${first(st.name)}` : `غادر المدرسة: ${first(st.name)}`,
      body: `${fmtTime(ev.ts)} · ${ev.method} · ${device(ev.deviceId)?.name.split(' · ')[0] ?? ''}`,
      ts: ev.ts, studentId: st.id,

  }
}

function tick(quiet) {
  if (S.clock.mode === 'real' && dayKey(new Date()) !== S.day) { const keep = { students: S.students, guardians: S.guardians, teachers: S.teachers, admins: S.admins, disabled: S.disabled, posts: S.posts, reads: S.reads, settings: S.settings, audit: S.audit, notes: S.notes, excuses: S.excuses, events: S.events, eid: S.eid, seen: S.seen, marks: S.marks, markReads: S.markReads, creds: S.creds, holidays: S.holidays, chats: S.chats, tickets: S.tickets, tt: S.tt, ttSeen: S.ttSeen, promotions: S.promotions, graduates: S.graduates, graduatedStore: S.graduatedStore, finalsSeeded: S.finalsSeeded };
    S = Object.assign(seed('real'), keep); IDX = null; emit('reset'); return; }
  const t = now();
  const base = S.today;
  let changed = false;
  for (const p of S.plan) {
    const dev = device(p.deviceId);
    if (p.inMin != null && !p.inDone && base + p.inMin * 60000 <= t) {
      p.inDone = true; changed = true;
      const ev = { studentId: p.studentId, type: 'in', ts: base + p.inMin * 60000 + (parseInt(String(p.studentId).replace(/\D/g, '')) * 7919 % 59) * 1000, deviceId: p.deviceId, method: p.method };
      if (dev.online) addEvent(ev, quiet); else dev.buffer.push(ev);
    }
    if (p.outMin != null && p.inDone && !p.outDone && base + p.outMin * 60000 <= t) {
      p.outDone = true; changed = true;
      const ev = { studentId: p.studentId, type: 'out', ts: base + p.outMin * 60000 + (parseInt(String(p.studentId).replace(/\D/g, '')) * 104729 % 59) * 1000, deviceId: p.deviceId, method: p.method };
      if (dev.online) addEvent(ev, quiet); else dev.buffer.push(ev);
    }
  }
  S.devices.forEach(d => { if (d.online) d.lastSeen = t; });
  // 8:30 absence alert to parents (once a day)
  if (!isHoliday() && !S.flags.absentSent && t >= atTime(base, S.settings.absentAt).getTime()) {
    S.flags.absentSent = true; changed = true;
    S.students.forEach(s => {
      if (statusOf(s.id).status === 'absent') {
        notify(guardian(s.guardianId).phone, { kind: 'absent', title: `لم يصل حتى الآن: ${first(s.name)}`, body: `لا توجد بصمة حتى ${fmtTime(atTime(base, S.settings.absentAt))}. اضغط لتبرير الغياب.`, ts: t, studentId: s.id });
      }
    });
  }
  // Automatic promotion on the date the school set.
  { const r = promoRules(); if (r.auto && r.autoDate && S.day >= r.autoDate && !(S.promotions || []).some(p => p.autoKey === r.autoDate && !p.undone)) { runPromotion('تلقائي', { auto: true }); changed = true; } }
  if (changed) emit('tick'); else listeners.forEach(fn => fn('clock'));
}

/* ---------------- attendance ---------------- */
let IDX = null, IDXN = -1;

const STATUS = {
  present: 'حاضر', late: 'متأخر', absent: 'غائب', excused: 'غائب بعذر', left: 'انصرف', pending: 'لم يصل بعد', none: 'لم يكن مسجّلاً', holiday: 'عطلة',

function statusOf(studentId, day = S.today) {
  const stu = student(studentId);
  if (stu && stu.since && day < stu.since) return { status: 'none' };
  if ((S.holiday && day === S.today) || offDay(day)) return { status: 'holiday' };
  const k = dayKey(new Date(day));
  const evs = indexed().get(studentId + '|' + k) || [];
  const inEv = evs.find(e => e.type === 'in');
  const outEv = [...evs].reverse().find(e => e.type === 'out');
  const excuse = S.excuses.find(x => x.studentId === studentId && x.day === k);
  if (!inEv) {

    const isToday = day === S.today;
    if (isToday && now() < atTime(day, S.settings.absentAt).getTime()) return { status: 'pending' };
    return { status: 'absent' };

function summary(list = S.students, day = S.today) {
  const c = { present: 0, late: 0, absent: 0, excused: 0, left: 0, pending: 0, none: 0, holiday: 0, total: 0 };
  list.forEach(s => { const st = statusOf(s.id, day).status; c[st]++; if (st !== 'none' && st !== 'holiday') c.total++; });
  c.came = c.present + c.late + c.left;
  c.rate = c.total ? Math.round(c.came / c.total * 100) : 0;
  return c;
}

  const h = [...String(ev.id) + ev.ts].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);

function sectionByText(text) {

  if (section(t)) return t;

  const hit = S.sections.find(s => [sectionLabel(s.id), sectionShort(s.id)].some(l => norm(l.replace(/\//g, ' ')) === n));
  if (hit) return hit.id;

/* ---------------- promotion (ترحيل الطلبة) ----------------

    cols.forEach(([l, w]) => { g.fillText(l, x - 12, y + rowH * .64); x -= w; }); y += rowH; g.font = F(400, 22);

function donut(parts, total, center, sub) {
  const R = 54, L = 2 * Math.PI * R; let off = 0;
  const arcs = parts.filter(p => p.v > 0).map(p => { const len = total ? p.v / total * L : 0; const s = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="16" stroke-dasharray="${Math.max(len - 2, 0)} ${L}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${p.l}: ${p.v}</title></circle>`; off += len; return s; }).join('');
  return `<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="${center} ${sub}"><circle r="${R}" cx="70" cy="70" fill="none" stroke="#EEF1F6" stroke-width="16"/>${arcs}<text x="70" y="70" text-anchor="middle" class="dn">${center}</text><text x="70" y="92" text-anchor="middle" class="ds">${sub}</text></svg>`;
}
function spark(vals, color = '#0B7F70') {
  if (vals.length < 2) return '';
  const w = 96, h = 30, mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * w, h - 3 - (v - mn) / rg * (h - 6)]);
  return `<svg viewBox="0 0 ${w} ${h}" class="spark" aria-hidden="true"><path d="M${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join('L')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="3" fill="${color}"/></svg>`;
}
// Attendance rate per school day (area) with absences (bars) underneath.
function trendChart(series) {
  const W = 640, H = 220, P = { l: 34, r: 10, t: 14, b: 34 }; const n = series.length; if (!n) return '';
  const iw = W - P.l - P.r, ih = H - P.t - P.b; const x = i => P.l + (n === 1 ? iw / 2 : i / (n - 1) * iw);
  const minR = Math.max(0, Math.min(80, Math.floor(Math.min(...series.map(s => s.rate)) / 10) * 10)); const y = r => P.t + ih - (r - minR) / (100 - minR) * ih;
  const maxA = Math.max(1, ...series.map(s => s.absent)); const bw = Math.min(18, iw / n * .45);
  const grid = [minR, (minR + 100) / 2, 100].map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#E3E8EF"/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end" class="ax">${Math.round(v)}%</text>`).join('');
  const bars = series.map((s, i) => `<rect x="${x(i) - bw / 2}" y="${H - P.b - s.absent / maxA * ih * .35}" width="${bw}" height="${s.absent / maxA * ih * .35}" rx="3" fill="#C8453F" opacity=".22"><title>${s.label}: ${s.absent} غائب</title></rect>`).join('');
  const line = series.map((s, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(s.rate).toFixed(1)}`).join('');
  const area = `${line}L${x(n - 1)},${H - P.b}L${x(0)},${H - P.b}Z`;
  const dots = series.map((s, i) => `<circle cx="${x(i)}" cy="${y(s.rate)}" r="${i === n - 1 ? 5 : 3}" fill="${i === n - 1 ? '#0B7F70' : '#fff'}" stroke="#0B7F70" stroke-width="2"><title>${s.label}: ${s.rate}% حضور · ${s.absent} غائب</title></circle>`).join('');
  const labels = series.map((s, i) => (i % Math.ceil(n / 8) === 0 || i === n - 1) ? `<text x="${x(i)}" y="${H - 12}" text-anchor="middle" class="ax">${s.short}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="نسبة الحضور لآخر ${n} يوم دراسي"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B7F70" stop-opacity=".28"/><stop offset="1" stop-color="#0B7F70" stop-opacity="0"/></linearGradient></defs>${grid}${bars}<path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="#0B7F70" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}
// Arrivals per 5 minutes this morning, with the late line.

  const W = 640, H = 170, P = { l: 10, r: 10, t: 10, b: 28 }; const iw = W - P.l - P.r, ih = H - P.t - P.b; const mx = Math.max(1, ...bins); const bw = iw / nb;

}

// Face capture with the device camera. The frame is grabbed at the green level and saved as a small JPEG;
// the first one becomes the student's reference photo.
function faceModal(s) {
  const c = ctx(); const by = `${c.name}${db.credOf(c.phone)?.username ? ' · ' + db.credOf(c.phone).username : ''}`;
  modal(db.photoOf(s.id) ? 'تحديث صورة الوجه' : 'صورة بصمة الوجه', `
    <div id="cam" style="height:280px;border-radius:16px;background:#1E2B5C;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">
      <video id="vid" playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none"></video>
      <svg width="190" height="230" viewBox="0 0 230 280" aria-hidden="true" style="position:relative"><ellipse cx="115" cy="130" rx="82" ry="108" fill="none" stroke="#34C3AE" stroke-width="4" stroke-dasharray="10 8"/></svg>
      <span class="pill" id="fq" style="position:absolute;top:12px;right:12px;background:var(--red);color:var(--on-red)">غير واضح</span>
      <span id="camnote" class="small" style="position:absolute;bottom:10px;inset-inline:10px;text-align:center;color:#DDE3F5">جاري فتح الكاميرا…</span></div>
    <div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px"><span>وضوح الوجه</span><span id="fqt">اقترب من الكاميرا</span></div>
      <div style="display:flex;gap:4px;height:14px;margin-top:8px" id="meter"><i style="flex:1;border-radius:0 7px 7px 0;background:var(--surface-300)"></i><i style="flex:1;background:var(--surface-300)"></i><i style="flex:1;border-radius:7px 0 0 7px;background:var(--surface-300)"></i></div>
      <div style="display:flex;font-size:12px;font-weight:700;text-align:center;margin-top:4px"><span style="flex:1;color:var(--red-ink)">غير واضح</span><span style="flex:1;color:var(--amber-ink)">اقترب قليلاً</span><span style="flex:1;color:var(--teal-ink)">واضح</span></div></div>
    ${db.photoOf(s.id) ? '<div class="small muted">الصورة الأولى تبقى محفوظة مثل ما هي. هذي تنضاف كتحديث.</div>' : '<div class="small muted">هذي الصورة تصير الصورة المرجعية للطالب، وتظهر للإدارة حتى تقارن بيها.</div>'}
    <button class="btn pr" id="cap" disabled>التقاط الصورة</button>`, (m, close) => {
    const bars = $$('#meter i', m); const colors = ['var(--red)', 'var(--amber)', 'var(--teal)']; const txt = ['اقترب من الكاميرا', 'اقترب قليلاً', 'واضح · جاهز للالتقاط'];
    const vid = $('#vid', m); let stream = null, lvl = -1, iv = null;
    const stop = () => { clearInterval(iv); stream?.getTracks().forEach(t => t.stop()); };
    const watch = setInterval(() => { if (!document.body.contains(m)) { stop(); clearInterval(watch); } }, 500);
    const step = () => { lvl = Math.min(2, lvl + 1); bars.forEach((b, i) => b.style.background = i === lvl ? colors[i] : 'var(--surface-300)'); $('#fqt', m).textContent = txt[lvl]; const fq = $('#fq', m); fq.textContent = ['غير واضح', 'مقبول', 'واضح ✓'][lvl]; fq.style.background = colors[lvl]; if (lvl === 2) { clearInterval(iv); $('#cap', m).disabled = false; } };
    const grab = () => {
      if (!stream || !vid.videoWidth) return null;
      const W = 240, H = 300, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
      const vw = vid.videoWidth, vh = vid.videoHeight, r = W / H; let sw = vh * r, sh = vh; if (sw > vw) { sw = vw; sh = vw / r; }
      g.translate(W, 0); g.scale(-1, 1); g.drawImage(vid, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, W, H);
      return cv.toDataURL('image/jpeg', 0.82);
    };
    const save = () => { const data = grab(); stop(); db.captureFace(s.id, data, by); close(); toast(data ? 'انحفظت صورة الوجه' : 'سُجّلت بصمة الوجه', data ? 'تُرسل للأجهزة، وتظهر بملف الطالب' : 'الكاميرا ما اشتغلت، فما انحفظت صورة'); };
    (async () => {
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('no camera');
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 } }, audio: false });
        if (!document.body.contains(m)) { stop(); return; }

    })();
    $('#cap', m).onclick = save;

}

function stampCanvas(cv) {
  if (!(protectedViewer() && db.protection().watermark)) return;
  const g = cv.getContext('2d'); const t = watermarkText(); const s = cv.width / 900;
  g.save(); g.globalAlpha = .13; g.fillStyle = '#1E2B5C'; g.font = `700 ${Math.round(18 * s)}px Cairo, Tahoma, sans-serif`; g.textAlign = 'center';

  g.restore();
}

/* ============ ASSISTANT: «اسأل المدرسة» (parents and students) ============ */
const ask = { kid: null, busy: false, ai: undefined };
const ASK_SUGGEST = { parent: ['شنو حالته اليوم؟', 'شنو الواجبات؟', 'آخر الدرجات', 'باچر دوام؟', 'أريد أبرر غياب', 'أريد أحچي ويه الإدارة'], student: ['حضوري هالشهر', 'شنو الواجبات؟', 'درجاتي', 'باچر دوام؟', 'آخر التبليغات'] };
async function aiSampler() {
  if (ask.ai !== undefined) return ask.ai;
  try { ask.ai = window.claude?.use ? await Promise.race([window.claude.use('sample'), new Promise(r => setTimeout(() => r(null), 4000))]) : null; } catch { ask.ai = null; }
  return ask.ai;
}
// The AI only ever sees the facts below (this child or this student, plus the school calendar); never phone numbers.
async function aiAnswer(q, kidId, role, history) {
  const sample = await aiSampler(); if (!sample) return null;
  const facts = { asker: role === 'parent' ? 'ولي أمر' : 'طالب', student: kidId ? db.studentFacts(kidId) : null, school: db.schoolFacts() };
  const prompt = `أنت مساعد مدرسة عراقية داخل منصة «حاضر». جاوب باللهجة العراقية، بجملتين أو ثلاث، ومن البيانات التالية فقط.
قواعد: لا تعطي أرقام تليفونات ولا معلومات عن طلاب أو أشخاص ثانيين. إذا السؤال يحتاج إنسان من المدرسة، أو ما تعرف الجواب من البيانات، قول هذا واقترح تحويله للإدارة. لا تخترع درجات أو مواعيد.
البيانات: ${JSON.stringify(facts)}
آخر المحادثة: ${JSON.stringify(history.slice(-6).map(m => ({ [m.from]: m.text })))}
السؤال: ${q}
رجّع JSON بس: {"reply":"...","action":"none|excuse|escalate|attendance|homework|marks|posts"}`;
  try {
    const r = await Promise.race([sample.json(prompt, { modelTier: 'quick', cache: false }), new Promise((_, rej) => setTimeout(() => rej(new Error('t')), 20000))]);
    if (!r?.reply) return null;
    const link = { attendance: { kind: 'link', label: role === 'student' ? 'سجل حضوري' : 'تفاصيل الحضور', href: role === 'student' ? '#/myatt' : '#/parent' }, homework: { kind: 'link', label: 'كل الواجبات', href: '#/posts' }, posts: { kind: 'link', label: 'كل المنشورات', href: '#/posts' }, marks: { kind: 'link', label: 'كل الدرجات', href: '#/marks' }, excuse: role === 'parent' ? { kind: 'excuse', label: 'تبرير الغياب' } : null, escalate: { kind: 'escalate', label: 'حوّل رسالتي للإدارة' } }[r.action];
    return { text: String(r.reply), actions: link ? [link] : [], ai: true };
  } catch { return null; }
}

/* ---------- teacher: today's tasks (the assistant that keeps the day organised) ---------- */
function teacherTasks(t) {
  const tasks = []; const wd = new Date(db.now()).getDay(); const holiday = db.isHoliday() || wd > 4;
  // today's lessons from the published timetable
  const lessons = []; if (!holiday) t.sections.forEach(id => { const pub = db.ttPublished(id); (pub?.[wd] || []).forEach((cl, i) => { if (cl && cl.teacher === t.name) lessons.push({ i, id, subject: cl.subject }); }); });
  lessons.sort((a, b) => a.i - b.i);
  const ps = db.periods();
  // absences to record in the sections
  t.sections.forEach(id => { const n = db.students(id).filter(s => db.statusOf(s.id).status === 'pending').length; if (n && !holiday) tasks.push({ ic: 'check', tone: 'a', text: `${n} طالب بـ${db.sectionShort(id)} بعدهم ما بصموا`, href: `#/section/${encodeURIComponent(id)}`, btn: 'تفقّد' }); });
  // missing final marks for my subject
  if (db.teacherCan(t.id, 'marks')) t.sections.forEach(id => { const subs = db.sectionSubjects(id).filter(s => s === t.subject); subs.forEach(sub => { const miss = db.students(id).filter(s => db.subjectResult(s.id, id, sub).missing).length; if (miss) tasks.push({ ic: 'grade', tone: 'r', text: `${miss} طالب بـ${db.sectionShort(id)} بدون درجة نهائية بـ${sub}`, href: '#/marks', btn: 'ارصد' }); }); });
  // students needing the second round in my subject
  t.sections.forEach(id => { const n = db.students(id).filter(s => { const x = db.subjectResult(s.id, id, t.subject); return !x.missing && !x.pass; }).length; if (n) tasks.push({ ic: 'alert', tone: 'a', text: `${n} طالب بـ${db.sectionShort(id)} راسبين بـ${t.subject} (يحتاجون متابعة أو دور ثاني)`, href: '#/promotion', btn: 'شوف' }); });
  // unanswered parent messages
  const open = db.teacherCan(t.id, 'inbox') ? db.openTickets({ sections: t.sections }) : 0; if (open) tasks.push({ ic: 'chat', tone: 'a', text: `${open} رسالة من أولياء الأمور بانتظار ردك`, href: '#/inbox', btn: 'رد' });
  // unpublished timetable edits
  const pend = db.teacherCan(t.id, 'tt') ? db.ttPending(t.sections) : 0; if (pend) tasks.push({ ic: 'calendar', tone: 'a', text: `${pend} جدول بيه تغييرات ما انتشرت`, href: '#/timetable', btn: 'انشر' });
  // homework due soon
  const hw = db.posts({ sections: t.sections, type: 'hw' }).filter(p => p.by === t.id && p.due).slice(0, 2);
  hw.forEach(p => tasks.push({ ic: 'hw', tone: 't', text: `واجب «${p.title}» موعده ${p.due}`, href: '#/posts', btn: 'فتح' }));
  return { lessons, ps, tasks, holiday };
}

function topbar(title, sub, actions = '') {

  const ck = db.clock();
  const un = db.unread(c.inbox);
  const canSearch = ['owner', 'admin', 'teacher'].includes(c.role);
  // Back button on every page except the account's home: returns to the previous page inside the platform,
  // or to the natural parent (a section → classes, a student → students, anything else → home).
  const atHome = current ? current.name === HOME[c.role] && !current.arg : true;
  return `<div class="top">
    ${atHome ? '' : `<button type="button" class="iconbtn backbtn" data-back aria-label="رجوع" title="رجوع">${icon('back', 20)}</button>`}
    <div class="t"><h1>${esc(title)}</h1><div class="muted small">${sub}</div></div>
    ${canSearch ? `<label class="search" id="gsearch">${icon('search', 18)}<input id="q" placeholder="ابحث عن طالب: اسم، رقم، هاتف ولي الأمر" autocomplete="off" aria-label="بحث عام"><span class="kbd">/</span><div class="pop" id="qpop" hidden></div></label>` : ''}
    <span class="clock" title="${ck.mode === 'real' ? 'الوقت الحقيقي' : 'ساعة العرض التجريبي'}"><span class="dot ${ck.paused && ck.mode !== 'real' ? '' : 'live'}"></span><span class="num" id="clk">${clockText()}</span>
      ${ck.mode === 'real' ? '' : `<button class="btn sm" data-clock="${ck.paused ? 'play' : 'pause'}" aria-label="${ck.paused ? 'تشغيل' : 'إيقاف'} الساعة" style="min-height:28px;padding:0 8px">${icon(ck.paused ? 'play' : 'pause', 14)}</button>`}</span>
    <button type="button" class="iconbtn mobonly" data-install title="ثبّت «حاضر» على شاشتك" aria-label="ثبّت التطبيق على الشاشة" ${matchMedia('(display-mode: standalone)').matches || navigator.standalone ? 'hidden' : ''}>${icon('download')}</button>
    <span class="bellwrap"><button type="button" class="iconbtn" data-bell aria-label="الإشعارات" aria-expanded="false" aria-haspopup="dialog">${icon('bell')}${un ? `<span class="cnt">${un}</span>` : ''}</button><div class="npop" id="npop" role="dialog" aria-label="الإشعارات" hidden></div></span>
    ${actions}
    <button class="iconbtn mob logoutm" data-logout aria-label="تسجيل الخروج">${icon('logout')}</button>
  </div>`;
}

// Hader wordmark: custom rounded Kufi «حاضر» in two tones: the ح in teal (present ✓), the rest in navy, and the gold "something new" diamond.
const WM_REST = '<path d="M198 100 V16"/><path d="M118 100 V88 Q118 64 141 64 Q164 64 164 88 V100 H78 Q62 100 60 116 L57 132"/><path d="M98 100 V86"/>';
const WM_HAH = '<path d="M226 62 H272 L240 100 H198"/>';
const WM = WM_REST + WM_HAH;
const wmInner = (color, teal, dot) => `<g fill="none" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"><g stroke="${color}">${WM_REST}</g><g stroke="${teal}">${WM_HAH}</g></g><rect x="131.5" y="26.5" width="19" height="19" rx="2.3" transform="rotate(45 141 36)" fill="${dot}"/>`;
function wordmark(h = 32, color = '#1E2B5C', dot = '#F2A93B') {
  const w = Math.round(h * 242 / 140);
  const teal = color === '#1E2B5C' ? '#0B7F70' : '#34C3AE';
  return `<svg width="${w}" height="${h}" viewBox="44 4 242 140" role="img" aria-label="حاضر" style="display:block">${wmInner(color, teal, dot)}</svg>`;
}
let logoN = 0;
function logo(size = 32) {
  const id = 'hl' + (++logoN);
  return `<svg width="${size}" height="${size}" viewBox="0 0 1024 1024" aria-hidden="true" style="display:block;flex:none"><defs><radialGradient id="${id}g" cx="28%" cy="18%" r="100%"><stop offset="0" stop-color="#2E408A"/><stop offset=".55" stop-color="#1E2B5C"/><stop offset="1" stop-color="#111936"/></radialGradient><linearGradient id="${id}l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7C873"/><stop offset=".5" stop-color="#F2A93B"/><stop offset="1" stop-color="#C98322"/></linearGradient></defs><rect width="1024" height="1024" rx="230" fill="url(#${id}g)"/><rect x="40" y="40" width="944" height="944" rx="196" fill="none" stroke="url(#${id}l)" stroke-opacity=".45" stroke-width="${size < 48 ? 0 : 5}"/><g transform="translate(512 512) scale(${size < 48 ? 3.4 : 2.85}) translate(-165 -74)">${wmInner('#FFFFFF', '#34C3AE', `url(#${id}l)`)}</g></svg>`;
}

/* ---------- global search ---------- */
// Picking a student from the global search: pages that can show that student in place (reports, attendance)
// do so and keep you where you are; everywhere else opens the student's profile.
function go(href) {
  const m = href.match(/^#\/student\/(.+)$/);
  if (m && current?.view?.pickStudent && current.view.pickStudent(current.el, m[1])) return;
  location.hash = href;
}
function bindSearch(root) {
  const input = $('#q', root); if (!input) return;
  const pop = $('#qpop', root); let sel = 0, items = [];
  const run = () => {
    const q = input.value.trim();
    if (!q) { pop.hidden = true; return; }
    const r = db.search(q, scope());
    const mark = s => { const n = norm(q); const i = norm(s).indexOf(n); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };
    items = [
      ...r.students.map(s => { const st = db.statusOf(s.id).status; return { href: `#/student/${s.id}`, html: `${avatar(s.name, st, db.photoOf(s.id))}<div style="flex:1;min-width:0"><b>${mark(s.name)}</b><div class="muted small">${esc(db.sectionShort(s.sectionId))} · رقم <span class="num">${s.no}</span></div></div>${pill(st)}` }; }),
      ...r.sections.map(s => ({ href: `#/section/${s.id}`, html: `<span class="ti" style="width:40px;height:40px;font-size:13px">${esc(db.grade(s.gradeId).short)}</span><div style="flex:1"><b>${esc(db.sectionLabel(s.id))}</b><div class="muted small">${db.students(s.id).length} طالباً</div></div>` })),
      ...r.guardians.map(g => { const kids = db.childrenOf(g.id); return { href: `#/student/${kids[0]?.id}`, html: `<span class="av" style="background:var(--surface-300);color:var(--ink)">و</span><div style="flex:1"><b>${mark(g.name)}</b><div class="muted small">ولي أمر ${esc(kids.map(k => db.first(k.name)).join('، '))} · <span class="num" dir="ltr">${maskPhone(g.phone)}</span></div></div>` }; }),
    ];
    sel = 0;
    pop.innerHTML = items.length ? items.map((it, i) => `<div class="row ${i === sel ? 'on' : ''}" data-href="${it.href}">${it.html}</div>`).join('') : `<div class="empty">لا نتائج لـ «${esc(q)}»</div>`;
    pop.hidden = false;
  };
  input.addEventListener('input', run);
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; $$('.row', pop).forEach((r, i) => r.classList.toggle('on', i === sel)); }
    if (e.key === 'Enter' && items[sel]) { go(items[sel].href); input.value = ''; pop.hidden = true; }
    if (e.key === 'Escape') { input.value = ''; pop.hidden = true; input.blur(); }
  });
  pop.addEventListener('mousedown', e => { const r = e.target.closest('[data-href]'); if (r) { e.preventDefault(); go(r.dataset.href); input.value = ''; pop.hidden = true; } });
  input.addEventListener('blur', () => setTimeout(() => { pop.hidden = true; }, 150));
}
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { const q = $('#q'); if (q) { e.preventDefault(); q.focus(); } }
});

/* ---------- router ---------- */
// Signed in on another device with the same number → sign this one out and say why.
function checkDevice() {
  if (db.session() && !db.sessionValid()) { db.kickOut(); current = null; location.hash = ''; route(); return false; }
  return true;
}
window.addEventListener('storage', e => { if (e.key === db.ACTIVE_EVENT_KEY) checkDevice(); });
function route() {
  if (db.session() && !db.sessionValid()) db.kickOut();
  const c = ctx();
  const [rawName = '', rawArg] = location.hash.replace(/^#\/?/, '').split('/');
  const name = rawName.split('?')[0]; let arg = rawArg && rawArg.split('?')[0];
  try { if (arg) arg = decodeURIComponent(arg); } catch { } // Arabic section ids arrive URL-encoded
  if (!c) { current = null; app.innerHTML = ''; views.login.render(app); return; }
  { const u = db.credOf(c.phone); db.setActor(`${c.name}${u && !u.pending ? ' · ' + u.username : ''} (${c.roleInfo.label.split(' · ')[0]})`); }
  const allowed = [...navFor(c).map(n => n[0]), 'notes', ...(['owner', 'admin', 'teacher'].includes(c.role) ? ['student', 'section'] : [])];
  const target = allowed.includes(name) && views[name] ? name : HOME[c.role];
  if (target !== name) { location.replace(`#/${target}`); return; }
  // Remember where we came from so the back button returns there (not out of the platform).
  const here = `#/${name}${arg ? '/' + arg : ''}`;
  if (navStack[navStack.length - 1] !== here) { if (navStack[navStack.length - 2] === here) navStack.pop(); else navStack.push(here); if (navStack.length > 30) navStack.shift(); }
  app.innerHTML = shell(c, name);
  const main = $('#main');
  current = { name, arg, view: views[name], el: main };
  views[name].render(main, arg);
  bindChrome();
  applyProtection();
  window.scrollTo(0, 0);
}

function bindChrome() { bindSearch(app); }
app.addEventListener('click', e => onChromeClick(e));
// Phone fields: digits only, never more than 11 (Iraqi mobile 07XXXXXXXXX). Also on paste of +964 / spaced numbers.
document.addEventListener('input', e => {
  const i = e.target; if (!i.matches?.('input[data-phone]')) return;
  let d = i.value.replace(/\D/g, '');
  if (d.startsWith('00964')) d = '0' + d.slice(5); else if (d.startsWith('964')) d = '0' + d.slice(3);
  d = d.slice(0, 11);
  if (i.value !== d) i.value = d;
});
function goBack() {
  const c = ctx(); navStack.pop();
  const prev = navStack[navStack.length - 1];
  const parent = { student: '#/students', section: '#/classes' }[current?.name];
  location.hash = prev || parent || `#/${HOME[c.role]}`;
}
function onChromeClick(e) {
  if (e.target.closest('[data-chpw]')) { changePwModal(); return; }
  if (e.target.closest('[data-back]')) { goBack(); return; }
  if (e.target.closest('[data-collapse]')) { const a = $('.app'); const on = !a.classList.contains('mini'); a.classList.toggle('mini', on); try { localStorage.setItem('hader-mini', on ? '1' : '0'); } catch { } return; }
  if (e.target.closest('[data-bell]')) { toggleBell(); return; }
  if (e.target.closest('#npop a')) { closeBell(); return; }
  const b = e.target.closest('[data-logout],[data-role],[data-clock]'); if (!b) return;
  if (b.dataset.logout !== undefined) { db.logout(); location.hash = ''; route(); }
  else if (b.dataset.role) { db.setActiveRole(b.dataset.role); location.hash = ''; route(); }
  else if (b.dataset.clock) { db.setPaused(b.dataset.clock === 'pause'); }
}

/* ---------- bell: tap → panel with the latest notifications; opening it clears the count ---------- */
let bellFresh = null;
function renderBell() {
  const p = $('#npop'); if (!p || p.hidden) return;
  const c = ctx(); const list = db.notes(c.inbox).slice(0, 8);
  p.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)"><b style="flex:1;font-size:16px">الإشعارات</b><a href="#/notes" class="small" style="color:var(--teal-ink);font-weight:700">كل الإشعارات</a></div>
    <div style="padding:0 14px">${notesList(list, bellFresh)}</div>`;
}
function toggleBell() { const p = $('#npop'); if (!p) return; if (p.hidden) openBell(); else closeBell(); }
function openBell() {
  const p = $('#npop'), b = $('[data-bell]'); const c = ctx();
  bellFresh = new Set(db.notes(c.inbox).filter(n => !n.read).map(n => n.id));
  p.hidden = false; b.setAttribute('aria-expanded', 'true'); renderBell();
  if (bellFresh.size) db.readAll(c.inbox); // count goes to zero, new ones stay highlighted in the panel
}
function closeBell() { const p = $('#npop'); if (p) p.hidden = true; $('[data-bell]')?.setAttribute('aria-expanded', 'false'); bellFresh = null; }
document.addEventListener('mousedown', e => { if (!e.target.closest('.bellwrap')) closeBell(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBell(); });

function changePwModal() {
  modal('تغيير الرمز', `<form id="cp" style="display:flex;flex-direction:column;gap:12px" novalidate>
    ${pwField('old', 'الرمز الحالي')}${pwField('np', 'الرمز الجديد', '', 'new-password', '8 أحرف أو أكثر، بيها حروف وأرقام.')}${pwField('np2', 'أعد كتابة الرمز الجديد', '', 'new-password')}
    <button class="btn pr" style="min-height:48px">حفظ</button></form>`, (m, close) => {
    bindEyes(m);
    $('#cp', m).onsubmit = e => {
      e.preventDefault();
      const r = db.changeOwnPassword($('#old', m).value, $('#np', m).value, $('#np2', m).value);
      $$('.field', m).forEach(f => f.classList.remove('err'));
      if (!r.ok) { const i = $('#' + ({ old: 'old', pw: 'np', pw2: 'np2' }[r.field]), m); const f = i.closest('.field'); f.classList.add('err'); $('.help', f).textContent = r.error; return; }
      close(); toast('تغيّر الرمز', 'من الدخول الجاي استخدم الرمز الجديد');
    };
  });
}

/* ---------- live updates ---------- */
db.subscribe(what => {
  if (!current) return;
  if (!checkDevice()) return;
  const c = ctx(); if (!c) return;
  const clk = $('#clk'); if (clk) clk.innerHTML = clockText();
  if (what === 'clock') {
    const btn = $('[data-clock]');
    if (btn && (btn.dataset.clock === 'pause') === db.clock().paused) refreshTop();
    return;
  }
  // new notification for this account → toast
  const n = db.notes(c.inbox);
  const fresh = n.filter(x => !x.read).length;
  if (fresh > lastNoteCount && n[0] && !n[0].read) toast(n[0].title, n[0].body, n[0].kind);
  lastNoteCount = fresh;
  refreshTop();
  if (bellFresh) { const c2 = ctx(); db.notes(c2.inbox).filter(n => !n.read).forEach(n => bellFresh.add(n.id)); if (db.unread(c2.inbox)) setTimeout(() => db.readAll(c2.inbox)); renderBell(); }
  current.view.update?.(current.el, current.arg, what);
});
function refreshTop() {
  // Re-render the bell counts and the clock button without touching inputs.
  const c = ctx(); const un = db.unread(c.inbox);
  $$('[data-bell]').forEach(a => { a.querySelector('.cnt')?.remove(); if (un) a.insertAdjacentHTML('beforeend', `<span class="cnt">${un}</span>`); });
  ['notes', 'posts', 'marks', 'inbox', 'ask', 'timetable'].forEach(id => { const n = badgeFor(c, id); $$(`.nav a[href="#/${id}"],.bnav a[href="#/${id}"],.mtile[href="#/${id}"]`).forEach(a => { a.querySelector('.cnt')?.remove(); if (n) a.insertAdjacentHTML('beforeend', `<span class="cnt">${n}</span>`); }); });
  { const mb = $('[data-more]'); if (mb) { const prim = PRIMARY[c.role] || []; const n = navFor(c).filter(it => !prim.includes(it[0])).reduce((a, it) => a + badgeFor(c, it[0]), 0); mb.querySelector('.cnt')?.remove(); if (n) mb.insertAdjacentHTML('beforeend', `<span class="cnt">${n}</span>`); } }
  const btn = $('[data-clock]'); if (btn) { const p = db.clock().paused; btn.dataset.clock = p ? 'play' : 'pause'; btn.innerHTML = icon(p ? 'play' : 'pause', 14); $('.clock .dot')?.classList.toggle('live', !p); }
}

window.addEventListener('hashchange', route);
db.init();
lastNoteCount = ctx() ? db.unread(ctx().inbox) : 0;
route();

/* ---------- app on the home screen (PWA) and the number on the app icon ---------- */
let installEvt = null;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function showInstallBtn() { $$('[data-install]').forEach(b => b.hidden = standalone()); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstallBtn(); });
window.addEventListener('appinstalled', () => { installEvt = null; showInstallBtn(); toast('انضاف «حاضر» لشاشتك', 'تفتحه من الأيقونة مثل أي تطبيق'); });
document.addEventListener('click', async e => {
  if (!e.target.closest('[data-install]')) return;
  if (installEvt) { installEvt.prompt(); const r = await installEvt.userChoice; if (r.outcome === 'accepted') installEvt = null; return; }
  const hosted = /^https?:$/.test(location.protocol) && !/claude|usercontent|artifact/.test(location.hostname);
  modal('ثبّت «حاضر» على شاشتك', `<div style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;gap:14px;align-items:center">${logo(64)}<div><b>أيقونة «حاضر» تطلع على شاشة التليفون</b><div class="muted small">تفتحه منها مثل أي تطبيق، بدون متصفح، ويه عدد الإشعارات على الأيقونة.</div></div></div>
    ${hosted ? '' : '<div class="card" style="background:var(--amber-soft);border-color:#F2D29A;padding:10px 14px" ><b>هذي معاينة.</b> التثبيت يشتغل من رابط المنصة الحقيقي بعد ما ننشرها على الإنترنت (مثلاً على Vercel). الأيقونات والإعدادات جاهزة بالمشروع.</div>'}
    <div><b>آيفون (Safari)</b><ol class="small" style="margin:6px 0 0;padding-inline-start:20px;line-height:2"><li>افتح رابط المنصة بـSafari</li><li>اضغط زر المشاركة (المربع والسهم)</li><li>اختار «إضافة إلى الشاشة الرئيسية» ثم «إضافة»</li></ol></div>
    <div><b>أندرويد (Chrome)</b><ol class="small" style="margin:6px 0 0;padding-inline-start:20px;line-height:2"><li>افتح رابط المنصة بـChrome</li><li>اضغط النقاط الثلاث فوك</li><li>اختار «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»</li></ol></div>
    <div><b>الحاسبة (Chrome أو Edge)</b><div class="small muted">اضغط أيقونة التثبيت يم شريط العنوان.</div></div>
    <button class="btn pr" data-close>تمام</button></div>`);
});
// Unread notifications appear as a number on the app icon (phones and computers that support it).
function appBadge() { try { const c = ctx(); const n = c ? db.unread(c.inbox) : 0; if ('setAppBadge' in navigator) (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {}); } catch { } }
db.subscribe(() => { appBadge(); showInstallBtn(); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
setTimeout(() => { showInstallBtn(); appBadge(); }, 500);

/* ---------- privacy: protect what parents and students see ----------
   A website cannot fully block screenshots (only a native app can). What it can do: no downloads, no copy/print,
   cover the screen when the app goes to the background, and stamp every screen, page and video with the viewer's
   name and number so any photo of it shows who took it. */
function protectedViewer() { const c = ctx(); return !!c && (c.role === 'parent' || c.role === 'student'); }
function watermarkText() { const c = ctx(); if (!c) return ''; const ph = String(c.phone || ''); return `${c.name} · ${ph.slice(0, 4)}•••${ph.slice(-3)} · ${fmtDay(new Date(db.now()))}`; }
function watermarkTile(text, op = 0.13, color = '#1E2B5C') {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220"><text x="180" y="110" text-anchor="middle" fill="${color}" stroke="${color === '#FFFFFF' ? '#000' : 'none'}" stroke-opacity="${op * .6}" stroke-width=".6" fill-opacity="${op}" font-family="Cairo, Tahoma, sans-serif" font-size="15" font-weight="700" transform="rotate(-24 180 110)">${text.replace(/[<&>]/g, '')}</text></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function applyProtection() {
  const p = db.protection(); const on = protectedViewer();
  document.body.classList.toggle('prot-copy', on && p.noCopy);
  document.body.classList.toggle('prot-print', on);
  let wm = document.getElementById('wm');
  if (on && p.watermark) { if (!wm) { wm = document.createElement('div'); wm.id = 'wm'; wm.setAttribute('aria-hidden', 'true'); document.body.append(wm); } wm.style.backgroundImage = watermarkTile(watermarkText()); }
  else wm?.remove();
}
const blocked = e => protectedViewer() && db.protection().noCopy;
document.addEventListener('contextmenu', e => { if (blocked() && !e.target.closest('input,textarea')) e.preventDefault(); });
document.addEventListener('dragstart', e => { if (blocked() && e.target.closest('img,video,canvas,a')) e.preventDefault(); });
document.addEventListener('copy', e => { if (blocked() && !e.target.closest?.('input,textarea')) { e.preventDefault(); toast('النسخ غير مسموح', 'محتوى المدرسة خاص', 'absent'); } });
document.addEventListener('keydown', e => {
  if (!protectedViewer()) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ['s', 'p'].includes(k)) { e.preventDefault(); toast(k === 'p' ? 'الطباعة غير مسموحة' : 'الحفظ غير مسموح', 'محتوى المدرسة خاص', 'absent'); }
  if (k === 'printscreen') { veil(true); setTimeout(() => veil(false), 1200); try { navigator.clipboard?.writeText(''); } catch { } toast('لقطة الشاشة غير مسموحة', 'كل صورة تطلع عليها اسمك ورقمك', 'absent'); }
});
function veil(v) { document.body.classList.toggle('veiled', v && protectedViewer() && db.protection().blurOnLeave); }
document.addEventListener('visibilitychange', () => veil(document.hidden));
window.addEventListener('blur', () => veil(true));
window.addEventListener('focus', () => veil(false));
window.addEventListener('beforeprint', () => { if (protectedViewer()) toast('الطباعة غير مسموحة', 'محتوى المدرسة خاص', 'absent'); });
db.subscribe(w => { if (w === 'settings') applyProtection(); });

})();
